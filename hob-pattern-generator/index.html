<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HOB Pattern Generator</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 fill=%22%232a0a0c%22/%3E%3Crect x=%226%22 y=%2210%22 width=%2230%22 height=%229%22 fill=%22%23f3e9a8%22/%3E%3Crect x=%2228%22 y=%2224%22 width=%2230%22 height=%229%22 fill=%22%23f3e9a8%22/%3E%3Crect x=%226%22 y=%2238%22 width=%2222%22 height=%229%22 fill=%22%23f3e9a8%22/%3E%3Crect x=%2236%22 y=%2250%22 width=%2222%22 height=%227%22 fill=%22%23f3e9a8%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Source+Code+Pro:wght@400&family=Syne:wght@800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#000;color:#fff;overflow:hidden;font:400 13px/1.35 "Inter","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column}
/* ---------- Back nav (shared across all sandbox projects) ---------- */
nav.back{box-sizing:border-box;flex:none;display:flex;align-items:center;gap:8px;height:49px;padding:0 20px;background:#000;border-bottom:1px solid #1c1c1c;font:400 13px/1.35 "Inter","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
nav.back a{color:#8d8d8d;text-decoration:none}
nav.back a:hover,nav.back a:focus-visible{color:#fff;text-decoration:underline;text-underline-offset:3px}
nav.back span{color:#6e6e6e}
nav.back b{font-weight:500;color:#fff;overflow:hidden;text-overflow:ellipsis}
@media (max-width:640px){nav.back{padding:0 16px}nav.back>span:nth-of-type(2),nav.back>b{display:none}}
main{flex:1;min-height:0;display:flex;overflow:hidden;background:#efefef}
.stage{flex:1;min-width:0;position:relative}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
aside{flex:none;width:300px;background:#fff;border-left:1px solid #e6e6e6;color:#111;padding:20px 20px 28px;overflow-y:auto}
aside h2{font:500 13px/1 "Inter",sans-serif;margin:0 0 16px}
aside section{padding-bottom:20px;margin-bottom:20px;border-bottom:1px solid #ececec}
aside section:last-child{border:0;margin:0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
button{font:500 12px "Inter",sans-serif;color:#111;background:#f3f3f3;border:0;border-radius:8px;padding:10px 6px;cursor:pointer}
button:hover{background:#e8e8e8}
button:focus-visible,input:focus-visible{outline:2px solid #3d4ee0;outline-offset:2px}
button[aria-pressed="true"]{background:#111;color:#fff}
.row{display:grid;grid-template-columns:88px 1fr 34px;align-items:center;gap:10px;margin-bottom:14px;font-size:12px;color:#777}
.row output{color:#111;text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:#111}
.field{display:flex;align-items:center;justify-content:space-between;background:#f3f3f3;border-radius:10px;padding:0 14px;height:42px;margin-bottom:14px;font-size:13px;color:#888}
.field input{all:unset;width:60px;color:#111;font-size:13px}
.field svg{color:#777}
.cap{font-size:12px;color:#777;margin:0 0 6px}
.tog{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#f3f3f3;padding:3px;border-radius:10px;margin-bottom:14px}
.tog button{padding:9px 6px;background:transparent}
.tog button[aria-pressed="true"]{background:#fff;color:#111;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.wide{width:100%;display:block;margin-top:6px}
button.rec{background:#fbe3e0;color:#d6453d;font-size:13px;padding:12px}
button.rec:hover{background:#f7d3cf}
button.go{background:#5ca0ff;color:#fff}
button.go:hover{background:#4a91f5}
button:disabled{opacity:.45;cursor:default}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:9;padding:16px}
.ov.on{display:flex}
.card{background:#fff;color:#111;border-radius:24px;padding:22px;width:min(420px,100%)}
.card header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.card h3{font:600 16px "Inter",sans-serif}
.card .x{padding:2px 8px;background:none;font-size:22px;line-height:1}
.card video{width:100%;border-radius:12px;background:#000;margin-bottom:14px;display:block}
.ph{display:flex;align-items:center;gap:10px;margin:-4px 0 16px;font:400 12px "Inter",sans-serif;color:#777;font-variant-numeric:tabular-nums}
.ph .tr{position:relative;flex:1;height:18px;cursor:pointer;touch-action:none}
.ph .tr:before{content:"";position:absolute;left:0;right:0;top:7px;height:4px;border-radius:2px;background:#ececec}
.ph .fl{position:absolute;left:0;top:7px;height:4px;border-radius:2px;background:#5ca0ff;width:0}
.ph .kn{position:absolute;top:1px;width:3px;height:16px;margin-left:-1.5px;border-radius:2px;background:#111;left:0}
.card .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card .two button{padding:16px 8px;border-radius:14px;font-size:14px}
@media (max-width:760px){main{flex-direction:column}.stage{flex:1 1 55%}aside{width:auto;border-left:0;border-top:1px solid #e6e6e6;flex:none;max-height:45%}}
.clip aside{display:none}

/* sandbox project bar: the home page nav's 72px height, SANDBOX / PROJECT NAME in its all-caps label style, any controls on the right */
html body nav.back{box-sizing:border-box;flex:none;align-self:stretch;width:auto;align-items:center;gap:10px;height:72px;min-height:72px;padding:0 30px;background:#181716;border-bottom:1px solid rgba(255,255,255,.1);color:#fff;font:400 13px/1.35 "Inter","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;white-space:nowrap;overflow:hidden}
html body nav.back>a,html body nav.back>span,html body nav.back>b{font:400 12px/1.3 "Inter","Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;text-decoration:none}
html body nav.back>a{color:#989898;transition:color .2s}
html body nav.back>a:hover,html body nav.back>a:focus-visible{color:#fff;text-decoration:none}
html body nav.back>span{color:#6b6b6b}
html body nav.back>b{font-weight:400;color:#fff;min-width:0;overflow:hidden;text-overflow:ellipsis}
html body nav.back:not(:has(>div))>b{display:block}
html body nav.back>div{margin-left:auto}
@media (min-width:641px){html body nav.back>b{display:block}}
@media (max-width:640px){html body nav.back{padding:0 20px}}
</style>
</head>
<body>
<nav class="back" aria-label="Sandbox"><a href="../">Sandbox</a><span>/</span><b>HOB Pattern Generator</b></nav>
<main>
  <div class="stage" id="stage"><canvas id="cv"></canvas></div>
  <aside>
    <section><h2>Motif</h2><div class="seg" id="seg" role="group" aria-label="Motif"></div></section>
    <section><h2>Pattern</h2>
      <label class="row">Vert spacing <input id="vs" type="range" min="0" max="100" value="40"><output>40</output></label>
      <label class="row">Horz spacing <input id="hs" type="range" min="0" max="100" value="30"><output>30</output></label>
      <label class="row">Density <input id="de" type="range" min="0" max="100" value="45"><output>45</output></label>
      <label class="row">Motion speed <input id="sp" type="range" min="0" max="300" value="100"><output>100</output></label>
    </section>
    <section><h2>Record Video</h2>
      <p class="cap">Recording Length</p>
      <div class="field"><input id="len" type="number" min="1" max="60" value="10" aria-label="Recording length in seconds"><span>Seconds</span></div>
      <p class="cap">File Format</p>
      <div class="field"><span id="fmt">MP4</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
      <p class="cap">Loop</p>
      <div class="tog" id="loop" role="group" aria-label="Loop"><button type="button" data-v="0" aria-pressed="false">Off</button><button type="button" data-v="1" aria-pressed="true">On</button></div>
      <button type="button" class="rec wide" id="recBtn">&#9679; Record Video</button>
    </section>
    <section><h2>Export</h2>
      <button type="button" class="wide" id="expImg">Export Image (PNG)</button>
      <button type="button" class="wide go" id="expVid" disabled>Download Last Clip</button>
    </section>
  </aside>
</main>
<div class="ov" id="ov"><div class="card" role="dialog" aria-label="Recording complete">
  <header><h3>Recording Complete</h3><button class="x" id="cx" type="button" aria-label="Close">&times;</button></header>
  <video id="pv" muted autoplay playsinline></video>
  <div class="ph"><span id="tc">0:00</span><div class="tr" id="tr"><div class="fl" id="fl"></div><div class="kn" id="kn"></div></div><span id="td">0:10</span></div>
  <div class="two"><button type="button" class="rec" id="again">Restart &#8635;</button><button type="button" class="go" id="render">Render Video</button></div>
</div></div>
<script>
(function(){
// Arrangement palette from the House of Balloons system
const CREAM='#FDFEA1', TAN='#BBAE8B', MAROON='#330F10', ORANGE='#D34B1D';
const MOTIFS={
  stretch:{name:'Stretch',sub:'Linear, workflow',bg:MAROON,ink:TAN},
  stack:{name:'Stack',sub:'Ascension, heightened state',bg:ORANGE,ink:CREAM},
  bitmap:{name:'Bitmap',sub:'Noise, disruption',bg:CREAM,ink:MAROON}
};
const $=id=>document.getElementById(id);
const cv=$('cv'); let ctx=cv.getContext('2d'); const mainCtx=ctx, off=document.createElement('canvas'), offCtx=off.getContext('2d');
const S={loop:true,motif:'stretch',vs:40,hs:30,de:45,sp:100};
let W=0,H=0,u=1,T=0,last=0,src=null,sw=0,sh=0;

const fr=a=>a-Math.floor(a);
const hh=(a,b)=>fr(Math.sin(a*127.1+b*311.7)*43758.5453);
const mod=(a,n)=>((a%n)+n)%n;

function bar(x,y,w,h,col){
  if(w<=0||x>W||x+w<0)return;
  ctx.globalAlpha=1;
  ctx.fillStyle=col; const x0=Math.round(x); ctx.fillRect(x0,Math.round(y),Math.round(x+w)-x0,Math.round(h));
}

/* ---------- Stretch: bars drift right and breathe in width ---------- */
function stretch(){
  const barH=27*u, pitch=barH+(5+S.vs*.7)*u, gap=(20+S.hs*4)*u, dens=S.de/100;
  const n=Math.ceil(H/pitch)+1, y0=(H-(n-1)*pitch)/2;
  for(let r=0;r<n;r++){
    const col=r%2?TAN:CREAM, v=(.55+hh(r,1)*1.7)*60*u; // px per second
    const m=Math.ceil((W+900*u)/((275*u)+gap))+2, bw=[], pos=[]; let L=0;
    for(let k=0;k<m;k++){bw.push((100+hh(r,k+7)*350)*u); pos.push(L); L+=bw[k]+gap;}
    const off=hh(r,3)*L, shift=off+v*T;
    for(let k=0;k<m;k++){
      if(hh(r,k+40)>=dens)continue;
      const x=mod(pos[k]+shift,L)-520*u;
      const st=.95+.1*(1+Math.sin(T*.6+hh(r,k+90)*6.283)); // 0.95 to 1.15
      bar(x,y0+r*pitch,bw[k]*st,barH,col);
    }
  }
}

/* ---------- Stack: bars rise as one column of planes off a shared edge ---------- */
function stack(){
  const barH=27*u, pitch=barH+(5+S.vs*.7)*u, amp=S.hs*1.6*u, dens=S.de/100;
  const n=Math.ceil(H/pitch)+2, span=n*pitch, vy=40*u;
  for(let r=0;r<n;r++){
    if(hh(r,5)>=dens)continue;
    const y=mod(r*pitch-T*vy,span)-pitch;
    const x=W*.34+amp*Math.sin(T*.7+r*.5);
    const len=(W-x)*(.8+.4*Math.sin(T*.5+hh(r,9)*6.283));
    bar(x,y,len,barH,CREAM);
  }
}

/* ---------- Bitmap: ordered-dither of a hidden image, drawn as rolling dashes ---------- */
const BAYER=(function(){const d=(n,i,j)=>n===1?[[0,2],[3,1]][j][i]:d(n-1,i>>1,j>>1)+d(1,i&1,j&1)*4;const a=[];for(let j=0;j<8;j++)for(let i=0;i<8;i++)a.push(d(3,i,j));return a;})();
function buildSource(){
  sw=Math.ceil(W/4);sh=Math.ceil(H/4);
  const c=document.createElement('canvas');c.width=sw;c.height=sh;
  const g=c.getContext('2d');g.fillStyle='rgb(250,250,250)';g.fillRect(0,0,sw,sh);
  let s=999;const rnd=()=>{s=(s+0x6D2B79F5)|0;let t=Math.imul(s^s>>>15,1|s);t^=t+Math.imul(t^t>>>7,61|t);return((t^t>>>14)>>>0)/4294967296;};
  const grays=[0,60,120,180,215,245];
  for(let i=0;i<14;i++){
    const v=grays[Math.floor(rnd()*6)];g.fillStyle='rgb('+v+','+v+','+v+')';
    g.save();g.translate(rnd()*(sw+25)-25,rnd()*(sh+12)-12);g.rotate(rnd()*6.283);
    g.beginPath();const nv=3+Math.floor(rnd()*7),rad=(150+rnd()*400)/4;
    for(let k=0;k<nv;k++){const a=6.283*k/nv,rr=rad*(.5+rnd());k?g.lineTo(Math.cos(a)*rr,Math.sin(a)*rr):g.moveTo(Math.cos(a)*rr,Math.sin(a)*rr);}
    g.closePath();g.fill();g.restore();
  }
  const d=g.getImageData(0,0,sw,sh).data;src=new Uint8Array(sw*sh);
  for(let i=0;i<src.length;i++)src[i]=d[i*4];
}
function bitmap(){
  if(!src)buildSource();
  const xs=Math.max(6,(8+S.hs*.56)*u), pitch=(27+5+S.vs*.7)*u, bh=Math.max(4,pitch*.5);
  const bias=(S.de/100-.45)*200, tc=T*6.283/4, roll=T*.9, q=xs*.5;
  let row=0;
  for(let y=0;y<H;y+=pitch,row++){
    const curve=Math.sin(y*.004/u+roll)*.25;
    for(let x=0,col=0;x<W;x+=xs,col++){
      const wave=Math.sin((x+y*1.15)*.0019/u+tc+curve); // diagonal wavefront
      if(wave<=-.95)continue;
      const b=Math.min(255,Math.max(0,src[Math.min(sh-1,y/4|0)*sw+Math.min(sw-1,x/4|0)]-bias));
      const dv=BAYER[(row%8)*8+(col%8)];
      if(Math.floor(b/255+dv/64)>=1)continue;
      const base=(10+hh(row,col)*25)*u*(xs/(20*u))*1.2;
      const len=Math.max(q,Math.round(base*(wave+.95)/1.95/q)*q);
      bar(x,y,len,bh,MAROON);
    }
  }
}

/* ---------- frame loop ---------- */
const rec={on:false}, FADE=1;
let lastUrl=null, lastExt='mp4', lastLen=10;
function paint(tv){T=tv;ctx.globalAlpha=1;ctx.fillStyle=MOTIFS[S.motif].bg;ctx.fillRect(0,0,W,H);({stretch,stack,bitmap})[S.motif]();ctx.globalAlpha=1;}
// every motif is a pure function of T, so a loop is made by fading the clip's last second into its first frame
function frame(tv,rt){
  paint(tv);
  if(rec.on&&rec.loop){const k=(rt-(rec.L-FADE))/FADE;if(k>0){ctx=offCtx;paint(tv-rec.L*S.sp/100);ctx=mainCtx;ctx.globalAlpha=Math.min(1,k);ctx.drawImage(off,0,0,W,H);ctx.globalAlpha=1;}}
}
function draw(now){
  const dt=Math.min(.05,(now-last)/1000||0);last=now;
  if(rec.on){
    const rt=(now-rec.t)/1000;
    if(rt>=rec.L){frame(rec.t0+rec.L*S.sp/100,rec.L);rec.on=false;rec.mr.stop();}
    else{frame(rec.t0+rt*S.sp/100,rt);$('recBtn').textContent='Recording… '+Math.ceil(rec.L-rt)+'s';}
  }else{T+=dt*S.sp/100;paint(T);}
  requestAnimationFrame(draw);
}
const MIMES=[['video/mp4;codecs=avc1','mp4'],['video/mp4','mp4'],['video/webm;codecs=vp9','webm'],['video/webm','webm']];
const fmt=window.MediaRecorder&&MIMES.find(m=>MediaRecorder.isTypeSupported(m[0]));
$('fmt').textContent=fmt?fmt[1].toUpperCase():'Unsupported';
function startRec(){
  if(!fmt||rec.on)return;
  $('ov').classList.remove('on');
  const L=Math.min(60,Math.max(1,+$('len').value||10)), chunks=[];
  const mr=new MediaRecorder(cv.captureStream(30),{mimeType:fmt[0],videoBitsPerSecond:8e6});
  mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
  mr.onstop=()=>{
    if(lastUrl)URL.revokeObjectURL(lastUrl);
    lastExt=fmt[1];lastLen=rec.L;$('td').textContent=mmss(rec.L);lastUrl=URL.createObjectURL(new Blob(chunks,{type:fmt[0].split(';')[0]}));
    $('recBtn').textContent='\u25CF Record Video';$('recBtn').disabled=false;$('expVid').disabled=false;
    const v=$('pv');v.src=lastUrl;v.loop=rec.loop;v.play().catch(()=>{});$('ov').classList.add('on');
  };
  Object.assign(rec,{on:true,L,mr,loop:S.loop,t:performance.now(),t0:T});
  $('recBtn').disabled=true;mr.start();
}
// playhead: MediaRecorder files have no duration metadata, so the known recording length is used
const mmss=t=>Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');
function tick(){
  const v=$('pv'),f=Math.min(1,v.currentTime/lastLen)||0;
  $('fl').style.width=f*100+'%';$('kn').style.left=f*100+'%';$('tc').textContent=mmss(v.currentTime);
  requestAnimationFrame(tick);
}
tick();
function scrub(e){const r=$('tr').getBoundingClientRect(),f=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));$('pv').currentTime=f*lastLen;}
$('tr').addEventListener('pointerdown',e=>{$('tr').setPointerCapture(e.pointerId);scrub(e);$('tr').onpointermove=scrub;});
$('tr').addEventListener('pointerup',()=>{$('tr').onpointermove=null;});
function save(url,name){const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();}
$('recBtn').onclick=startRec;$('again').onclick=startRec;
$('cx').onclick=()=>{$('ov').classList.remove('on');$('pv').pause();};
$('render').onclick=()=>save(lastUrl,'hob-'+S.motif+'.'+lastExt);
$('expVid').onclick=()=>lastUrl&&save(lastUrl,'hob-'+S.motif+'.'+lastExt);
$('expImg').onclick=()=>save(cv.toDataURL('image/png'),'hob-'+S.motif+'.png');
document.querySelectorAll('#loop button').forEach(b=>b.onclick=()=>{S.loop=b.dataset.v==='1';document.querySelectorAll('#loop button').forEach(x=>x.setAttribute('aria-pressed',x===b));});
function fit(){
  const r=cv.getBoundingClientRect(),d=Math.min(2,window.devicePixelRatio||1);
  W=Math.floor(r.width/2)*2;H=Math.floor(r.height/2)*2;u=Math.max(.6,W/1280);
  for(const c of [cv,off]){c.width=Math.round(W*d);c.height=Math.round(H*d);}
  mainCtx.setTransform(d,0,0,d,0,0);offCtx.setTransform(d,0,0,d,0,0);src=null;
}
function setMotif(k){
  if(!MOTIFS[k])return;S.motif=k;const m=MOTIFS[k];
  $('stage').style.background=m.bg;
  document.querySelectorAll('#seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===k));
  try{history.replaceState(null,'','#'+k)}catch(e){}
}
Object.keys(MOTIFS).forEach(k=>{const b=document.createElement('button');b.type='button';b.dataset.k=k;b.textContent=MOTIFS[k].name;b.onclick=()=>setMotif(k);$('seg').appendChild(b);});
[['vs','vs'],['hs','hs'],['de','de'],['sp','sp']].forEach(([id,key])=>{$(id).oninput=e=>{S[key]=+e.target.value;e.target.nextElementSibling.textContent=e.target.value;};});
addEventListener('resize',fit);
const h=location.hash.slice(1).split('&');
if(h.includes('clip'))document.body.classList.add('clip');
fit();setMotif(MOTIFS[h[0]]?h[0]:'stretch');
requestAnimationFrame(draw);
window.__hob={set:setMotif};
})();
</script>
</body>
</html>
