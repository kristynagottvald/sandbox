<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lob Unwrapped</title>
<meta name="description" content="Your year in direct mail: pieces sent, QR codes scanned, PURLs clicked, metros reached and the trip to the moon, as a shareable full-screen reel.">
<meta property="og:title" content="Lob Unwrapped 2026: your year in direct mail">
<meta property="og:description" content="Pieces sent, QR codes scanned, PURLs clicked, metros reached, and how many trips to the moon your mail made.">
<meta property="og:image" content="https://kristynagottvald.github.io/sandbox/lob-unwrapped/thumb.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#4131f1;--ink:#4131f1;--lime:#f7dffa;--mag:#d045dc;--lav:#f5f5fe;--pink:#f7dffa;--peri:#9b93f8;--sans:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif}
*{box-sizing:border-box;margin:0}
html{background:#000}
body{min-height:100dvh;display:flex;flex-direction:column;color:#fff;font:400 16px/1.4 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;background:#000}
button{font:inherit;color:inherit;cursor:pointer}
/* ---------- back nav (shared across sandbox projects) ---------- */
nav.back{flex:none;display:flex;align-items:center;gap:8px;height:49px;padding:0 20px;background:#000;border-bottom:1px solid #1c1c1c;font:400 13px/1.35 var(--sans);white-space:nowrap;overflow:hidden;position:relative;z-index:5}
nav.back a{color:#8d8d8d;text-decoration:none}nav.back a:hover,nav.back a:focus-visible{color:#fff;text-decoration:underline;text-underline-offset:3px}
nav.back span{color:#6e6e6e}nav.back b{font-weight:500;color:#fff;overflow:hidden;text-overflow:ellipsis}
@media(max-width:640px){nav.back{padding:0 16px}nav.back .x{display:none}}

/* ---------- the whole page is the 16:9 screen ---------- */
.wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.stage{position:relative;flex:none;width:min(100vw,calc((100dvh - 49px)*16/9));height:min(calc(100dvh - 49px),calc(100vw*9/16));overflow:hidden;container-type:size;isolation:isolate;background:#000;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:pan-y}
@media(max-aspect-ratio:1/1){.stage{width:100vw;height:calc(100dvh - 49px)}}
.stage>*{--u:calc(1cqw/3)}
@container (max-aspect-ratio:1/1){.stage>*{--u:.85cqw}}

/* ---------- chrome ---------- */
.bars{position:absolute;z-index:6;left:calc(var(--u)*8);right:calc(var(--u)*8);top:calc(var(--u)*3);display:flex;gap:calc(var(--u)*1.2)}
.bars button{flex:1;height:calc(var(--u)*4);background:none;border:0;padding:0;display:block}
.bars i{display:block;height:calc(var(--u)*.9);border-radius:9px;background:color-mix(in srgb,var(--fg) 25%,transparent);overflow:hidden;position:relative}
.bars i b{position:absolute;inset:0;background:var(--fg);transform-origin:left;transform:scaleX(0)}
.bars button.done i b{transform:none}
.bars button:hover i{background:color-mix(in srgb,var(--fg) 45%,transparent)}
.hd{position:absolute;z-index:6;left:calc(var(--u)*8);right:calc(var(--u)*8);top:calc(var(--u)*8);display:flex;align-items:center;justify-content:space-between;color:var(--fg)}
.hd [data-logo]{width:calc(var(--u)*17)}
[data-logo] svg{width:100%;height:auto;display:block}
.ib{width:calc(var(--u)*11);height:calc(var(--u)*11);border-radius:50%;border:0;background:color-mix(in srgb,var(--fg) 14%,transparent);color:inherit;display:grid;place-items:center;transition:background .2s}
.ib svg{width:50%;height:50%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib:hover{background:color-mix(in srgb,var(--fg) 28%,transparent)}
.ib:focus-visible,.bars button:focus-visible{outline:2px solid currentColor;outline-offset:2px}
.dock{position:absolute;z-index:6;left:calc(var(--u)*8);right:calc(var(--u)*8);bottom:calc(var(--u)*5);display:flex;align-items:center;justify-content:space-between;color:var(--fg);pointer-events:none}
.dock button{pointer-events:auto}
.dock .chp{font:600 calc(var(--u)*3.2)/1 var(--sans);letter-spacing:.04em;opacity:.8}
.dock .chp span{font-weight:500;margin-left:calc(var(--u)*1.6);opacity:.75}
.dock .nav{display:flex;gap:calc(var(--u)*2)}
.zone{position:absolute;z-index:0;top:calc(var(--u)*18);bottom:0;border:0;background:none;padding:0}
.zone.l{left:0;width:30%}.zone.r{right:0;width:70%}
.toast{position:absolute;z-index:9;left:50%;bottom:calc(var(--u)*20);transform:translate(-50%,calc(var(--u)*4));opacity:0;pointer-events:none;background:#fff;color:var(--ink);font:600 calc(var(--u)*3.6)/1 var(--sans);padding:calc(var(--u)*3) calc(var(--u)*5.4);border-radius:99px;transition:.3s;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sr{position:absolute;left:-9999px}
.clip .toast{display:none}

/* ---------- slides ---------- */
.slide{--bg:#4131f1;--fg:#fff;--ac:var(--lime);position:absolute;inset:0;z-index:1;background:var(--bg);color:var(--fg);opacity:0;visibility:hidden;transition:opacity .45s,visibility 0s .45s;overflow:hidden;pointer-events:none}
.slide.on{opacity:1;visibility:visible;transition:opacity .45s;z-index:2}
.slide a,.slide button{pointer-events:auto}
.t-blue{--bg:#4131f1;--fg:#fff;--ac:#f7dffa;--em:#f7dffa}
.t-pink{--bg:#f7dffa;--fg:#4131f1;--ac:#d045dc;--em:#4131f1}
.t-mag{--bg:#d045dc;--fg:#fff;--ac:#f7dffa;--em:#f7dffa}
.t-lav{--bg:#f5f5fe;--fg:#4131f1;--ac:#d045dc;--em:#4131f1}
.t-white{--bg:#fff;--fg:#4131f1;--ac:#d045dc;--em:#4131f1}
.bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.burstsvg{position:absolute;z-index:1;left:50%;top:50%;width:100%;height:100%;transform:translate(-50%,-50%);display:block}
.burstsvg.p{display:none}
.in{position:relative;z-index:2;width:100%;height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;column-gap:calc(var(--u)*8);padding:calc(var(--u)*20) calc(var(--u)*36) calc(var(--u)*17)}
.in.wide{grid-template-columns:minmax(0,1.3fr) minmax(0,.9fr)}
.in.col,.in.ctr{display:flex;flex-direction:column;justify-content:center;gap:calc(var(--u)*4.4)}
.in.ctr{align-items:center;text-align:center;padding:calc(var(--u)*20) calc(var(--u)*60) calc(var(--u)*17)}
.tx{display:flex;flex-direction:column;gap:calc(var(--u)*3.6);min-width:0}
.ctr .tx{align-items:center}
.art>.rise{width:100%;display:flex;justify-content:center}
.art{display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;position:relative}
@container (max-aspect-ratio:1/1){
  .in{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);row-gap:calc(var(--u)*5);align-items:start;padding:calc(var(--u)*24) calc(var(--u)*9) calc(var(--u)*20)}
  .in.wide{grid-template-columns:minmax(0,1fr)}
  .in.ctr{padding:calc(var(--u)*24) calc(var(--u)*14) calc(var(--u)*20)}
  .ptw{bottom:calc(var(--u)*24)!important}
  .in.col{padding:calc(var(--u)*24) calc(var(--u)*9) calc(var(--u)*20)}
  .art{align-items:start}
  .bg.edge{display:none}
  .slide::before,.slide::after{content:"";position:absolute;z-index:0;width:30cqw;height:30cqw;border-radius:50%;background:var(--ac);opacity:.9}
  .slide::before{right:-12cqw;top:34%}.slide::after{left:-14cqw;bottom:8%;opacity:.55}
  .burstsvg.l{display:none}.burstsvg.p{display:block;width:100%;height:78%}
  .bg.c{left:50%;top:50%;width:205cqw;height:auto;aspect-ratio:160/90;right:auto;bottom:auto;transform:translate(-50%,-50%)}
}
.rise{opacity:0;transform:translateY(calc(var(--u)*3));filter:blur(calc(var(--u)*.8));transition:opacity .6s,transform .7s cubic-bezier(.2,.8,.2,1),filter .6s}
.on .rise{opacity:1;transform:none;filter:none;transition-delay:calc(var(--i,0)*.1s + .2s)}
@media(prefers-reduced-motion:reduce){.slide,.slide.on,.rise,.on .rise{transition:none!important;filter:none}}
.k{font:700 calc(var(--u)*3.2)/1.2 var(--sans);letter-spacing:.16em;text-transform:uppercase;opacity:.85}
.h{font:800 calc(var(--u)*13)/1 var(--sans);letter-spacing:-.045em}
.h.sm{font-size:calc(var(--u)*10.4)}
.hero{font:800 calc(var(--u)*23)/.92 var(--sans);letter-spacing:-.05em}
.h i,.lead i,.big i,.hero i{font-style:normal;letter-spacing:-.01em;color:var(--em)}
.lead{font:600 calc(var(--u)*8.4)/1.1 var(--sans);letter-spacing:-.04em}
.big{font:800 calc(var(--u)*26)/.92 var(--sans);letter-spacing:-.06em;font-variant-numeric:tabular-nums;white-space:nowrap}
.big.md{font-size:calc(var(--u)*30)}.big.lg{font-size:calc(var(--u)*40)}
.big small{font-size:.3em;font-weight:600;letter-spacing:-.02em;opacity:.7}
.sub{font:400 calc(var(--u)*5)/1.38 var(--sans);opacity:.85;max-width:calc(var(--u)*88)}
.sub b{font-weight:700}
.pill{display:inline-flex;align-self:flex-start;align-items:center;font:700 calc(var(--u)*3.4)/1 var(--sans);padding:calc(var(--u)*2.2) calc(var(--u)*4);border-radius:99px;background:var(--fg);color:var(--bg)}
.ctr .pill{align-self:center}
.stc{position:absolute;z-index:3;color:#fff;top:24%}
.stc.l{left:19%;width:calc(var(--u)*17)}
.stc.r{right:19%;opacity:1}
.stage.intro .hd [data-logo]{visibility:hidden}
.fine{font:400 calc(var(--u)*3)/1.4 var(--sans);opacity:.65;max-width:calc(var(--u)*90)}
@container (max-aspect-ratio:1/1){
  .k{font-size:calc(var(--u)*3.8)}.h{font-size:calc(var(--u)*10.4)}.lead{font-size:calc(var(--u)*8.6)}
  .big,.big.md{font-size:15cqw}.big.lg{font-size:24cqw}.sub{font-size:calc(var(--u)*5.2)}.fine{font-size:calc(var(--u)*3.6)}.pill{font-size:calc(var(--u)*3.8)}
}

/* ---------- parts ---------- */
.pc{display:block;width:100%;height:auto}
.tun{display:block;width:100%;height:100%}
.spin{animation:spin 14s linear infinite;transform-box:view-box}
@keyframes spin{to{transform:rotate(360deg)}}
.drift{animation:drift 2.4s linear infinite}
.cbf{fill:var(--ca);animation:cbf 4s steps(1,end) infinite}
@keyframes cbf{0%{fill:var(--ca)}70%{fill:var(--cb)}}
@keyframes drift{to{transform:translateX(-28px)}}
@media(prefers-reduced-motion:reduce){.spin,.drift,.cbf{animation:none}.cbf.w{fill:var(--cb)}}
.bgc{position:absolute;inset:0;z-index:0}
.art .tun{aspect-ratio:1;height:auto;max-width:calc(var(--u)*112)}
.tun.round{border-radius:50%}
.art .tun.tr{aspect-ratio:1.2;max-width:calc(var(--u)*124)}
.trw{position:relative;width:100%;max-width:calc(var(--u)*124)}
.purl{position:absolute;left:69%;top:63%;transform:translate(-50%,-50%);background:#f5f5fe;color:#4131f1;font:600 calc(var(--u)*3.5)/1 var(--sans);padding:calc(var(--u)*2.2) calc(var(--u)*3.6);border-radius:99px;white-space:nowrap}
.purl b{font-weight:800}
.arts{position:relative;width:100%;max-width:calc(var(--u)*112)}
.arts .tun{max-width:none;aspect-ratio:1.45;border-radius:calc(var(--u)*3)}
.arts .pc{position:absolute;left:21%;top:50%;width:58%;transform:translateY(-50%)}
.cas{}
.art .cas{max-width:calc(var(--u)*118)}
.mixrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:calc(var(--u)*6)}
.mix{display:grid;gap:calc(var(--u)*1.6)}
.mix .pc{margin-bottom:calc(var(--u)*1.4)}
.mix b{font:800 calc(var(--u)*11)/1 var(--sans);letter-spacing:-.05em;color:var(--ac);font-variant-numeric:tabular-nums}
.mix span{font:600 calc(var(--u)*4)/1.15 var(--sans);letter-spacing:-.02em}
.mix small{font:400 calc(var(--u)*3.2)/1.2 var(--sans);opacity:.7}
@container (max-aspect-ratio:1/1){.mixrow{grid-template-columns:repeat(3,minmax(0,1fr));gap:calc(var(--u)*3)}.mix b{font-size:calc(var(--u)*10)}}
.scene{width:100%;height:auto;max-height:100%;display:block;overflow:visible}
.map{position:relative;width:136%;margin:0 -20% 0 -16%;aspect-ratio:1.85;min-height:0}
@container (max-aspect-ratio:1/1){.map{width:112%;margin:0 -6%}}
.map canvas{position:absolute;inset:0;width:100%;height:100%}
.rankwrap{width:100%;display:grid;gap:calc(var(--u)*7)}
.rank{display:grid;gap:calc(var(--u)*4.4);width:100%}
.rank .row{display:grid;grid-template-columns:calc(var(--u)*9) 1fr;gap:calc(var(--u)*2);align-items:center}
.rank .n{font:800 calc(var(--u)*9)/1 var(--sans);letter-spacing:-.05em;color:var(--ac)}
.rank .nm{display:flex;justify-content:space-between;font:700 calc(var(--u)*5.4)/1.1 var(--sans);letter-spacing:-.03em}
.rank .nm span{font-weight:500;opacity:.7;font-variant-numeric:tabular-nums}
.rank .t{height:calc(var(--u)*2.2);border-radius:99px;background:color-mix(in srgb,var(--fg) 14%,transparent);margin-top:calc(var(--u)*2);overflow:hidden}
.rank .t i{display:block;height:100%;width:0;background:var(--ac);border-radius:99px;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.on .rank .t i{width:var(--w);transition-delay:calc(var(--i)*.1s + .6s)}
.il{display:block;width:100%;height:auto;max-width:calc(var(--u)*80)}
.il .f{fill:var(--fg)}.il .a{fill:var(--ac)}.il .b{fill:var(--bg)}
.qrwrap{position:relative;width:calc(var(--u)*72)}
.qrbox{position:relative;width:100%;aspect-ratio:1;background:#fff;border-radius:calc(var(--u)*5);padding:calc(var(--u)*5.5);color:var(--ink);}
.qrbox svg{width:100%;height:100%;display:block;fill:currentColor}
.qrbox::after{content:"";position:absolute;left:calc(var(--u)*3);right:calc(var(--u)*3);height:calc(var(--u)*1.4);border-radius:9px;background:var(--mag);top:8%;opacity:0}
.on .qrbox::after{animation:scan 2.2s ease-in-out .7s infinite}
@keyframes scan{0%{top:6%;opacity:0}12%{opacity:1}88%{opacity:1}100%{top:92%;opacity:0}}
.phone{position:absolute;right:calc(var(--u)*-18);bottom:calc(var(--u)*-8);width:calc(var(--u)*30);height:auto;}
.facts{margin-top:calc(var(--u)*5);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:calc(var(--u)*2.6);max-width:calc(var(--u)*92)}
.facts.three{grid-template-columns:repeat(3,minmax(0,auto));gap:calc(var(--u)*4);max-width:none}
.fact{padding:calc(var(--u)*3.4);border-radius:calc(var(--u)*3);background:color-mix(in srgb,var(--fg) 12%,transparent)}
.fact b{display:block;font:800 calc(var(--u)*8)/1 var(--sans);letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.fact>span{display:block;margin-top:calc(var(--u)*1.4);font:400 calc(var(--u)*3.2)/1.25 var(--sans);opacity:.75}
.facts.three .fact{background:var(--fg);color:var(--bg);text-align:left}
.browser{width:100%;max-width:calc(var(--u)*100);border-radius:calc(var(--u)*3.4);background:#fff;color:var(--ink);overflow:hidden}
.browser .bar2{display:flex;align-items:center;gap:calc(var(--u)*1.6);padding:calc(var(--u)*2.8) calc(var(--u)*3.4);background:#f1f0fb}
.browser .bar2 i{width:calc(var(--u)*2.2);height:calc(var(--u)*2.2);border-radius:50%;background:#cfcdea}
.browser .url{flex:1;margin-left:calc(var(--u)*1.2);padding:calc(var(--u)*2) calc(var(--u)*3.4);border-radius:99px;background:#fff;font:500 calc(var(--u)*3.6)/1 var(--sans);white-space:nowrap;overflow:hidden}
.browser .url u{text-decoration:none;color:var(--blue);font-weight:700}
.browser .url s{display:inline-block;width:1px;height:1em;background:var(--ink);vertical-align:-.15em;margin-left:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.browser .pg{padding:calc(var(--u)*6) calc(var(--u)*5.4) calc(var(--u)*6.6);display:grid;gap:calc(var(--u)*3)}
.browser .pg b{font:800 calc(var(--u)*8.4)/1.02 var(--sans);letter-spacing:-.045em}
.browser .pg b i{font-style:normal;color:var(--mag)}
.browser .pg span{font:400 calc(var(--u)*4)/1.4 var(--sans);opacity:.7}
.browser .cta{position:relative;justify-self:start;padding:calc(var(--u)*2.8) calc(var(--u)*5.4);border-radius:99px;background:var(--blue);color:#fff;font:700 calc(var(--u)*3.8)/1 var(--sans)}
.browser .cta svg{position:absolute;right:-12%;bottom:-70%;width:calc(var(--u)*8)}
.fun{display:grid;gap:calc(var(--u)*3.4);width:100%;margin-top:calc(var(--u)*3)}
.fun .row{display:flex;align-items:center;gap:calc(var(--u)*4)}
.fun .row>i{flex:none;font:800 calc(var(--u)*5)/1 var(--sans);font-style:normal;color:var(--bg);background:var(--ac);width:calc(var(--u)*13);height:calc(var(--u)*13);border-radius:50%;display:grid;place-items:center;letter-spacing:-.04em}
.fun .row>i .chk{width:58%;height:58%;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:square;stroke-linejoin:miter;stroke-miterlimit:10}
.fun .row div{font:700 calc(var(--u)*6)/1.15 var(--sans);letter-spacing:-.03em}
.fun .row small{display:block;font:400 calc(var(--u)*3.6)/1.3 var(--sans);opacity:.7;letter-spacing:0;margin-top:3px}
.tags{display:flex;flex-wrap:wrap;gap:calc(var(--u)*2.2);justify-content:center}
.tags span{font:700 calc(var(--u)*3.6)/1 var(--sans);padding:calc(var(--u)*2.6) calc(var(--u)*4.4);border-radius:99px;background:#f5f5fe;color:#4131f1}
.tags span:nth-child(2n){background:#f7dffa}
.persona{font:800 calc(var(--u)*13)/.95 var(--sans);letter-spacing:-.055em}
.persona i{font-style:normal;letter-spacing:-.02em;color:var(--blue)}
.pcirc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*2.6);text-align:center;color:var(--ink);width:min(64cqh,52cqw);aspect-ratio:1;border-radius:50%;background:var(--lav);padding:calc(var(--u)*9)}
.pcirc .lead{font-size:calc(var(--u)*5.2);font-weight:500;letter-spacing:-.02em;line-height:1.2}
.pcirc .k{opacity:.8}
.cswrap{position:relative;width:100%;max-width:calc(var(--u)*92);margin-bottom:calc(var(--u)*16)}
.cswrap>i{position:absolute;inset:0;border-radius:calc(var(--u)*3);background:var(--mag);transform:translateY(calc(var(--k)*var(--u)*3.2));opacity:var(--o)}
.card{position:relative;border-radius:calc(var(--u)*3);background:var(--blue);color:#fff;padding:calc(var(--u)*9) calc(var(--u)*8);display:grid;gap:calc(var(--u)*8)}
.card .top{display:flex;justify-content:space-between;align-items:center}
.card .top [data-logo]{width:calc(var(--u)*15)}
.card .top span:last-child{font:700 calc(var(--u)*3)/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--lime)}
.card .nm{font:800 calc(var(--u)*8.4)/1 var(--sans);letter-spacing:-.05em}
.card .nm i{font-style:normal;color:var(--lime);letter-spacing:-.01em}
.card .g{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--u)*8) calc(var(--u)*4)}
.card .g b{display:block;font:800 calc(var(--u)*8.2)/1 var(--sans);letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.card .g span{display:block;margin-top:calc(var(--u)*2.2);font:400 calc(var(--u)*3)/1.3 var(--sans);opacity:.8}
.share{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*2.6);max-width:calc(var(--u)*92)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:calc(var(--u)*2.2);height:calc(var(--u)*13);padding:0 calc(var(--u)*5);border-radius:99px;border:0;background:var(--ink);color:#fff;font:700 calc(var(--u)*3.8)/1 var(--sans);text-decoration:none;white-space:nowrap;cursor:pointer}
.btn svg{width:calc(var(--u)*4.6);height:calc(var(--u)*4.6);fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn:hover{filter:brightness(1.18)}.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.ctr .facts.three .fact{background:#4131f1;color:#f7dffa}
.btn.main{background:var(--mag);grid-column:1/-1}
#eLi{grid-column:1/-1}

<script>
(function(){
'use strict';
var LOGO='<svg width="114" height="50" viewBox="0 0 114 50" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lob"><path d="M113.886 29.4011C113.886 41.5261 104.676 49.2099 94.954 49.2099C89.6912 49.2099 85.0859 46.9541 82.4545 43.1474L80.7204 48.4345H72.5136L72.5119 0.000103459L82.8962 0V15.0943C85.5586 11.7125 89.7868 9.59227 94.881 9.59227C104.822 9.59227 113.886 17.2761 113.886 29.4011ZM81.9429 29.3306C81.9429 35.2521 86.6942 40.0457 92.9074 40.0457C98.9743 40.0457 103.799 35.3226 103.799 29.3306C103.799 23.3386 98.9743 18.6155 92.9074 18.6155C86.6942 18.6155 81.9429 23.4091 81.9429 29.3306Z" fill-rule="evenodd" clip-rule="evenodd" fill="currentColor"/><path d="M0.0016883 48.4347L22.5808 48.4345L25.7235 38.7768L10.3813 38.777L10.3796 0.000103459H0L0.0016883 48.4347Z" fill="currentColor"/><path d="M47.5044 49.2099C59.419 49.2099 68.4098 40.3276 68.4098 29.4011C68.4098 18.404 59.2729 9.59227 47.5044 9.59227C35.6629 9.59227 26.6723 18.404 26.6723 29.4011C26.6723 40.3276 35.6629 49.2099 47.5044 49.2099ZM47.5777 39.9752C41.5106 39.9752 36.7595 35.2521 36.7595 29.3306C36.7595 23.4091 41.5106 18.686 47.5777 18.686C53.5713 18.686 58.3956 23.4091 58.3956 29.3306C58.3956 35.2521 53.5713 39.9752 47.5777 39.9752Z" fill-rule="evenodd" clip-rule="evenodd" fill="currentColor"/></svg>';
var Q=new URLSearchParams(location.search), H=location.hash;
var CLIP=/clip/.test(H);
var RM=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
if(CLIP)document.body.classList.add('clip');
function logoInto(root){root.querySelectorAll('[data-logo]').forEach(function(e){e.innerHTML=LOGO;var s=e.querySelector('svg');s.removeAttribute('width');s.removeAttribute('height')})}

/* ---------- data (every figure can be overridden in the link) ---------- */
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function num(k,d){var v=parseFloat(Q.get(k));return isFinite(v)&&v>=0?v:d}
var brand=(Q.get('brand')||'Spark Dental').slice(0,40);
var D={brand:brand,pieces:Math.round(num('pieces',1284560)),pct:Math.min(100,num('pct',64)),metros:Math.round(num('metros',187)),states:Math.min(50,Math.round(num('states',48))),
  scans:Math.round(num('scans',41872)),clicks:Math.round(num('clicks',58214)),conv:Math.round(num('conv',9128)),rev:num('rev',3900000),days:num('days',3.6),ontime:num('ontime',97.4),bad:Math.round(num('bad',41206)),avgMi:1070};
D.uniq=Math.round(D.clicks*.54);D.engaged=D.scans+D.uniq;D.qrRate=D.scans/D.pieces*100;D.perDay=Math.round(D.pieces/365);
D.pieceMiles=D.pieces*D.avgMi;D.trips=D.pieceMiles/238855;D.hh=Math.max(1,Math.round(131e6/D.pieces));D.saved=D.bad*0.95;
D.mix=[['Postcards',62,'stamp'],['Letters',24,'sqburst'],['Self-mailers',14,'checker']];
D.metroTop=[['Dallas–Fort Worth',.073],['Atlanta',.063],['Phoenix',.06],['Chicago',.055],['Denver',.049]].map(function(m){return[m[0],Math.round(D.pieces*m[1]*D.pct/64)]});
var persona=D.pct>=60?['The Metro','Magnet','You went wide and stayed local: every mailbox felt like a one-to-one.',['Coast to coast','Always on time','Scan magnet']]:
  D.qrRate>=3?['The Scan','Whisperer','Fewer mailboxes, more taps. Your audience loves a QR code.',['Scan magnet','Tight targeting','Repeat responders']]:
  ['The Slow','Burner','You played the long game and let each piece do the talking.',['Patient','Well timed','Compounding']];

/* ---------- formatting ---------- */
function int(n){return Math.round(n).toLocaleString('en-US')}
function compact(n){if(n>=1e9)return(n/1e9).toFixed(2)+'B';if(n>=1e6)return(n/1e6).toFixed(n>=1e7?1:2)+'M';if(n>=1e4)return Math.round(n/1e3)+'K';return int(n)}
function usd(n){return '$'+(n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?Math.round(n/1e3)+'K':int(n))}
var F={int:int,compact:compact,usd:usd,pct:function(n){return Math.round(n)+'%'},p1:function(n){return n.toFixed(1)+'%'},d1:function(n){return n.toFixed(1)},bil:function(n){return(n/1e9).toFixed(2)}};
function C(v,fmt){return '<span data-count="'+v+'" data-fmt="'+fmt+'">'+F[fmt](v)+'</span>'}

/* ---------- flat shape kit (SVG strings) ---------- */
var UID=0;
var B='#4131f1',MG='#d045dc',LAV='#f5f5fe',PK='#f7dffa',PW='#9b93f8',M3='#e28deb',M4='#edb8f3',M5='#f4d3f8',WH='#fff';
var PAL={bl:[B,PK,MG,PW],pk:[PK,B,MG,PW],mg:[MG,B,PK,LAV],pw:[PW,B,LAV,MG],lav:[LAV,B,MG,PW],wh:[WH,B,MG,PK]};
function f1(n){return Math.round(n*10)/10}
function circ(x,y,r,f){return '<circle cx="'+f1(x)+'" cy="'+f1(y)+'" r="'+f1(r)+'" fill="'+f+'"/>'}
function rect(x,y,w,h,f,rx){return '<rect x="'+f1(x)+'" y="'+f1(y)+'" width="'+f1(w)+'" height="'+f1(h)+'" fill="'+f+'"'+(rx?' rx="'+rx+'"':'')+'/>'}
function tri(a,b,c,d,e,g,f){return '<polygon points="'+a+','+b+' '+c+','+d+' '+e+','+g+'" fill="'+f+'"/>'}
function star(cx,cy,R,r,n,f,ky){var p=[],k=ky||1;for(var i=0;i<n*2;i++){var a=Math.PI*i/n-Math.PI/2,rr=i%2?r:R;p.push(f1(cx+rr*Math.cos(a))+','+f1(cy+rr*Math.sin(a)*k))}return '<polygon points="'+p.join(' ')+'" fill="'+f+'"/>'}
function mand(cx,cy,R,n,a,b,c){var s=circ(cx,cy,R*.74,a),i,t;for(i=0;i<n;i++){t=Math.PI*2*i/n;s+=circ(cx+R*.72*Math.cos(t),cy+R*.72*Math.sin(t),R*.27,a)}
  s+=circ(cx,cy,R*.56,b);for(i=0;i<n/2;i++){t=Math.PI*4*i/n+Math.PI/n;s+=circ(cx+R*.46*Math.cos(t),cy+R*.46*Math.sin(t),R*.16,c)}return s+circ(cx,cy,R*.3,a)}
function checker(x,y,w,h,s,a,b){var o=rect(x,y,w,h,a),i,j;for(i=0;i*s<w;i++)for(j=0;j*s<h;j++)if((i+j)%2)o+=rect(x+i*s,y+j*s,Math.min(s,w-i*s),Math.min(s,h-j*s),b);return o}
/* checkerboard whose purple cells flip to white on their own clocks, so about 30% are white at any moment */
function checkerAnim(x,y,w,h,s,a,b){var o=rect(x,y,w,h,a),i,j,k,d;for(i=0;i*s<w;i++)for(j=0;j*s<h;j++)if((i+j)%2){k=((i*37+j*91)%100)/100;d=(-k*4).toFixed(2);o+='<rect class="cbf'+(k<.3?' w':'')+'" x="'+(x+i*s)+'" y="'+(y+j*s)+'" width="'+Math.min(s,w-i*s)+'" height="'+Math.min(s,h-j*s)+'" style="--ca:'+b+';--cb:'+a+';animation-delay:'+d+'s"/>'}return o}
function diag(x,y,w,h,st,a,b){var id='p'+(++UID);return '<defs><pattern id="'+id+'" patternUnits="userSpaceOnUse" width="'+st*2+'" height="'+st*2+'" patternTransform="rotate(45)"><rect width="'+st*2+'" height="'+st*2+'" fill="'+a+'"/><rect width="'+st+'" height="'+st*2+'" fill="'+b+'"/></pattern></defs><rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="url(#'+id+')"/>'}
function stair(x,y,w,h,n,f,flip,up){var o='',i;for(i=0;i<n;i++){var ww=w*(n-i)/n;o+=rect(flip?x+w-ww:x,up?y+h-(i+1)*h/n:y+i*h/n,ww,h/n+.3,f)}return o}
/* abstract mail piece, 300x192 (the ratio of the Figma pieces), no text. off=true pushes the motif off the visual centre */
function spin(c,x,y,dur,rev){return '<g class="spin" style="transform-origin:'+x+'px '+y+'px;animation-duration:'+dur+'s'+(rev?';animation-direction:reverse':'')+'">'+c+'</g>'}
function pieceInner(kind,p,off){var a=p[0],b=p[1],c=p[2],d=p[3],W=300,H=192,cx=off?226:150,g=rect(0,0,W,H,a);
  if(kind==='mandala'){g+=off?checker(0,0,92,H,23,a,b):'';g+=spin(mand(cx,96,off?92:90,12,b,c,d),cx,96,22)}
  else if(kind==='checker'){g=checkerAnim(0,0,off?176:W,H,24,a,b)+circ(cx,96,54,d)+spin(star(cx,96,44,24,10,b),cx,96,12,true)+circ(cx,96,10,c)}
  else if(kind==='diag'){g=diag(0,0,W,H,16,a,b)+circ(off?84:150,96,58,c)+circ(off?84:150,96,28,d)}
  else if(kind==='burst'){var bx=off?96:150;g+=(off?stair(214,0,86,H,6,b,true):'')+star(bx,96,104,76,14,c)+circ(bx,96,50,b)+circ(bx,96,21,d)}
  else if(kind==='sqburst'){var qx=off?210:150;g+=rect(qx-76,16,152,160,b)+rect(qx-58,34,116,124,a)+rect(qx-40,52,80,88,b)+spin(star(qx,96,34,16,8,c),qx,96,9)}
  else if(kind==='checker'){g=checkerAnim(0,0,W,H,24,a,b)+circ(150,96,54,d)+spin(star(150,96,44,24,10,b),150,96,12,true)+circ(150,96,12,a)}
  else if(kind==='squiggle'){var qs='';for(var qi=0;qi<10;qi++)qs+='<path d="M-12 '+(6+qi*20.5)+squig(340,7)+'" fill="none" stroke="'+(qi%2?c:b)+'" stroke-width="6" stroke-linecap="round"/>';g+='<g class="drift">'+qs+'</g>'+circ(150,96,34,a)+spin(star(150,96,28,15,8,b),150,96,10)}
  else if(kind==='stamp'){var sx=off?168:100;g+='<path d="'+stampPath(sx,26,100,140,6,4,6,true)+'" fill="'+b+'"/>'+circ(sx+50,96,36,d)+spin(star(sx+50,96,30,16,8,a),sx+50,96,10)+circ(sx+50,96,6,c)+(off?stair(0,0,90,H,6,b,false,false):'')}
  else if(kind==='steps'){g+=stair(0,0,104,H,6,b,false,false)+stair(196,0,104,H,6,b,true,true)+circ(off?112:150,96,56,c)+star(off?112:150,96,34,24,10,d)}
  return g}
function piece(kind,pal,off){var id='k'+(++UID);return '<svg class="pc" viewBox="0 0 300 192"><defs><clipPath id="'+id+'"><rect width="300" height="192" rx="9"/></clipPath></defs><g clip-path="url(#'+id+')">'+pieceInner(kind,PAL[pal],off)+'</g></svg>'}
/* the Figma cascade: a piece on top of five magenta cards at 100/60/38/19/8% */
/* flat postage stamp: a rectangle with semicircle perforations, all four sides or top and bottom only */
function stampPath(x,y,w,h,r,nx,ny,all){var K=.6,sx=w/(nx+2*K),sy=h/(ny+2*K),ox=x+K*sx,oy=y+K*sy,d='M'+x+' '+y,i,c;
  for(i=0;i<nx;i++){c=ox+(i+.5)*sx;d+='H'+f1(c-r)+'A'+r+' '+r+' 0 0 0 '+f1(c+r)+' '+y}
  d+='H'+(x+w);
  if(all)for(i=0;i<ny;i++){c=oy+(i+.5)*sy;d+='V'+f1(c-r)+'A'+r+' '+r+' 0 0 0 '+(x+w)+' '+f1(c+r)}
  d+='V'+(y+h);
  for(i=nx-1;i>=0;i--){c=ox+(i+.5)*sx;d+='H'+f1(c+r)+'A'+r+' '+r+' 0 0 0 '+f1(c-r)+' '+(y+h)}
  d+='H'+x;
  if(all)for(i=ny-1;i>=0;i--){c=oy+(i+.5)*sy;d+='V'+f1(c+r)+'A'+r+' '+r+' 0 0 0 '+x+' '+f1(c-r)}
  return d+'Z'}
function stampSvg(cls,vw,vh,x,y,w,h,r,nx,ny,main,all){return '<svg class="burstsvg '+cls+'" viewBox="0 0 '+vw+' '+vh+'" preserveAspectRatio="none" aria-hidden="true"><path d="'+stampPath(x,y,w,h,r,nx,ny,all)+'" fill="'+main+'"/></svg>'}
function bigStamp(main,all){return stampSvg('l',160,90,22,15,116,60,2.6,12,6,main,all)+stampSvg('p',60,100,6,9,48,82,2.2,6,10,main,all)}

/* perforation squiggle: a row of semicircles, alternately above and below the line, like the stamp's perforation curves */
function squig(w,r){var d='',n=Math.ceil(w/(4*r)),i;for(i=0;i<n;i++)d+='a'+r+' '+r+' 0 0 1 '+2*r+' 0a'+r+' '+r+' 0 0 0 '+2*r+' 0';return d}
/* a concentric animation: rings of one shape grow outward forever; colours repeat, drawn on a canvas */
function T(shape,cols,o,cls){o=o||{};return '<canvas class="tun'+(cls?' '+cls:'')+'" data-shape="'+shape+'" data-cols="'+cols.join('|')+'"'+Object.keys(o).map(function(k){return ' data-'+k+'="'+o[k]+'"'}).join('')+'></canvas>'}

var SL=[];
function R(i,html,tag,cls){return '<'+(tag||'div')+' class="rise'+(cls?' '+cls:'')+'" style="--i:'+i+'">'+html+'</'+(tag||'div')+'>'}
/* 0 hello: concentric stamps grow out from a flat stamp */
SL.push({t:'pink',n:'Hello',d:6500,bg:T('stamp',[MG,PK,PW,PK],{n:8,per:1.7,press:'seq'},'bgc'),h:
  '<div class="in ctr"><div class="tx" style="color:#fff">'+R(0,'<span data-logo></span>','div','stc l')+R(0,'#LobUnwrapped','div','k stc r')+R(1,'2026<br>Unwrapped','h1','hero')+R(2,esc(D.brand)+'’s year in <i style="color:#fff">direct mail</i>','p','lead')+'</div></div>'});
/* 1 pieces sent */
SL.push({t:'pink',n:'Pieces sent',d:6500,h:
  '<div class="in wide"><div class="tx">'+R(0,'You sent','div','k')+R(1,C(D.pieces,'int'),'div','big')+R(2,'pieces of <i>mail</i>','div','lead')+
  R(3,'That’s <b>'+int(D.perDay)+'</b> out the door every day, enough for about 1 in every <b>'+D.hh+'</b> US households.','p','sub')+'</div>'+
  '<div class="art">'+R(2,'<div class="arts">'+T('mix5',[PK,M4,M3,MG],{asp:1.56,n:9,per:1.9})+piece('mandala','bl',false)+'</div>','div','')+'</div></div>'});
/* 2 mix: one abstract piece per format */
SL.push({t:'blue',n:'Your mix',d:6500,bg:T('circle',[B,'rgba(155,147,248,.3)'],{n:10,per:3},'bgc'),h:
  '<div class="in col">'+R(0,'Your mix','div','k')+R(1,'Postcards were your <i>main character</i>','h2','h sm')+
  '<div class="mixrow">'+D.mix.map(function(m,i){return R(i+2,piece(m[2],['pk','mg','wh','lav'][i],false)+'<b>'+C(m[1],'pct')+'</b><span>'+m[0]+'</span><small>'+compact(D.pieces*m[1]/100)+' pieces</small>','div','mix')}).join('')+'</div></div>'});
/* 3 moon: every ring is a trip */
SL.push({t:'mag',n:'To the moon',d:7500,h:
  '<div class="in"><div class="tx">'+R(0,'Piece-miles','div','k')+R(1,'Your mail traveled <span style="color:var(--ac)">'+C(D.pieceMiles,'bil')+' billion</span> miles','h2','h sm')+
  R(2,'That’s <b>'+C(D.trips,'int')+'</b> trips to the <i>moon</i>.','p','lead')+R(3,'Piece-miles = pieces × average delivery distance ('+int(D.avgMi)+' mi). Moon: 238,855 mi one way.','p','fine')+'</div>'+
  '<div class="art">'+R(2,T('circle',[MG,'diag:#4131f1:#f7dffa',B,'check:#f7dffa:#4131f1',PK],{n:9,per:2.4},'round'),'div','')+'</div></div>'});
/* 4 coverage */
SL.push({t:'blue',n:'% of the US',d:7000,map:1,bg:'<canvas class="tun bgc" id="cv"></canvas>',h:
  '<div class="in"><div class="tx">'+R(0,'You reached','div','k')+R(1,C(D.pct,'pct'),'div','big lg')+R(2,'of US <i>households</i>','div','lead')+R(3,'<span class="pill" style="background:var(--lime);color:var(--ink)">'+D.states+' states, one mailbox at a time</span>')+'</div>'+
  '<div class="art">'+R(1,'<div class="map"></div>','div','')+'</div></div>'});
/* 5 metros */
SL.push({t:'lav',n:'Metros',d:6500,bg:T('square',[LAV,'rgba(208,69,220,.12)'],{n:10,per:3,at:'art'},'bgc'),h:
  '<div class="in"><div class="tx">'+R(0,'Metros delivered to','div','k')+R(1,C(D.metros,'int'),'div','big lg')+R(2,'of 387 <i>US Metros</i>','div','lead')+'</div>'+
  '<div class="art"><div class="rankwrap">'+R(1,'Your top five <i>metros</i>','div','lead')+'<div class="rank">'+D.metroTop.map(function(m,i){return R(i+2,'<div class="n">'+(i+1)+'</div><div><div class="nm">'+m[0]+'<span>'+C(m[1],'int')+'</span></div><div class="t"><i style="--w:'+(100-i*13)+'%;--i:'+i+'"></i></div></div>','div','row')}).join('')+'</div></div></div></div>'});
/* 6 QR: offset squares, repeating */
SL.push({t:'pink',n:'QR scans',d:6500,h:
  '<div class="in"><div class="tx">'+R(0,'QR codes scanned','div','k')+R(1,C(D.scans,'int'),'div','big md')+R(2,'<i>scans</i>, one tap at a time','div','lead')+
  R(3,'<div class="facts"><div class="fact"><b>'+C(D.qrRate,'p1')+'</b><span>of your pieces got scanned</span></div><div class="fact"><b>Tue 7 PM</b><span>when your audience scans most</span></div></div>','div')+'</div>'+
  '<div class="art">'+R(2,T('mix6',[PK,'diag:#4131f1:#f7dffa',MG,'check:#f7dffa:#4131f1',LAV],{n:8,per:1.9,dx:.075,dy:.075,pts:14,rot:6}),'div','')+'</div></div>'});
/* 7 PURL: a fading trail of rectangles */
SL.push({t:'mag',n:'PURL clicks',d:7000,purl:1,bg:'<canvas class="tun bgc" data-trail="purl" data-x0=".535" data-w=".33" data-ratio="1.3" data-strip="65,49,241" data-pal="mag"></canvas>',h:
  '<div class="in"><div class="tx">'+R(0,'PURLs clicked','div','k')+R(1,C(D.clicks,'int'),'div','big md')+R(2,'<b>'+C(D.uniq,'int')+'</b> people landed on a page with <i>their own name</i> on it.','p','lead')+'</div></div>'});
/* 8 results: concentric bursts around a flat stamp */
SL.push({t:'blue',n:'Results',d:6500,bg:T('star',[PW,B,M3,B],{pts:12,n:9,per:2.6,rot:8},'bgc'),pre:bigStamp(MG,false),h:
  '<div class="in ctr"><div class="tx" style="color:#fff;gap:calc(var(--u)*2.6)">'+R(0,'What it added up to','div','k')+R(1,C(D.rev,'usd'),'div','big lg')+R(2,'in revenue from <i style="color:#f7dffa">mail</i>','div','lead')+'</div></div>'});
/* 9 delivery */
SL.push({t:'blue',n:'Speed & quality',d:6500,bg:'<canvas class="tun bgc" data-trail="purl" data-x0=".535" data-w=".33" data-ratio="1.3" data-py=".8"></canvas>',h:
  '<div class="in"><div class="tx">'+R(0,'Delivery','div','k')+R(1,C(D.days,'d1')+'<small style="margin-left:.5em">days</small>','div','big lg')+R(2,'average time to <i>mailbox</i>','div','lead')+
