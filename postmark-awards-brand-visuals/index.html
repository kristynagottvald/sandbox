*{box-sizing:border-box;margin:0}
html,body{background:#000;color:#f2f2f2}

  const dt = Math.max(0, Math.min(0.1, (now - last) / 1000)); last = now; if (!reduce) clock += dt;
  const t = reduce ? STILL_T : clock % PERIOD;
  for (const s of surfaces) { s.ctx.setTransform(1, 0, 0, 1, 0, 0); s.ctx.clearRect(0, 0, s.cv.width, s.cv.height); s.ctx.setTransform(s.k, 0, 0, s.k, 0, 0); s.draw(s.ctx, s.W, s.H, t); }
  requestAnimationFrame(loop);
}
surface(document.getElementById('cMascot'), 1000, 1000, drawMascot);
surface(document.getElementById('cLogo'), 1000, 1000, drawLogo);
surface(document.getElementById('cYear'), 1000, 1000, drawYear);
addEventListener('resize', () => surfaces.forEach((s) => s.fit()));
requestAnimationFrame(loop);
</script>
