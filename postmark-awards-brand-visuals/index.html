<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Postmark Awards 2026 Brand Visuals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700&family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--purple:#7A4BFF;--red:#F2442E;--black:#0B0B0B;--white:#fff}
*{box-sizing:border-box;margin:0}
html,body{background:#000;color:#f2f2f2}
body{min-height:100vh;display:flex;flex-direction:column;font:400 16px/1.4 "Inter","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
nav.back{box-sizing:border-box;display:flex;align-items:center;gap:8px;height:49px;padding:0 20px;background:#000;border-bottom:1px solid #1c1c1c;font:400 13px/1.35 "Inter","Helvetica Neue",Helvetica,Arial,sans-serif}
nav.back a{color:#8d8d8d;text-decoration:none}
nav.back a:hover,nav.back a:focus-visible{color:#fff;text-decoration:underline;text-underline-offset:3px}
nav.back span{color:#6e6e6e}
nav.back b{font-weight:500;color:#fff;overflow:hidden;text-overflow:ellipsis}
@media (max-width:640px){nav.back{padding:0 16px}nav.back .x{display:none}}
main{flex:1;display:flex;align-items:center;width:100%;max-width:1760px;margin:0 auto;padding:clamp(20px,3vw,40px) clamp(16px,2.4vw,34px) 60px}
.grid{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(16px,2.4vw,40px)}
figure{display:block}
figure canvas{display:block;width:100%;height:auto;aspect-ratio:1/1;background:var(--black)}
figcaption{margin-top:14px;padding:18px 22px;background:var(--white);color:var(--black);font:700 clamp(12px,1.15vw,16px)/1.2 "Inter","Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="back" aria-label="Sandbox"><a href="../">Sandbox</a><span>/</span><a href="../">Back to all projects</a><span>/</span><b>Postmark Awards 2026 Brand Visuals</b></nav>
<main>
<div class="grid">
  <figure><canvas id="cMascot" role="img" aria-label="A flat black porcupine with purple and red postage stamps stuck on the tips of its quills"></canvas><figcaption>Mascot</figcaption></figure>
  <figure><canvas id="cLogo" role="img" aria-label="Postmark Awards 2026 logotype in white on black, where the O in Postmark is a thick red outline of a postage stamp that stamps down"></canvas><figcaption>Logotype</figcaption></figure>
  <figure><canvas id="cYear" role="img" aria-label="2026 repeated in four rows, where the digits are outlined and the zero is a thick outline stamp that changes between portrait, square and landscape perforated stamps"></canvas><figcaption>Stamp 2026</figcaption></figure>
</div>
</main>
<script>
const TAU = Math.PI * 2, PERIOD = 6, STILL_T = 0;
const PURPLE = '#7A4BFF', RED = '#F2442E', BLACK = '#0B0B0B', WHITE = '#FFFFFF';
const cl = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = (u) => 0.5 - 0.5 * Math.cos(Math.PI * cl(u, 0, 1));
const easeOut = (u) => 1 - Math.pow(1 - cl(u, 0, 1), 3);
const lerp = (a, b, m) => a + (b - a) * m;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const HP = new URLSearchParams(location.hash.slice(1));
const SANS = '"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif', BLACKFACE = '"Archivo Black","Arial Black","Helvetica Neue",Arial,sans-serif';

/* ===== stamp shapes: every shape is N points walked clockwise from the top, so two shapes can morph point by point ===== */
const N = 1000;
const RECT = { stamp: [0.84, 1], square: [1, 1], wide: [1, 0.86], tall: [0.7, 1] };
function pt(kind, u) {
  const th = TAU * u - Math.PI / 2, c = Math.cos(th), s = Math.sin(th);
  if (RECT[kind]) { // perforated postage stamp (portrait, square or landscape)
    const [aw, ah] = RECT[kind], kx = Math.abs(c) < 1e-9 ? 1e9 : aw / Math.abs(c), ky = Math.abs(s) < 1e-9 ? 1e9 : ah / Math.abs(s);
    const k = Math.min(kx, ky); let x = c * k, y = s * k;
    const vert = kx < ky, len = vert ? 2 * ah : 2 * aw, along = vert ? y : x, ne = Math.max(2, Math.round(len / 0.5)), pitch = len / ne;
    const f = ((along + len / 2) / pitch) % 1, d = (f - 0.5) * pitch, rb = 0.15, depth = Math.abs(d) < rb ? Math.sqrt(rb * rb - d * d) : 0;
    if (vert) x -= Math.sign(x) * depth; else y -= Math.sign(y) * depth;
    return [x, y];
  }
  if (kind === 'flower') { const r = 0.86 + 0.14 * Math.cos(TAU * 10 * u); return [c * r, s * r]; }
  if (kind === 'sparkle') { const n = 1.15, r = Math.pow(Math.pow(Math.abs(c), n) + Math.pow(Math.abs(s), n), -1 / n); return [c * r, s * r]; }
  if (kind === 'burst') { const f = (u * 14) % 1, r = 0.7 + 0.3 * Math.abs(2 * f - 1); return [c * r, s * r]; }
  if (kind === 'seal') { // round perforated postmark
    const f = (u * 22 + 0.5) % 1, d = f - 0.5, w = 0.3, depth = Math.abs(d) < w ? 0.1 * Math.sqrt(1 - (d / w) ** 2) : 0;
    return [c * (1 - depth) * 0.95, s * (1 - depth)];
  }
  if (kind === 'hole') { const a = 0.29, b = 0.42, n = 2.6, r = Math.pow(Math.pow(Math.abs(c / a), n) + Math.pow(Math.abs(s / b), n), -1 / n); return [c * r, s * r]; }
}
const SH = {};
const shape = (k) => SH[k] || (SH[k] = Array.from({ length: N }, (_, i) => pt(k, i / N)));
const poly = (ctx, P) => { ctx.moveTo(P[0][0], P[0][1]); for (let i = 1; i < P.length; i++) ctx.lineTo(P[i][0], P[i][1]); ctx.closePath(); };
const morph = (a, b, m) => { const A = shape(a), B = shape(b); return m <= 0 ? A : m >= 1 ? B : A.map((p, i) => [lerp(p[0], B[i][0], m), lerp(p[1], B[i][1], m)]); };
/* a thick outline stamp: the shape with an oval counter cut out, so it still reads as a zero or an O. Drawn at (x, y), half height R. */
function ringStamp(ctx, x, y, R, rot, P, color, hs = 1) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(R, R); ctx.fillStyle = color;
  ctx.beginPath(); poly(ctx, P); poly(ctx, shape('hole').map((q) => [q[0] * hs, q[1] * hs])); ctx.fill('evenodd'); ctx.restore();
}

/* ===== 1. Mascot ===== */
const SPIKES = 15, CX = 500, CY = 652, R0 = 232;
const STAMPS = [ // [spike index, shape, colour, half width, half height, tilt]
  [1, 'wide', PURPLE, 84, 66, -0.2], [3, 'square', RED, 66, 66, 0.3], [5, 'tall', PURPLE, 56, 80, -0.15], [7, 'stamp', RED, 66, 80, 0.12],
  [9, 'wide', PURPLE, 84, 66, -0.35], [11, 'square', RED, 66, 66, 0.2], [13, 'tall', PURPLE, 56, 80, -0.1],
];
const TIPS = [352, 330, 368, 392, 388, 408, 396, 424, 392, 410, 388, 394, 366, 328, 350];
const spikeAng = (k) => Math.PI - 0.1 + k * (Math.PI + 0.2) / (SPIKES - 1);
function drawMascot(ctx, W, H, t) {
  ctx.fillStyle = WHITE; ctx.fillRect(0, 0, W, H);
  const ph = TAU * t / PERIOD, bob = 5 * Math.sin(ph * 2), half = (Math.PI + 0.2) / (SPIKES - 1) / 2;
  ctx.save(); ctx.translate(0, bob);
  // legs
  ctx.strokeStyle = BLACK; ctx.lineWidth = 40; ctx.lineJoin = 'round'; ctx.lineCap = 'butt';
  [[400, 0], [610, Math.PI]].forEach(([x, off]) => {
    const lift = Math.max(0, Math.sin(ph * 4 + off)) * 16;
    ctx.beginPath(); ctx.moveTo(x, CY + 60); ctx.lineTo(x, CY + 150 - lift); ctx.lineTo(x - 60, CY + 150 - lift); ctx.stroke();
  });
  // body: a fan of spikes
  ctx.fillStyle = BLACK; ctx.beginPath();
  ctx.moveTo(CX - R0 + 4, CY + 84);
  for (let k = 0; k < SPIKES; k++) {
    const a = spikeAng(k), v0 = a - half, v1 = a + half;
    ctx.lineTo(CX + Math.cos(v0) * R0, CY + Math.sin(v0) * R0);
    ctx.lineTo(CX + Math.cos(a) * TIPS[k], CY + Math.sin(a) * TIPS[k]);
    ctx.lineTo(CX + Math.cos(v1) * R0, CY + Math.sin(v1) * R0);
  }
  ctx.lineTo(CX + R0 - 4, CY + 84); ctx.closePath(); ctx.fill();
  // eye
  const blink = (t % 3) > 2.2 && (t % 3) < 2.36 ? 0.12 : 1;
  ctx.fillStyle = WHITE; ctx.beginPath(); ctx.ellipse(CX + 168, CY + 22, 76, 42 * blink, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = BLACK; ctx.beginPath(); ctx.ellipse(CX + 200 + 10 * Math.sin(ph), CY + 22, 23, 20 * blink, 0, 0, TAU); ctx.fill();
  // stamps stuck on the quill tips
  STAMPS.forEach(([k, kind, col, hw, hh, tilt], i) => {
    const a = spikeAng(k), R = TIPS[k] - 30, sway = 0.1 * Math.sin(ph * 2 + i * 0.9);
    ctx.save(); ctx.translate(CX + Math.cos(a) * R, CY + Math.sin(a) * R); ctx.rotate(a + Math.PI / 2 + tilt + sway);
    ctx.save(); ctx.translate(0, -hh); ctx.scale(hw, hh); ctx.fillStyle = col; ctx.beginPath(); poly(ctx, shape(kind)); ctx.fill(); ctx.restore();
    ctx.fillStyle = BLACK; ctx.beginPath(); ctx.moveTo(-11, 1); ctx.lineTo(11, 1); ctx.lineTo(0, -hh * 1.15); ctx.closePath(); ctx.fill();
    ctx.restore();
  });
  ctx.restore();
}

/* ===== 2. Logotype ===== */
function drawLogo(ctx, W, H, t) {
  ctx.fillStyle = BLACK; ctx.fillRect(0, 0, W, H);
  ctx.font = '700 100px ' + SANS; ctx.textBaseline = 'alphabetic'; ctx.letterSpacing = '-3px';
  const m = (s) => ctx.measureText(s).width, cap100 = ctx.measureText('H').actualBoundingBoxAscent;
  const ow100 = cap100 * 1.06, g100 = cap100 * 0.03, total = m('P') + ow100 + 2 * g100 + m('STMARK');
  const k = (W * 0.84) / total, fs = 100 * k, cap = cap100 * k;
  ctx.font = '700 ' + fs + 'px ' + SANS; ctx.letterSpacing = (-3 * k) + 'px';
  const x0 = W * 0.08, lh = cap * 1.14, y0 = (H - (cap + 2 * lh)) / 2 + cap, g = g100 * k, ow = ow100 * k;
  ctx.fillStyle = WHITE; ctx.fillText('P', x0, y0);
  const sx = x0 + ctx.measureText('P').width + g, stampX = sx + ow / 2, stampY = y0 - cap / 2;
  ctx.fillText('STMARK', sx + ow + g, y0); ctx.fillText('AWARDS', x0, y0 + lh);
  ctx.fillStyle = PURPLE; ctx.fillText('2026', x0, y0 + 2 * lh);
  // the O: lift, then stamp down (every 3 seconds)
  const p = (((t + 1) / 3) % 1 + 1) % 1;
  const sc = p < 0.1 ? lerp(1.5, 1, easeOut(p / 0.1)) : p < 0.75 ? 1 : lerp(1, 1.5, ease((p - 0.75) / 0.25));
  const rot = p < 0.1 ? lerp(-0.14, 0, easeOut(p / 0.1)) : p < 0.75 ? 0 : lerp(0, -0.14, ease((p - 0.75) / 0.25));
  const R = cap * 0.6 * sc;
  ringStamp(ctx, stampX, stampY, R, rot, shape('stamp'), RED, 1.28);
}

/* ===== 3. Repeating 2026 with a stamp for the zero ===== */
const KINDS = ['stamp', 'square', 'wide', 'tall'], ROWS = [RED, WHITE, PURPLE, WHITE];
function drawYear(ctx, W, H, t) {
  ctx.fillStyle = BLACK; ctx.fillRect(0, 0, W, H);
  const cw = 228, ch = 196, x0 = (W - cw * 4) / 2, y0 = (H - ch * 4) / 2;
  ctx.font = '400 250px ' + BLACKFACE; ctx.lineWidth = 6; ctx.lineJoin = 'round'; ctx.textBaseline = 'alphabetic';
  const seg = t / 1.5, fl = Math.floor(seg), fr = seg - fl, mo = ease((fr - 0.5) / 0.5);
  for (let r = 0; r < 4; r++) {
    const col = ROWS[r], cy = y0 + r * ch + ch / 2;
    ctx.fillStyle = col; ctx.strokeStyle = col;
    ['2', '0', '2', '6'].forEach((d, i) => {
      const cx = x0 + i * cw + cw / 2;
      if (d === '0') {
        const a = KINDS[(fl + r) % 4], b = KINDS[(fl + r + 1) % 4];
        ringStamp(ctx, cx, cy, 94, 0.06 * Math.sin(TAU * t / 3 + r * 1.3), morph(a, b, mo), col);
      } else {
        const mm = ctx.measureText(d), w = mm.actualBoundingBoxLeft + mm.actualBoundingBoxRight, h = mm.actualBoundingBoxAscent;
        ctx.strokeText(d, cx - w / 2 + mm.actualBoundingBoxLeft, cy + h / 2);
      }
    });
  }
}

/* ===== loop ===== */
const surfaces = [];
function surface(cv, W, H, draw) {
  const s = { cv, ctx: cv.getContext('2d'), W, H, draw, k: 1 };
  s.fit = () => { const r = cv.getBoundingClientRect(); if (!r.width) return; const dpr = Math.min(devicePixelRatio || 1, 2), w = Math.round(r.width * dpr); if (cv.width !== w) { cv.width = w; cv.height = Math.round(w * H / W); } s.k = cv.width / W; };
  s.fit(); surfaces.push(s); return s;
}
let clock = HP.has('from') ? +HP.get('from') : 0, last = performance.now();
function loop(now) {
  const dt = Math.max(0, Math.min(0.1, (now - last) / 1000)); last = now; if (!reduce) clock += dt;
  const t = reduce ? STILL_T : clock % PERIOD;
  for (const s of surfaces) { s.ctx.setTransform(1, 0, 0, 1, 0, 0); s.ctx.clearRect(0, 0, s.cv.width, s.cv.height); s.ctx.setTransform(s.k, 0, 0, s.k, 0, 0); s.draw(s.ctx, s.W, s.H, t); }
  requestAnimationFrame(loop);
}
surface(document.getElementById('cMascot'), 1000, 1000, drawMascot);
surface(document.getElementById('cLogo'), 1000, 1000, drawLogo);
surface(document.getElementById('cYear'), 1000, 1000, drawYear);
addEventListener('resize', () => surfaces.forEach((s) => s.fit()));
requestAnimationFrame(loop);
</script>
</body>
</html>
