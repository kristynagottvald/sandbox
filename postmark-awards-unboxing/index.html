<style>
:root{--purple:#7A4BFF;--red:#F2442E;--black:#0B0B0B;--white:#fff}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#0B0B0B;color:#f2f2f2}
body{display:flex;flex-direction:column;font:400 16px/1.4 "Inter","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
nav.back{box-sizing:border-box;display:flex;align-items:center;gap:8px;height:49px;padding:0 20px;background:#000;border-bottom:1px solid #1c1c1c;font:400 13px/1.35 "Inter","Helvetica Neue",Helvetica,Arial,sans-serif}
nav.back a{color:#8d8d8d;text-decoration:none}
nav.back span{color:#6e6e6e}
nav.back b{font-weight:500;color:#fff;overflow:hidden;text-overflow:ellipsis}
#stage{position:relative;flex:1;min-height:0;overflow:hidden;cursor:grab;touch-action:none;background:#14141a}
#stage.drag{cursor:grabbing}
#stage canvas{display:block;width:100%!important;height:100%!important}
#cap{position:absolute;left:clamp(14px,2.4vw,34px);bottom:clamp(14px,2.4vw,30px);display:flex;align-items:stretch;gap:0;pointer-events:none;font:700 clamp(11px,1vw,14px)/1.2 "Archivo","Inter",Helvetica,Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase}
#cap i{font-style:normal;background:var(--red);color:#fff;padding:12px 14px}
#cap b{background:#fff;color:#0B0B0B;padding:12px 18px;font-weight:700;min-width:15em}
body.clip #cap{display:none}
.ctl{display:flex;align-items:center;gap:8px}
.ctl button{appearance:none;border:1px solid rgba(255,255,255,.22);background:transparent;color:#fff;font:400 11px/1 "Inter","Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;padding:9px 12px;border-radius:0;cursor:pointer;transition:background .2s,border-color .2s,color .2s}
.ctl button:hover,.ctl button:focus-visible{border-color:#fff}
.ctl button.on{background:#fff;color:#0B0B0B;border-color:#fff}
.ctl input[type=range]{width:min(18vw,220px);accent-color:#7A4BFF}
.ctl .chips{display:flex;gap:4px}
@media (max-width:1180px){.ctl .chips{display:none}}
@media (max-width:640px){.ctl input[type=range]{width:100%;flex:1 1 140px}}

/* sandbox project bar: the home page nav's 72px height, SANDBOX / PROJECT NAME in its all-caps label style, any controls on the right */
html body nav.back{box-sizing:border-box;flex:none;align-self:stretch;width:auto;align-items:center;gap:10px;height:72px;min-height:72px;padding:0 30px;background:#181716;border-bottom:1px solid rgba(255,255,255,.1);color:#fff;font:400 13px/1.35 "Inter","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;white-space:nowrap;overflow:hidden}
html body nav.back>a,html body nav.back>span,html body nav.back>b{font:400 12px/1.3 "Inter","Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;text-decoration:none}
html body nav.back>a{color:#989898;transition:color .2s}
html body nav.back>a:hover,html body nav.back>a:focus-visible{color:#fff;text-decoration:none}
html body nav.back>span{color:#6b6b6b}
html body nav.back>b{font-weight:400;color:#fff;min-width:0;overflow:hidden;text-overflow:ellipsis}
html body nav.back:not(:has(>div))>b{display:block}
html body nav.back>div{margin-left:auto}
@media (min-width:641px){html body nav.back>b{display:block}}
@media (max-width:640px){html body nav.back{padding:0 20px}}
/* phones: the bar's controls move to a panel (also a nav.back, so the page's own control styles still apply) under the visual */
html body nav.back.sb-panel{position:static;height:auto;min-height:0;padding:12px 20px;justify-content:center;flex-wrap:wrap;border-bottom:0;border-top:1px solid rgba(255,255,255,.1);white-space:normal;overflow:visible;z-index:auto}
html body nav.back.sb-panel>div{margin:0;flex:0 1 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;max-width:100%;min-width:0}
html body nav.back:not(.sb-panel):not(:has(>div))>a,html body nav.back:not(.sb-panel):not(:has(>div))>span{display:block}
</style>

<nav class="back" aria-label="Sandbox"><a href="../">Sandbox</a><span>/</span><b>Postmark Awards Unboxing 3D</b>

    <button id="play" type="button" aria-label="Pause the unboxing">Pause</button>

    <span class="chips" id="chips"></span>
    <button id="save" type="button" aria-label="Save the current view as a PNG">Save PNG</button>
  </div>
</nav>

/* ============================================================================================
   p5 glue: camera, drawing the lists, interaction
   ============================================================================================ */
let holder;
function setup() {

  Promise.race([Promise.all(fonts), new Promise((ok) => setTimeout(ok, 2500))]).then(() => { buildTextures(); document.body.dataset.ready = '1'; });

}

function draw() {

/* ---------- UI ---------- */

let lastStage = -1, wantSave = false;

</script>
