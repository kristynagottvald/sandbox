<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brickanta Enterprise Visuals</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 fill=%22%23e8584f%22/%3E%3Cpath fill=%22%230e1f4c%22 d=%22M14 14H38L50 26V50H26L14 38Z%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=Tektur:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--plum:#3c222e;--blue:#739cd0;--coral:#e8584f;--coral2:#ee6a64;--navy:#0e1f4c;--ice:#d4e0ee;--paper:#f7f4f0;
  --sans:"IBM Plex Sans","Helvetica Neue",Helvetica,Arial,sans-serif;--display:"Tektur","IBM Plex Sans","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{background:#000;color:#f2f2f2}
body{min-height:100vh;display:flex;flex-direction:column;font:400 16px/1.4 var(--sans);-webkit-font-smoothing:antialiased}
nav.back{box-sizing:border-box;display:flex;align-items:center;gap:8px;height:49px;padding:0 20px;background:#000;border-bottom:1px solid #1c1c1c;font:400 13px/1.35 var(--sans);white-space:nowrap;overflow:hidden}
nav.back a{color:#8d8d8d;text-decoration:none}
nav.back a:hover,nav.back a:focus-visible{color:#fff;text-decoration:underline;text-underline-offset:3px}
nav.back span{color:#6e6e6e}
nav.back b{font-weight:500;color:#fff;overflow:hidden;text-overflow:ellipsis}
@media(max-width:640px){nav.back{padding:0 16px}nav.back .x{display:none}}
main{flex:1;display:flex;align-items:center;width:100%;max-width:1760px;margin:0 auto;padding:clamp(20px,3vw,40px) clamp(16px,2.4vw,34px) 60px}
.grid{width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(16px,2.4vw,40px)}
figure{display:block;min-width:0}
.stage{position:relative;aspect-ratio:1/1;overflow:hidden;container-type:inline-size;isolation:isolate}
figcaption{margin-top:10px;padding:12px 16px;background:var(--paper);color:var(--plum);font:700 clamp(10px,.85vw,12px)/1.2 var(--sans);letter-spacing:.18em;text-transform:uppercase}
@media(max-width:1300px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
/* recorded clip: just the squares, no captions, two rows of four filling the stage */
.clip main{padding:0;justify-content:center}.clip .grid{gap:12px;width:100%;max-width:none;grid-template-columns:repeat(4,1fr)}.clip figcaption{display:none}

/* 1 hero: the logo as a window */
.s-hero{background:var(--paper)}
.tile{position:absolute;left:8%;top:17%;width:80%;aspect-ratio:1;background:var(--navy)}
.tile .win{position:absolute;left:0;top:-11%;width:109%;height:120%}
.tile .winA{clip-path:url(#markA)}.tile .winB{clip-path:url(#markB)}
.tile .in-a,.tile .in-b{position:absolute;inset:0;background:var(--ice)}
.tile .scene{position:absolute;left:-2%;top:-2%;width:104%;height:104%}
.msg{position:absolute;z-index:3;font-size:2.55cqw;line-height:1.35;color:#fff;opacity:0}
.msg small{display:block;font:600 .72em var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--coral2);margin-bottom:.45em}
.msg .src{display:inline-block;margin:.5em .3em 0 0;padding:.15em .6em;background:var(--coral);color:#fff;font-size:.72em;font-weight:500}
.mA{left:3%;top:32%;width:42%}
.mB{left:24%;top:77%;width:56%}
.s-hero .eb{position:absolute;left:11%;top:5.5%;font:600 1.9cqw var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--plum)}

/* 2 schedule card on a texture */
.s-sched{background:var(--blue)}
.s-sched .tx{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.1);mix-blend-mode:multiply;opacity:.85}
.card{position:absolute;left:4%;right:4%;top:50%;transform:translateY(-50%);background:var(--paper);color:var(--navy);padding:3cqw;font-size:2.12cqw;line-height:1.3;z-index:1;opacity:0}
.gt-t{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:1.4em;letter-spacing:-.01em;padding:0 .1em .55em}
.gt-t span+span{font-size:.62em;font-weight:500;border:1px solid rgba(14,31,76,.3);padding:.4em .7em;background:#fff;letter-spacing:0}
.gt-b{position:relative;background:#fff;border:1px solid rgba(14,31,76,.14);overflow:hidden}
.gt-r{display:grid;grid-template-columns:34% 1fr;align-items:center;min-height:2.8em;border-top:1px solid rgba(14,31,76,.1);position:relative}
.gt-r>span{padding:0 .8em;font-weight:500;line-height:1.2}
.gt-r.gt-m{border-top:0}
.gt-r.gt-m,.gt-r.gt-m .tlc{min-height:2.7em}
.gt-r.gt-k,.gt-r.gt-k .tlc{min-height:3.5em}
.tlc{position:relative;align-self:stretch;border-left:1px solid rgba(14,31,76,.1)}
.tlc em{position:absolute;top:50%;transform:translateY(-50%);font-style:normal;font-weight:500;white-space:nowrap;opacity:.75}
.gt-m .tlc em{font-weight:600;opacity:1}
.td{position:absolute;top:50%;width:.75em;height:.75em;background:var(--navy);transform:translate(-50%,-50%) rotate(45deg)}
.gt-g{display:flex;gap:.7em;align-items:baseline;padding:.65em .8em;background:rgba(14,31,76,.07);border-top:1px solid rgba(14,31,76,.1);font-weight:600}
.gt-g i{font-style:normal;font-weight:400;opacity:.55}
.bar{font-style:normal;position:absolute;top:50%;height:1.85em;margin-top:-.925em;background:rgba(14,31,76,.13);border-left:3px solid var(--navy);padding:0 .6em;font-weight:500;line-height:1.85em;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;transform-origin:left center;transform:scaleX(0)}
.bar.pl.flag{background:#f2c9c7}
.tdl{position:absolute;top:0;bottom:0;left:calc(34% + 66%*.46);width:2px;background:var(--navy);transform-origin:top;transform:scaleY(0)}
.ai{margin-top:.9em;background:var(--navy);color:#fff;padding:1.1em 1.3em;clip-path:polygon(0 0,calc(100% - 1.1em) 0,100% 1.1em,100% 100%,0 100%)}
.ai-h{display:flex;align-items:center;gap:.7em;font-size:1em;margin-bottom:.6em}
.ai-h b{font-weight:600}
.ai-st{margin-left:auto;opacity:.65;font-size:.95em;display:flex;align-items:center;gap:.5em}
.ai-st::before{content:"";width:.5em;height:.5em;background:var(--coral2);opacity:var(--dot,1)}
.ai-st.ok::before{background:#7fd6a0}
.brk{width:1.6em;height:1.6em;flex:none;display:grid;place-items:center}
.brk i{display:block;background:var(--coral2);clip-path:polygon(0 0,calc(100% - var(--c,.32em)) 0,100% var(--c,.32em),100% 100%,var(--c,.32em) 100%,0 calc(100% - var(--c,.32em)))}
.ai-t{font-size:1.02em;line-height:1.45;min-height:2.9em}
.ai-t.typing::after{content:"";display:inline-block;width:.5em;height:1em;background:var(--coral2);margin-left:2px;vertical-align:-.15em}
.ai-a{display:flex;gap:.6em;margin-top:.9em}
.ai-a span{font-size:.95em;font-weight:500;padding:.55em 1em}
.a1{background:var(--coral);color:var(--navy)}
.a2{display:none!important;background:#7fd6a0;color:var(--navy);align-items:center;gap:.5em}
.a2 svg{width:1.1em;height:1.1em;fill:var(--navy)}
.a3{box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
.card.fixed .a1,.card.fixed .a3{display:none}.card.fixed .a2{display:inline-flex!important}

/* 4 example project switcher */
.s-ex{clip-path:polygon(0 0,calc(100% - 3cqw) 0,100% 3cqw,100% 100%,0 100%)}
.s-ex::before,.s-ex::after{content:"";position:absolute;left:2.4cqw;width:2.4cqw;height:1.6cqw;border-left:2px solid currentColor;opacity:.7}
.s-ex::before{top:2.4cqw;border-top:2px solid currentColor}.s-ex::after{bottom:2.4cqw;border-bottom:2px solid currentColor}
.s-ex .ruler{position:absolute;left:2.4cqw;top:7.5cqw;bottom:7.5cqw;width:1.6cqw;opacity:.5;background:repeating-linear-gradient(0deg,currentColor 0 2px,transparent 2px 4.2cqw)}
.s-ex .lines{position:absolute;inset:0;opacity:.18;background-image:repeating-linear-gradient(90deg,currentColor 0 1px,transparent 1px 12px)}
.xc{position:absolute;left:11%;right:11%;top:50%;transform:translateY(-50%);background:var(--paper);color:var(--plum);padding:3.4cqw;font-size:2.55cqw;line-height:1.35}
.xc .hd{display:flex;justify-content:space-between;align-items:center;font:600 .85em var(--display);letter-spacing:.1em;text-transform:uppercase;padding-bottom:1em;margin-bottom:.4em;border-bottom:1px solid rgba(60,34,46,.25)}
.xc .hd i{font:500 .9em var(--display);letter-spacing:.06em;opacity:.55;text-transform:none}
.xc .big{font:500 1.95em/1.15 var(--sans);letter-spacing:-.02em;padding:.45em 0 .4em}
.xc .r{display:grid;grid-template-columns:6.4em 1fr;gap:.8em;padding:.8em 0;border-top:1px solid rgba(60,34,46,.16)}
.xc .r b{font-weight:600;font-size:.8em;letter-spacing:.1em;text-transform:uppercase;opacity:.55;padding-top:.25em}
.xc .r em{display:inline-block;margin:.4em .4em 0 0;font-style:normal;font-size:.8em;font-weight:500;padding:.15em .65em;background:var(--plum);color:#fff}
.xc .r em.hot{background:var(--coral)}
.s-ex .ex{position:absolute;left:11%;right:11%;bottom:4.6%;display:flex;justify-content:space-between;align-items:center;font:600 1.9cqw var(--display);letter-spacing:.14em;text-transform:uppercase}
.s-ex .ex span{opacity:.75}
.pips{display:flex;gap:.8cqw;align-items:center}
.pips i{display:block;height:.9cqw;width:2.2cqw;background:currentColor;opacity:.28}
.pips i.on{width:4.6cqw;opacity:1}

/* 5 + 6 logo lockup, tagline, diagonal duotone photo shard */
.s-logo{background:var(--plum);color:#f7f4f0}
.s-logo .lk{position:absolute;right:6%;top:6%;display:flex;align-items:center;gap:1.6cqw}
.s-logo .lm{width:5.4cqw;height:5.4cqw;overflow:visible;color:var(--coral)}
.s-logo .wm{font:500 6.6cqw/1 var(--sans);letter-spacing:-.04em;color:#ece5e7}
.s-logo .tg{position:absolute;left:6%;top:17%;width:56%;font:500 5cqw/1.2 var(--sans);letter-spacing:-.02em;color:#fff}
.s-logo .sh{position:absolute;inset:0;overflow:hidden}
.s-logo .sh img{position:absolute;left:-8%;top:-8%;width:116%;height:116%;object-fit:cover}
.s-logo.a .sh img{filter:url(#duoA)}

.s-step{background:#0e1f4c}.s-step svg{position:absolute;inset:0;width:100%;height:100%;display:block}.s-step line{stroke-width:1px;vector-effect:non-scaling-stroke}
.s-ico{background:#739cd0}.s-ico svg{position:absolute;inset:0;width:100%;height:100%;display:block}.s-ico .ic{transform-box:fill-box;transform-origin:center}
.s-pat{background:#081c4e}.s-pat svg{position:absolute;inset:0;width:100%;height:100%;display:block}

/* 3 footer shards */
.s-foot{background:var(--coral);color:var(--navy)}
.s-foot .eb{position:absolute;left:8%;top:7%;display:flex;gap:1.4cqw;align-items:center;font:600 2cqw var(--display);letter-spacing:.14em;text-transform:uppercase}
.s-foot .eb svg{width:3cqw;height:3cqw}
.s-foot h2{position:absolute;left:8%;top:13%;font:400 8.6cqw/1.02 var(--display);letter-spacing:-.025em;color:#fff}
.s-foot p{position:absolute;left:8%;top:33.5%;width:44%;font-size:2.7cqw;line-height:1.4}
.btn{position:absolute;left:8%;top:45.5%;display:inline-flex;font:500 2.7cqw var(--sans);padding:1.9cqw 3.2cqw 1.9cqw 2.8cqw;background:#fff;color:var(--plum);clip-path:polygon(0 0,100% 0,100% calc(100% - 1.4cqw),calc(100% - 1.4cqw) 100%,0 100%)}
.mk{position:absolute;inset:0;width:100%;height:100%;z-index:-1}

/* sandbox project bar: the home page nav's 72px height, SANDBOX / PROJECT NAME in its all-caps label style, any controls on the right */
html body nav.back{box-sizing:border-box;flex:none;align-self:stretch;width:auto;align-items:center;gap:10px;height:72px;min-height:72px;padding:0 30px;background:#181716;border-bottom:1px solid rgba(255,255,255,.1);color:#fff;font:400 13px/1.35 "Inter","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;white-space:nowrap;overflow:hidden}
html body nav.back>a,html body nav.back>span,html body nav.back>b{font:400 12px/1.3 "Inter","Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;text-decoration:none}
html body nav.back>a{color:#989898;transition:color .2s}
html body nav.back>a:hover,html body nav.back>a:focus-visible{color:#fff;text-decoration:none}
html body nav.back>span{color:#6b6b6b}
html body nav.back>b{font-weight:400;color:#fff;min-width:0;overflow:hidden;text-overflow:ellipsis}
html body nav.back:not(:has(>div))>b{display:block}
html body nav.back>div{margin-left:auto}
@media (min-width:641px){html body nav.back>b{display:block}}
@media (max-width:640px){html body nav.back{padding:0 20px}}
</style>
</head>

  var io=function(u){u=cl(u,0,1);return u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2};   /* ease in out */

  var seg=function(t,a,b){return cl((t-a)/(b-a),0,1)};
  var CLIP=/clip/.test(location.hash);
  var FROM=(/from=([\d.]+)/.exec(location.hash)||[0,0])[1]*1;
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(CLIP)document.documentElement.classList.add('clip');

  /* ---------- 1. hero: the tile opens along the logo's 45 degree line, question, answer, then closes ---------- */
  var H={P:9,a:$('#fHero .in-a'),b:$('#fHero .in-b'),mA:$('#fHero .mA'),mB:$('#fHero .mB')};
  function hero(t){
    t=((t%H.P)+H.P)%H.P;
    var open=oq(seg(t,.2,1.9))*(1-io(seg(t,7.3,8.6)));
    var k=1-open;
    H.a.style.transform='translate('+(-34*k)+'%,'+(-34*k)+'%)';
    H.b.style.transform='translate('+(34*k)+'%,'+(34*k)+'%)';
    var a=oq(seg(t,1.5,2.3))*(1-seg(t,7,7.5)),b=oq(seg(t,3,3.8))*(1-seg(t,7,7.5));
    H.mA.style.opacity=a;H.mA.style.transform='translateY('+((1-a)*9)+'px)';
    H.mB.style.opacity=b;H.mB.style.transform='translateY('+((1-b)*9)+'px)';
  }

  /* ---------- 2. schedule card: build, type the finding, flag the piling bar, press apply, bar moves ---------- */
  var C={P:12,card:$('#card'),bars:[].slice.call(document.querySelectorAll('#card .bar')),pl:$('#pl'),tdl:$('#tdl'),txt:$('#aiT'),st:$('#st'),brk:$('#brk'),
    full:'Piling starts before the excavation is done. Moving it 3 days later clears the overlap.',T0:2.1,CH:.026};
  function sched(t){
    t=((t%C.P)+C.P)%C.P;
    var vis=oq(seg(t,0,.7))*(1-seg(t,10.6,11.5));
    C.card.style.opacity=vis;C.card.style.transform='translateY('+(-50+(1-oq(seg(t,0,.8)))*5)+'%)';
    C.bars.forEach(function(el){var d=+el.dataset.d,u=oq(seg(t,d,d+.7));el.style.transform='scaleX('+u+')'});
    C.tdl.style.transform='scaleY('+oq(seg(t,.4,1.2))+')';
    var n=cl(Math.floor((t-C.T0)/C.CH),0,C.full.length),typed=t>=C.T0;
    var end=C.T0+C.full.length*C.CH;
    C.txt.textContent=typed?C.full.slice(0,n):'';
    C.txt.classList.toggle('typing',typed&&t<C.T0+C.full.length*C.CH*.55);
    var flag=t>=C.T0+C.full.length*C.CH*.55&&t<end+.8,fixed=t>=end+.8;
    C.pl.classList.toggle('flag',flag);
    C.pl.style.boxShadow=flag?'0 0 0 '+(2+1.5*(.5+.5*Math.sin(t*6.3)))+'px rgba(232,88,79,'+(.75+.25*Math.sin(t*6.3))+')':'none';
    C.pl.style.left=lerp(40,56,io(seg(t,end+.8,end+1.7)))+'%';
    $('#a1').style.transform=(t>end+.5&&t<end+.8)?'scale(.96)':'none';
    $('#a1').style.filter=(t>end+.5&&t<end+.8)?'brightness(.85)':'none';
    C.card.classList.toggle('fixed',fixed);
    C.st.textContent=fixed?'Overlap cleared':'Checking the schedule';C.st.classList.toggle('ok',fixed);
    C.st.style.setProperty('--dot',fixed?1:(Math.floor(t*2)%2?.2:1));
    /* the brick loader turns its 45 degree bar, then settles into a square */
    var s=fixed?io(seg(t,end+.8,end+1.55)):0,m=.5-.5*Math.cos(Math.PI*2*((t%1.3)/1.3)),
        w=fixed?lerp(lerp(20,9,m),14,s):lerp(20,9,m),h=fixed?lerp(lerp(9,20,m),14,s):lerp(9,20,m);
    C.brk.style.width=w/20*1.6+'em';C.brk.style.height=h/20*1.6+'em';C.brk.style.setProperty('--c',(fixed?lerp(.32,.45,s):.32)+'em');
  }

  /* ---------- 4. example project switcher: each example swaps the stage colour and rebuilds its card ---------- */
  var XT=[
    {l:'Ask your project',bg:'#e8584f',ln:'#3c222e',hd:['Ask your project','Live'],big:'What did we agree on retention for the electrical package?',rows:[['Answer','5% held until handover. Changed to 3% in variation 2.<br><em>Contract §4.2</em><em>Variation 2, p.3</em>'],['Also found','2 open questions on the same package.']]},
    {l:'Project record',bg:'#0e1f4c',ln:'#d4e0ee',hd:['Project record','3 flags'],big:'Two things need a look today.',rows:[['Facade','Invoice 0412 is higher than the contract price.<br><em class="hot">Differs from contract</em>'],['Roofing','Delivery moved to 14 March.<br><em class="hot">Puts the schedule at risk</em>'],['Electrical','All documents up to date.<br><em>OK</em>']]},
    {l:'Bid review',bg:'#ee6a64',ln:'#3c222e',hd:['Bid review','Tender 2026-14'],big:'Worth bidding on, with three reservations.',rows:[['Legal','Delay damages have no cap.<br><em>Contract §11</em>'],['Commercial','No price index for materials.<br><em>Tender terms, p.8</em>'],['Technical','Fire spec conflicts with drawing A-204.<br><em>Spec 07 · A-204</em>']]},
    {l:'New drawings',bg:'#d4e0ee',ln:'#0e1f4c',hd:['New drawing','E-117'],big:'Drawing E-117 just arrived.',rows:[['Linked to','Electrical work package'],['Told','Site lead, Anna'],['Draft','“Please confirm the cable route on level 3.” <em class="hot">Review &amp; send</em>']]},
    {l:'Work packages',bg:'#3c222e',ln:'#ee6a64',hd:['Subcontract draft','Electrical'],big:'Draft ready. Two points are yours.',rows:[['Scope','Pulled from the tender documents.<br><em>Done</em>'],['Terms','Requirements and contract documents added.<br><em>Done</em>'],['To decide','Payment terms. Insurance level.<br><em class="hot">Your call</em>']]},
    {l:'Project memory',bg:'#e8584f',ln:'#3c222e',hd:['Meeting prep','Subcontractor'],big:'Ready for Thursday’s meeting.',rows:[['Open','4 open questions, with sources.'],['Overdue','2 commitments past their date.<br><em class="hot">Follow up</em>'],['Quality','7 requirements to check.']]}
  ];
  var X={SL:3.6,st:$('#fEx'),card:$('#xc'),pips:$('#pips'),lbl:null,cur:-1,rows:[]};
  XT.forEach(function(){X.pips.appendChild(document.createElement('i'))});
  var hx=function(c){return [1,3,5].map(function(i){return parseInt(c.substr(i,2),16)})};
  var mix=function(a,b,k){a=hx(a);b=hx(b);return 'rgb('+a.map(function(v,i){return Math.round(lerp(v,b[i],k))}).join(',')+')'};
  function ex(t){
    var n=XT.length;t=((t%(n*X.SL))+n*X.SL)%(n*X.SL);
    var i=Math.floor(t/X.SL),u=t-i*X.SL,x=XT[i],p=XT[(i+n-1)%n];
    if(i!==X.cur){
      X.cur=i;
      X.card.innerHTML='<div class="hd"><span>'+x.hd[0]+'</span><i>'+x.hd[1]+'</i></div><div class="big">'+x.big+'</div>'+x.rows.map(function(r){return '<div class="r"><b>'+r[0]+'</b><span>'+r[1]+'</span></div>'}).join('');
      X.rows=[].slice.call(X.card.querySelectorAll('.r'));
      [].forEach.call(X.pips.children,function(el,k){el.className=k===i?'on':''});
    }
    var k=io(seg(u,0,.5));
    X.st.style.background=mix(p.bg,x.bg,k);X.st.style.color=mix(p.ln,x.ln,k);
    X.card.style.opacity=oq(seg(u,0,.3))*(1-seg(u,X.SL-.25,X.SL));
    X.rows.forEach(function(r,j){var a=oq(seg(u,.2+j*.12,.8+j*.12));r.style.opacity=a;r.style.transform='translateY('+(1-a)*8+'px)'});
  }

  /* ---------- 5 + 6. lockup: mark slides in on the 45 degree line, tagline, then a duotone shard wipes up the diagonal ---------- */
  function lockup(id,mirror,off){
    var el=$(id),p1=$('.p1',el),p2=$('.p2',el),wm=$('.wm',el),tg=$('.tg',el),sh=$('.sh',el),im=$('.sh img',el),P=9;
    return function(t){
      t=(((t+off)%P)+P)%P;
      var out=io(seg(t,7.7,8.7)),u1=oq(seg(t,.1,1.1))*(1-out),u2=oq(seg(t,.3,1.3))*(1-out);
      p1.setAttribute('transform','translate('+(-1.4*(1-u1))+' '+(-1.4*(1-u1))+')');p1.style.opacity=u1;
      p2.setAttribute('transform','translate('+(1.4*(1-u2))+' '+(1.4*(1-u2))+')');p2.style.opacity=u2;
      var w=oq(seg(t,.7,1.5))*(1-out),g=oq(seg(t,1.1,1.9))*(1-out);
      wm.style.opacity=w;wm.style.transform='translateX('+(1-w)*-4+'%)';
      tg.style.opacity=g;tg.style.transform='translateY('+(1-g)*10+'px)';
      var v=oq(seg(t,.9,2.6))*(1-out),y=100-40*v+(v>.99?1.6*Math.sin(t*.9):0);
      sh.style.clipPath=mirror?'polygon(100% '+y+'%,'+(100-y)+'% '+y+'%,0 100%,100% 100%)':'polygon(0 '+y+'%,'+y+'% '+y+'%,100% 100%,0 100%)';
      var a=Math.PI*2*t/P;im.style.transform='translate('+Math.sin(a)*2.4+'%,'+Math.cos(a)*1.6+'%) scale('+(1.02+.03*Math.sin(a))+')';
    };
  }
  var LA=lockup('#fLogoA',true,0);

  /* ---------- 7. icon grid: icons pop in one by one, hold, then drop out ---------- */
  var IC=[].slice.call(document.querySelectorAll('#fIco .ic')),ICP=10;
  /* centre every icon's drawn shape in its 30 x 30 cell; the outer shape stays an outline, shapes inside it are filled */
  var NS='http://www.w3.org/2000/svg';
  IC.forEach(function(g){
    var p=g.firstChild,b=p.getBBox(),s=.8333,w=document.createElementNS(NS,'g');
    w.setAttribute('transform','translate('+(15-s*(b.x+b.width/2))+' '+(15-s*(b.y+b.height/2))+') scale('+s+')');
    var els=p.getAttribute('d').split(/(?=M)/).map(function(d){var e=document.createElementNS(NS,'path');e.setAttribute('d',d);w.appendChild(e);return e});
    g.removeChild(p);g.appendChild(w);
    var bb=els.map(function(e){return e.getBBox()});
    els.forEach(function(e,i){var o=bb[i];
      var inner=bb.some(function(q,j){return j!==i&&o.x>=q.x-.01&&o.y>=q.y-.01&&o.x+o.width<=q.x+q.width+.01&&o.y+o.height<=q.y+q.height+.01&&q.width*q.height>o.width*o.height});
      if(inner){e.setAttribute('fill','#0e1f4c');e.setAttribute('stroke','none')}});
  });
  function icons(t){
    t=((t%ICP)+ICP)%ICP;
    IC.forEach(function(el,i){
      var a=oq(seg(t,.2+i*.12,.8+i*.12))*(1-oq(seg(t,8.3+i*.06,8.9+i*.06)));
      el.style.transform='scale('+(.4+.6*a)+')';el.style.opacity=a;
    });
  }

  /* ---------- 8. step lines: the top rule draws across, then each line rises to its step, one after another ---------- */
  var SH=$('#slh'),SL=[].slice.call(document.querySelectorAll('#fStep .sl')),SP=10;
  function steps(t){
    t=((t%SP)+SP)%SP;
    var out=io(seg(t,8.4,9.4));
    SH.setAttribute('x2',100*oq(seg(t,.1,1.3))*(1-out));
    SL.forEach(function(el,i){
      var top=+el.dataset.top,u=oq(seg(t,.6+i*.2,1.9+i*.2))*(1-out);
      el.setAttribute('y1',100-(100-top)*u);
    });
  }

  /* ---------- clock ---------- */
  var T=FROM,last=performance.now(),playing=!reduce;
  function draw(){hero(T);sched(T);ex(T);LA(T);icons(T);steps(T)}
  function frame(now){var dt=(now-last)/1000;last=now;if(playing&&!document.hidden)T+=Math.min(dt,.1);draw();requestAnimationFrame(frame)}
  if(reduce){T=4.2;draw()}                       /* still frame: everything on show */
  if(reduce){hero(4.2);sched(8);ex(3.2);LA(4);icons(4.5);steps(5)}
  else{draw();requestAnimationFrame(function(n){last=n;frame(n)})}
  window.__bv={play:function(){playing=true},pause:function(){playing=false},seek:function(t){T=t;draw()},get t(){return T}};
})();
</script>
