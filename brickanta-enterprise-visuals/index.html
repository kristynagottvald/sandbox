<title>Brickanta Enterprise Visuals</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 fill=%22%23e8584f%22/%3E%3Cpath fill=%22%230e1f4c%22 d=%22M14 14H38L50 26V50H26L14 38Z%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--plum:#3c222e;--blue:#739cd0;--coral:#e8584f;--coral2:#ee6a64;--navy:#0e1f4c;--ice:#d4e0ee;--paper:#f7f4f0;
  --sans:"IBM Plex Sans","Helvetica Neue",Helvetica,Arial,sans-serif;--display:"Tektur","IBM Plex Sans","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{background:#000;color:#f2f2f2}
body{min-height:100vh;display:flex;flex-direction:column;font:400 16px/1.4 var(--sans);-webkit-font-smoothing:antialiased}
nav.back{box-sizing:border-box;display:flex;align-items:center;gap:8px;height:49px;padding:0 20px;background:#000;border-bottom:1px solid #1c1c1c;font:400 13px/1.35 var(--sans);white-space:nowrap;overflow:hidden}
nav.back a{color:#8d8d8d;text-decoration:none}
nav.back a:hover,nav.back a:focus-visible{color:#fff;text-decoration:underline;text-underline-offset:3px}
nav.back span{color:#6e6e6e}
nav.back b{font-weight:500;color:#fff;overflow:hidden;text-overflow:ellipsis}
@media(max-width:640px){nav.back{padding:0 16px}nav.back .x{display:none}}
main{flex:1;display:flex;align-items:center;width:100%;max-width:1760px;margin:0 auto;padding:clamp(20px,3vw,40px) clamp(16px,2.4vw,34px) 60px}
.grid{width:100%;max-width:min(760px,calc(100vh - 49px - 150px));min-width:min(100%,360px);margin:0 auto}
figure{display:block;min-width:0}
.stage{position:relative;aspect-ratio:1/1;overflow:hidden;container-type:inline-size;isolation:isolate}
figcaption{margin-top:14px;padding:18px 22px;background:var(--paper);color:var(--plum);font:700 clamp(12px,1.15vw,16px)/1.2 var(--sans);letter-spacing:.2em;text-transform:uppercase}
/* recorded clip: the square fills the stage, no caption */
.clip main{padding:0;justify-content:center}.clip .grid{width:calc(100vh - 49px);max-width:none}.clip figcaption{display:none}

/* 3 footer shards */
.s-foot{background:var(--coral);color:var(--navy)}
.s-foot .eb{position:absolute;left:8%;top:8%;display:flex;gap:1.4cqw;align-items:center;font:600 2cqw var(--display);letter-spacing:.14em;text-transform:uppercase}
.s-foot .eb svg{width:3cqw;height:3cqw}
.s-foot h2{position:absolute;left:8%;top:15%;font:400 8.6cqw/1.02 var(--display);letter-spacing:-.025em;color:#fff}
.s-foot p{position:absolute;left:8%;top:41%;width:44%;font-size:2.7cqw;line-height:1.4}
.btn{position:absolute;left:8%;top:60%;display:inline-flex;font:500 2.7cqw var(--sans);padding:1.9cqw 3.2cqw 1.9cqw 2.8cqw;background:#fff;color:var(--plum);clip-path:polygon(0 0,100% 0,100% calc(100% - 1.4cqw),calc(100% - 1.4cqw) 100%,0 100%)}
.mk{position:absolute;right:-9%;bottom:-17%;width:82%;aspect-ratio:1;overflow:hidden;z-index:-1}
</style>
</head>

<div class="grid">

  <figure>

      <h2>See Brickanta<br>in action</h2>
      <p>Get a closer look at the platform built for construction teams.</p>
      <span class="btn">Request demo</span>
      <svg class="mk" id="morph" viewBox="0 0 6 6" aria-hidden="true"><defs><clipPath id="mkc"><polygon id="mA"/><polygon id="mB"/><polygon id="mC"/><polygon id="mD"/></clipPath></defs><g clip-path="url(#mkc)"><use href="#ill3" width="6" height="6"/></g></svg>
    </div>
    <figcaption>Footer visual</figcaption>
  </figure>

</div>

<script>
(function(){
  var $=function(s,r){return (r||document).querySelector(s)};
  var cl=function(v,a,b){return Math.max(a,Math.min(b,v))};
  var oq=function(u){u=cl(u,0,1);return 1-Math.pow(1-u,4)};                     /* ease out, the page's own curve */
  var io=function(u){u=cl(u,0,1);return u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2};   /* ease in out */
  var lerp=function(a,b,t){return a+(b-a)*t};
  var seg=function(t,a,b){return cl((t-a)/(b-a),0,1)};
  var CLIP=/clip/.test(location.hash);
  var FROM=(/from=([\d.]+)/.exec(location.hash)||[0,0])[1]*1;
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(CLIP)document.documentElement.classList.add('clip');

  /* ---------- 3. footer shards: two bars and two shards on a 6 x 6 grid, a new combination every 2.4s ---------- */
  var M=(function(){
    var T=1.7;
    var base=function(w,d){return [[0,0],[w,0],[w+d,d],[w+d,d+T],[w,T],[0,T]]};
    function shape(x,y,w,d,r,m){
      var bw=w+d,bh=d+T,pts=base(w,d);
      if(m){pts=pts.map(function(q){return [bw-q[0],q[1]]}).reverse()}
      for(var k=0;k<r;k++){var Hh=(k%2?bw:bh);pts=pts.map(function(q){return [Hh-q[1],q[0]]});var tt=bw;bw=bh;bh=tt}
      return pts.map(function(q){return [q[0]+x,q[1]+y]});
    }
    var pad=function(pts){pts=pts.slice();while(pts.length<6)pts.push(pts[pts.length-1]);return pts};
    var BARS=[[[0,0,3,2,0,0],[1,3,3,2,0,0]],[[1,0,3,2,0,1],[0,3,3,2,0,1]],[[0,0,3,2,1,0],[3,1,3,2,1,0]],[[3,0,3,2,1,1],[0,1,3,2,1,1]],[[1,0,3,2,2,0],[0,3,3,2,2,0]],[[0,1,3,2,3,0],[3,0,3,2,3,0]],[[0,0,4,2,0,0],[0,3,4,2,0,1]],[[0,1,4,1,0,0],[1,4,4,1,0,0]]];
    var SHARDS=[[[[5,0],[6,0],[6,1]],[[0,3],[1,4],[1,6],[0,5]]],[[[0,0],[1,0],[0,1]],[[6,3],[6,5],[5,6],[5,4]]],[[[3,0],[4,0],[3,1]],[[0,5],[1,5],[0,6]]],[[[5,0],[6,0],[6,1]],[[3,5],[5,5],[6,6],[4,6]]],[[[0,0],[1,0],[0,1]],[[5,3],[6,4],[6,6],[5,5]]],[[[0,0],[2,0],[3,1],[1,1]],[[5,6],[6,6],[6,5]]],[[[0,0],[1,0],[0,1]],[[6,5],[6,6],[5,6]]],[[[5,0],[6,0],[6,1]],[[0,3],[1,3],[0,4]]]];
    var COMBOS=BARS.map(function(c,i){return c.map(function(a){return shape.apply(null,a)}).concat(SHARDS[i].map(pad))});
    var P=['#mA','#mB','#mC','#mD'].map(function(s){return $(s)});
    var put=function(el,pts){el.setAttribute('points',pts.map(function(q){return q[0].toFixed(3)+','+q[1].toFixed(3)}).join(' '))};
    var SLOT=2.4,HOLD=.9,TW=1.5;
    return {P:COMBOS.length*SLOT,draw:function(t){
      t=((t%(COMBOS.length*SLOT))+COMBOS.length*SLOT)%(COMBOS.length*SLOT);
      var i=Math.floor(t/SLOT),u=io(seg(t-i*SLOT,HOLD,HOLD+TW)),a=COMBOS[i],b=COMBOS[(i+1)%COMBOS.length];
      P.forEach(function(el,s){put(el,a[s].map(function(q,k){return [lerp(q[0],b[s][k][0],u),lerp(q[1],b[s][k][1],u)]}))});
    }};
  })();

  /* ---------- clock ---------- */
  var T=FROM,last=performance.now(),playing=!reduce;
  function draw(){M.draw(T)}
  function frame(now){var dt=(now-last)/1000;last=now;if(playing&&!document.hidden)T+=Math.min(dt,.1);draw();requestAnimationFrame(frame)}
  if(reduce){T=0;draw()}                         /* still frame */
  else{draw();requestAnimationFrame(function(n){last=n;frame(n)})}
  window.__bv={play:function(){playing=true},pause:function(){playing=false},seek:function(t){T=t;draw()},get t(){return T}};
})();
</script>
