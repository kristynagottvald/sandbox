<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lob 12 Days Stamps</title>
<meta name="description" content="A 1:1 social motion post for the 12 Days of Lob: twelve real US Christmas stamps from 1962 to 2021, one a day, each flying onto the page with a 12 Days of Lob label.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
:root{--sans:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;--navy:#1F2149;--pink:#F8E0F9;--mag:#B042C2;--btn:#4534F2}
*{box-sizing:border-box;margin:0}
html{background:#000}
body{min-height:100dvh;display:flex;flex-direction:column;background:var(--navy);color:#fff;font:400 14px/1.4 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit}
nav.back{flex:none;display:flex;align-items:center;gap:8px;height:49px;padding:0 20px;background:#000;border-bottom:1px solid #1c1c1c;font:400 13px/1.35 var(--sans);white-space:nowrap;overflow:hidden}
nav.back a{color:#8d8d8d;text-decoration:none}nav.back a:hover,nav.back a:focus-visible{color:#fff;text-decoration:underline;text-underline-offset:3px}
nav.back span{color:#6e6e6e}nav.back b{font-weight:500;color:#fff;overflow:hidden;text-overflow:ellipsis}
@media(max-width:640px){nav.back{padding:0 16px}nav.back .x{display:none}}
.wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:12px}
canvas{display:block;aspect-ratio:1/1;width:min(100%,calc(100dvh - 49px - 120px));max-width:100%;height:auto;background:#6BAE86}
.ctl{flex:none;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;padding:10px 16px 16px}
.days{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.days button,.ctl .b{min-width:34px;height:34px;padding:0 12px;border-radius:99px;border:1px solid rgba(255,255,255,.25);background:none;cursor:pointer;font-weight:600}
.days button.on{background:var(--pink);color:var(--navy);border-color:var(--pink)}
.ctl .b.hot{background:var(--btn);border-color:var(--btn)}
.ctl input{height:34px;width:230px;max-width:100%;padding:0 14px;border-radius:99px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08)}
button:focus-visible,input:focus-visible{outline:2px solid #EAF265;outline-offset:2px}
.clip .ctl{display:none}
.clip .wrap{padding:0}
.clip canvas{width:min(100vw,calc(100dvh - 49px))}
</style>
</head>

</div>

const imgs=STAMPS.map(s=>{const im=new Image();im.src=s.d;return im});
const LOGO_P=["M113.886 29.4011C113.886 41.5261 104.676 49.2099 94.954 49.2099C89.6912 49.2099 85.0859 46.9541 82.4545 43.1474L80.7204 48.4345H72.5136L72.5119 0.000103459L82.8962 0V15.0943C85.5586 11.7125 89.7868 9.59227 94.881 9.59227C104.822 9.59227 113.886 17.2761 113.886 29.4011ZM81.9429 29.3306C81.9429 35.2521 86.6942 40.0457 92.9074 40.0457C98.9743 40.0457 103.799 35.3226 103.799 29.3306C103.799 23.3386 98.9743 18.6155 92.9074 18.6155C86.6942 18.6155 81.9429 23.4091 81.9429 29.3306Z", "M0.0016883 48.4347L22.5808 48.4345L25.7235 38.7768L10.3813 38.777L10.3796 0.000103459H0L0.0016883 48.4347Z", "M47.5044 49.2099C59.419 49.2099 68.4098 40.3276 68.4098 29.4011C68.4098 18.404 59.2729 9.59227 47.5044 9.59227C35.6629 9.59227 26.6723 18.404 26.6723 29.4011C26.6723 40.3276 35.6629 49.2099 47.5044 49.2099ZM47.5777 39.9752C41.5106 39.9752 36.7595 35.2521 36.7595 29.3306C36.7595 23.4091 41.5106 18.686 47.5777 18.686C53.5713 18.686 58.3956 23.4091 58.3956 29.3306C58.3956 35.2521 53.5713 39.9752 47.5777 39.9752Z"].map(d=>new Path2D(d));
function logo(px,py,w,col){x.save();x.translate(px,py);const k=w/114;x.scale(k,k);x.fillStyle=col;LOGO_P.forEach(q=>x.fill(q));x.restore()}
function mixc(a,b,k){const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)),A=p(a),B=p(b);return'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*k)).join(',')+')'}
function stampPath(w,h,n,m){const pw=w/n,ph=h/m;
  const edge=(x0,y0,x1,y1,nx,ny,cnt)=>{for(let i=0;i<cnt;i++){const ax=x0+(x1-x0)*i/cnt,ay=y0+(y1-y0)*i/cnt,bx=x0+(x1-x0)*(i+1)/cnt,by=y0+(y1-y0)*(i+1)/cnt,cx=(ax+bx)/2,cy=(ay+by)/2,rr=Math.hypot(bx-ax,by-ay)/2*.72;
    const ta=Math.atan2(ay-cy,ax-cx),tb=Math.atan2(by-cy,bx-cx),tn=Math.atan2(ny,nx);const cw=((tn-ta+Math.PI*2)%(Math.PI*2))<Math.PI;x.lineTo(ax,ay);x.lineTo(cx+Math.cos(ta)*rr,cy+Math.sin(ta)*rr);x.arc(cx,cy,rr,ta,tb,!cw);x.lineTo(bx,by)}};
  const L=-w/2,R=w/2,T0=-h/2,B=h/2;x.beginPath();x.moveTo(L,T0);x.lineTo(L+pw,T0);edge(L+pw,T0,R-pw,T0,0,1,n-2);x.lineTo(R,T0);x.lineTo(R,T0+ph);edge(R,T0+ph,R,B-ph,-1,0,m-2);x.lineTo(R,B);x.lineTo(R-pw,B);edge(R-pw,B,L+pw,B,0,-1,n-2);x.lineTo(L,B);x.lineTo(L,B-ph);edge(L,B-ph,L,T0+ph,1,0,m-2);x.closePath()}

let label='12 days of Lob';
function draw(){
  x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,S,S);
  x.fillStyle=mixc(BGS[(day+3)%4],BGS[day%4],eio(cl(lt/.5)));x.fillRect(0,0,S,S);
  const ex=1-eio(cl((lt-(D-.7))/.5)),xo=1-ex;
  logo(64,66,128,'#fff');
  x.save();x.font='700 22px "Inter",Arial,sans-serif';x.letterSpacing='7px';x.textAlign='right';x.fillStyle='#fff';x.fillText('DAY '+(day+1),S-64+7,100);x.restore();
  /* the historic stamp flies in from the right, spins, thumps down and floats; it leaves to the left */
  const im=imgs[day],sp=STAMPS[day];
  if(im.complete&&im.naturalWidth){
    const k=Math.min(660/sp.w,660/sp.h,1.55),p=cl((lt-.2)/.85),e=eob(p),ox=(1-e)*900-xo*1100,rot=(1-e)*.9-xo*.5+sn(1.4)*.02,bob=sn(1.6)*7;
    const thump=lt>.95&&lt<1.25?1+.04*Math.sin((lt-.95)/.3*Math.PI):1;
    x.save();x.translate(540+ox,572+bob);x.rotate(rot);
    x.save();x.scale(k*thump,k*thump);x.shadowColor='rgba(31,33,73,.4)';x.shadowBlur=34;x.shadowOffsetY=18;x.drawImage(im,-sp.w/2,-sp.h/2,sp.w,sp.h);x.restore();
    /* text on the stamp: a label straddling its bottom edge */
    const lp=Math.max(.0001,eob(cl((lt-.95)/.45)))*ex;
    x.save();x.translate(0,sp.h*k*thump/2);x.scale(lp,lp);
    x.font='700 27px "Inter",Arial,sans-serif';x.letterSpacing='8px';const str=label.toUpperCase(),tw=x.measureText(str).width-8,pw=tw+64,ph=62;
    x.shadowColor='rgba(31,33,73,.3)';x.shadowBlur=14;x.shadowOffsetY=6;x.beginPath();x.roundRect(-pw/2,-ph/2,pw,ph,ph/2);x.fillStyle=NAVY;x.fill();x.shadowColor='transparent';
    x.fillStyle='#fff';x.textAlign='left';x.textBaseline='middle';x.fillText(str,-tw/2,2);x.restore();
    x.restore()}
}

/* ---------- loop ---------- */
let last=performance.now();
function tick(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;T+=dt;
  if(playing){lt+=dt*speed;while(lt>=D){lt-=D;day=(day+1)%12;sync()}}
  draw();requestAnimationFrame(tick)}
/* ---------- UI ---------- */
const dEl=document.getElementById('days'),lab=document.getElementById('lab');
for(let i=0;i<12;i++){const b=document.createElement('button');b.textContent=i+1;b.setAttribute('aria-label','Day '+(i+1));b.onclick=()=>go(i);dEl.appendChild(b)}
function sync(){[...dEl.children].forEach((b,i)=>b.classList.toggle('on',i===day));if(document.activeElement!==lab)lab.value=label}
function go(i){day=((i%12)+12)%12;lt=0;sync()}
lab.oninput=()=>{label=lab.value};
const pp=document.getElementById('pp');pp.onclick=()=>{playing=!playing;pp.textContent=playing?'Pause':'Play'};
document.getElementById('png').onclick=()=>{draw();const a=document.createElement('a');a.download='lob-12-days-stamps-day-'+(day+1)+'.png';a.href=cv.toDataURL('image/png');a.click()};
document.getElementById('rec').onclick=function(){
  if(!window.MediaRecorder){alert('Recording is not supported in this browser.');return}
  const b=this;b.disabled=true;b.textContent='Recording…';go(day);playing=true;const keep=speed;speed=1;
  const st=cv.captureStream(30),mr=new MediaRecorder(st,{mimeType:MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm',videoBitsPerSecond:12e6}),ch=[];
  mr.ondataavailable=e=>e.data.size&&ch.push(e.data);
  mr.onstop=()=>{const a=document.createElement('a');a.download='lob-12-days-stamps-day-'+(day+1)+'.webm';a.href=URL.createObjectURL(new Blob(ch,{type:'video/webm'}));a.click();speed=keep;b.disabled=false;b.textContent='Record day (WebM)'};
  mr.start();setTimeout(()=>mr.stop(),D*1000-60)};
addEventListener('keydown',e=>{if(e.target===lab)return;if(e.key==='ArrowRight')go(day+1);if(e.key==='ArrowLeft')go(day-1);if(e.key===' '){e.preventDefault();pp.click()}});
window.__ad={go,play(){playing=true},pause(){playing=false},seek(d,t){day=d;lt=t;playing=false;sync()},D};
sync();requestAnimationFrame(tick);
})();
