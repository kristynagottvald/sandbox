<script>
const TAU = Math.PI * 2, PERIOD = 6, STEPS = 18; // bands re-aim 3 times a second; the camera whips twice per 6 s loop
const PURPLE = '#7A4BFF', RED = '#F2442E', BLACK = '#0B0B0B', WHITE = '#FFFFFF';
const cl = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, m) => a + (b - a) * m;
const easeOut = (u) => 1 - Math.pow(1 - cl(u, 0, 1), 4);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const HP = new URLSearchParams(location.hash.slice(1));
const hash = (a, b) => { const s = Math.sin(a * 127.1 + b * 311.7 + 17.3) * 43758.5453; return s - Math.floor(s); };

const EYE = {"c": [647.8, 691.9], "rx": 38.2, "ry": 97.8, "rot": 90.0}, PUPIL = {"c": [672.6, 707.5], "rx": 14.9, "ry": 24.2, "rot": 89.8};
const STEMS = [[190.0, 610.5, 187.5, 611.3, 180.8, 613.0, 169.9, 615.5, 162.3, 617.2, 161.5, 617.2, 159.8, 616.3, 148.0, 607.1, 96.8, 565.1, 71.6, 544.1, 72.4, 543.3, 93.4, 550.0, 133.8, 564.3, 178.3, 580.2, 182.5, 581.9, 184.2, 583.6, 185.0, 586.9, 190.0, 608.8], [232.0, 408.0, 229.5, 413.1, 225.3, 420.6, 217.8, 434.1, 214.4, 439.9, 213.6, 439.9, 179.1, 369.4, 166.5, 343.3, 162.3, 334.1, 162.3, 332.4, 168.2, 337.5, 232.0, 405.5], [307.6, 341.7, 305.1, 346.7, 304.3, 347.5, 299.2, 345.0, 283.3, 335.8, 279.1, 333.3, 276.6, 324.9, 272.4, 306.4, 260.6, 254.3, 260.6, 249.3, 262.3, 250.9, 264.0, 253.5, 290.0, 304.7, 306.0, 336.6, 307.6, 340.8], [521.8, 369.4, 520.2, 370.2, 473.1, 376.9, 468.1, 376.9, 468.1, 370.2, 489.1, 249.3, 498.3, 196.3, 500.8, 182.1, 502.5, 174.5, 504.2, 187.9, 506.7, 211.5, 521.0, 355.9], [633.6, 191.3, 632.7, 201.4, 614.2, 357.6, 613.4, 359.3, 612.6, 360.1, 572.2, 363.5, 563.0, 363.5, 563.0, 362.7, 563.8, 359.3, 629.4, 193.0, 633.6, 183.7], [742.8, 250.1, 740.2, 259.3, 735.2, 273.6, 716.7, 325.7, 712.5, 337.5, 711.7, 337.5, 710.0, 336.6, 705.0, 332.4, 694.0, 323.2, 692.4, 321.5, 692.4, 320.7, 694.9, 316.5, 731.8, 261.0, 740.2, 249.3, 741.9, 247.6, 742.8, 247.6], [894.0, 420.6, 887.2, 429.0, 803.2, 520.6, 798.2, 525.6, 797.4, 523.9, 792.3, 509.7, 786.4, 492.0, 786.4, 491.2, 788.1, 489.5, 878.8, 429.0, 893.1, 419.8, 894.0, 419.8]];
const TIPS = [
  [71.6, 544.1, 127.9, 590.3, 130.4, 589.5, 140.5, 570.1, 142.2, 569.3, 141.3, 567.6, 134.6, 565.9, 133.8, 564.3, 101.0, 554.2, 100.2, 552.5, 93.4, 550.0, 89.2, 550.0, 85.0, 547.5, 74.1, 544.9, 72.4, 543.3],
  [162.3, 332.4, 179.1, 369.4, 191.7, 392.9, 193.4, 365.2],
  [260.6, 249.3, 264.8, 271.1, 266.5, 275.3, 272.4, 273.6, 272.4, 271.1],
  [502.5, 174.5, 484.9, 280.3, 514.3, 292.1],
  [633.6, 183.7, 619.3, 222.4, 617.6, 223.2, 612.6, 240.0, 608.4, 247.6, 608.4, 252.6, 626.0, 253.5, 631.0, 204.7, 632.7, 201.4],
  [742.8, 247.6, 731.8, 261.0, 718.4, 285.4, 730.2, 285.4, 740.2, 259.3],
  [894.0, 419.8, 862.9, 439.9, 865.4, 450.9, 887.2, 429.0],
];

const flat = (ctx, a) => { ctx.moveTo(a[0], a[1]); for (let i = 2; i < a.length; i += 2) ctx.lineTo(a[i], a[i + 1]); ctx.closePath(); };
function drawPorcupine(ctx, W, H, t) {
  const sc = Math.min(W / 940, H / 700) * 1.02, ph = TAU * t / PERIOD, bob = 4 * Math.sin(ph * 2);
  ctx.save(); ctx.translate(W / 2 - 500 * sc, H / 2 - 508 * sc + bob * sc); ctx.scale(sc, sc);
  ctx.fillStyle = BLACK;
  ctx.beginPath(); flat(ctx, BODY); ctx.fill();
  STEMS.forEach((q) => { ctx.beginPath(); flat(ctx, q); ctx.fill(); });
  TIPS.forEach((q) => { ctx.beginPath(); flat(ctx, q); ctx.fill(); });
  const blink = (t % 3) > 2.2 && (t % 3) < 2.36 ? 0.12 : 1;
  ctx.fillStyle = WHITE; ctx.beginPath(); ctx.ellipse(EYE.c[0], EYE.c[1], EYE.rx, EYE.ry * blink, EYE.rot * Math.PI / 180, 0, TAU); ctx.fill();
  ctx.fillStyle = BLACK; ctx.beginPath(); ctx.ellipse(PUPIL.c[0] + 8 * Math.sin(ph), PUPIL.c[1], PUPIL.rx, PUPIL.ry * blink, PUPIL.rot * Math.PI / 180, 0, TAU); ctx.fill();
  ctx.restore();
}

/* ===== the glitch: thick perforated bands that sweep across the screen in different directions, each re-aiming on its own beat ===== */
// [colour, base angle (deg), thickness (share of the short side), beat offset]
const BANDS = [
  [PURPLE, -4, 0.26, 0.00], [RED, -30, 0.16, 0.21], [PURPLE, 14, 0.22, 0.47], [RED, 52, 0.13, 0.13],
  [PURPLE, -22, 0.20, 0.74], [RED, -8, 0.12, 0.38], [PURPLE, 32, 0.18, 0.60], [RED, 70, 0.11, 0.90],
];
function bandState(i, t, W, H) {
  const [, ang, thick, off] = BANDS[i], u = t / PERIOD * STEPS + off * 3, k = Math.floor(u), f = u - k, m = easeOut(f / 0.4);
  const at = (n) => { n = ((n % STEPS) + STEPS) % STEPS; const a = (ang + (hash(i + 41, n) - 0.5) * 50) * Math.PI / 180, ext = Math.abs(W * Math.sin(a)) + Math.abs(H * Math.cos(a));
    return { a, d: (hash(i + 1, n) - 0.5) * ext * 1.25, al: (hash(i + 21, n) - 0.5) * W * 0.6, th: thick * (0.7 + 0.7 * hash(i + 61, n)) }; };
  const A = at(k - 1), B = at(k), a = lerp(A.a, B.a, m), d = lerp(A.d, B.d, m), al = lerp(A.al, B.al, m) + (f - 0.5) * W * 0.3;
  return { x: W / 2 - Math.sin(a) * d + Math.cos(a) * al, y: H / 2 + Math.cos(a) * d + Math.sin(a) * al, a, th: lerp(A.th, B.th, m) };
}
/* one strip, both long edges perforated: half-round bites into the band, marching along it */
function bandPath(ctx, L, th, pitch, r, shift) {
  const n = Math.ceil(L / pitch) + 2, x0 = -L / 2 - pitch + (shift % pitch);
  ctx.beginPath(); ctx.moveTo(x0, -th / 2);
  for (let j = 0; j < n; j++) { const cx = x0 + (j + 0.5) * pitch; ctx.lineTo(cx - r, -th / 2); ctx.arc(cx, -th / 2, r, Math.PI, 0, true); }
  ctx.lineTo(x0 + n * pitch, th / 2);
  for (let j = n - 1; j >= 0; j--) { const cx = x0 + (j + 0.5) * pitch + pitch * 0.5; ctx.lineTo(cx + r, th / 2); ctx.arc(cx, th / 2, r, 0, Math.PI, true); }
  ctx.closePath();
}
function paintBands(ctx, W, H, t, gain) {
  const S = Math.min(W, H), D = Math.hypot(W, H), pitch = Math.max(16, S * 0.026), r = pitch * 0.36;
  for (let i = 0; i < BANDS.length; i++) {
    const s = bandState(i, t, W, H);
    ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.a); ctx.fillStyle = BANDS[i][0];
    bandPath(ctx, D * 2.6, s.th * S * gain, pitch, r, t * pitch * 24 * (i % 2 ? -1 : 1)); ctx.fill();
    ctx.restore();
  }
}

/* ===== the camera: wide, whip in on a section, hold a beat, whip out, repeat on the other section (3 s cycle, two per loop) ===== */
const CYC = 3, ZMAX = 2.6, eio = (u) => { u = cl(u, 0, 1); return u < 0.5 ? 16 * u ** 5 : 1 - Math.pow(-2 * u + 2, 5) / 2; };
const FOCI = [[647.8, 691.9], [434, 330]]; // the eye, then a fan of quills (porcupine coordinates)
function cam(t) {
  t = ((t % PERIOD) + PERIOD) % PERIOD; const c = Math.floor(t / CYC), u = t % CYC; let p = 0, whip = false;
  if (u >= 1.1 && u < 1.35) { p = eio((u - 1.1) / 0.25); whip = true; } else if (u >= 1.35 && u < 2.45) p = 1; else if (u >= 2.45 && u < 2.7) { p = 1 - eio((u - 2.45) / 0.25); whip = true; }
  const o = easeOut((u - 1.4) / 0.15) * (1 - cl((u - 2.4) / 0.07, 0, 1)); // the perforated window that keeps the porcupine clear during the hold
  return { c, p, o, whip };
}
function pSpace(W, H) { const sc = Math.min(W / 940, H / 700) * 1.02; return (q) => [W / 2 + (q[0] - 500) * sc, H / 2 + (q[1] - 508) * sc]; }
function camXf(ctx, W, H, t) {
  const { c, p } = cam(t), f = pSpace(W, H)(FOCI[c]), z = Math.pow(ZMAX, p);
  ctx.translate(lerp(f[0], W / 2, p), lerp(f[1], H / 2, p)); ctx.scale(z, z); ctx.translate(-f[0], -f[1]); return f;
}
function scene(ctx, W, H, t, gain) {
  const S = Math.min(W, H), { o } = cam(t);
  ctx.save(); ctx.fillStyle = WHITE; ctx.fillRect(0, 0, W, H);
  const f = camXf(ctx, W, H, t);
  drawPorcupine(ctx, W, H, t); paintBands(ctx, W, H, t, gain);
  if (o > 0.01) { // porcupine seen through a perforated stamp-shaped window, bands all round it
    const pitch = Math.max(16, S * 0.026);
    ctx.save(); ctx.translate(f[0], f[1]); ctx.rotate(-0.09); bandPath(ctx, S * 0.4 * o, S * 0.27 * o, pitch, pitch * 0.36, 0); ctx.rotate(0.09); ctx.translate(-f[0], -f[1]);
    ctx.clip(); ctx.fillStyle = WHITE; ctx.fillRect(0, 0, W, H); drawPorcupine(ctx, W, H, t); ctx.restore();
  }
  ctx.restore();
}

/* band thickness is scaled every frame so the bands always fill TARGET of the screen (solved on a tiny offscreen render, camera included) */
const TARGET = 0.55, probe = document.createElement('canvas'), pc = probe.getContext('2d', { willReadFrequently: true });
function solveGain(t, W, H) {
  const pw = 72, ph = Math.max(24, Math.round(pw * H / W)); probe.width = pw; probe.height = ph;
  const k = pw / W, cover = (g) => {
    pc.setTransform(1, 0, 0, 1, 0, 0); pc.clearRect(0, 0, pw, ph); pc.setTransform(k, 0, 0, k, 0, 0); pc.save(); camXf(pc, W, H, t); paintBands(pc, W, H, t, g); pc.restore();
    const d = pc.getImageData(0, 0, pw, ph).data; let n = 0; for (let i = 3; i < d.length; i += 4) if (d[i] > 127) n++; return n / (pw * ph);
  };
  let lo = 0.2, hi = 3; for (let j = 0; j < 7; j++) { const g = (lo + hi) / 2; if (cover(g) < TARGET) lo = g; else hi = g; } return (lo + hi) / 2;
}

/* ===== loop ===== */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, dpr = 1;
function fit() { const r = cv.getBoundingClientRect(); W = r.width; H = r.height; dpr = Math.min(devicePixelRatio || 1, 2); cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
function render(t) {
  if (!W) return;
  const gain = solveGain(t, W, H), n = cam(t).whip ? 8 : 1; // motion blur on the whips: average of 8 sub-frames
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  for (let j = 0; j < n; j++) { ctx.globalAlpha = 1 / (j + 1); scene(ctx, W, H, t - j * 0.005, gain); }
  ctx.globalAlpha = 1;
}
let clock = HP.has('from') ? +HP.get('from') : 0, last = performance.now(), playing = true;
function loop(now) {
  const dt = Math.max(0, Math.min(0.1, (now - last) / 1000)); last = now;
  if (playing && !reduce) clock += dt;
  render(reduce ? 0 : ((clock % PERIOD) + PERIOD) % PERIOD);
  requestAnimationFrame(loop);
}
/* share of the screen under a band, measured from a canvas read-back (purple or red pixels) */
function coverage() {
  const d = ctx.getImageData(0, 0, cv.width, cv.height).data; let n = 0, tot = 0;
  for (let i = 0; i < d.length; i += 16) { tot++; const r = d[i], g = d[i + 1], b = d[i + 2]; if ((b > 200 && g < 110) || (r > 220 && g < 110 && b < 90)) n++; }
  return n / tot;
}
window.__pg = { seek: (t) => { playing = false; clock = t; render(((t % PERIOD) + PERIOD) % PERIOD); }, play: () => { playing = true; }, pause: () => { playing = false; }, coverage };
addEventListener('resize', fit);
fit(); requestAnimationFrame(loop);
</script>
