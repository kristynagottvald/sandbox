<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A static Figma frame on the left becomes a live animated page on the right, with elements easing in one after another, a dotted flow arrow between them and a timeline playhead sweeping beneath">
  <title>Turn a Figma frame into an animated page</title>
  <style>
    .rwrap { animation: wrapOut 6s linear infinite; }
    .a-title, .a-card, .a-avatar, .a-text, .a-button, .a-chip {
      transform-box: fill-box;
      transform-origin: center;
    }
    .a-title { animation: slideIn 6s cubic-bezier(0.2, 0.8, 0.2, 1) infinite; }
    .a-card { animation: cardIn 6s cubic-bezier(0.2, 0.8, 0.2, 1) infinite; }
    .a-avatar { animation: popIn 6s cubic-bezier(0.34, 1.56, 0.64, 1) infinite; }
    .a-text { animation: textIn 6s cubic-bezier(0.2, 0.8, 0.2, 1) infinite; }
    .a-button { animation: btnIn 6s cubic-bezier(0.34, 1.3, 0.64, 1) infinite; }
    .a-chip { animation: chipIn 6s cubic-bezier(0.2, 0.8, 0.2, 1) infinite; }
    .prog {
      transform-box: fill-box;
      transform-origin: left center;
      animation: sweep 6s linear infinite;
    }
    .playhead { animation: playhead 6s linear infinite; }
    .flow { stroke-dasharray: 1 9; animation: flow 1s linear infinite; }

    @keyframes wrapOut {
      0%, 90% { opacity: 1; }
      97%, 100% { opacity: 0; }
    }
    @keyframes slideIn {
      0%, 4% { opacity: 0; transform: translateX(-40px); }
      18%, 100% { opacity: 1; transform: translateX(0); }
    }
    @keyframes cardIn {
      0%, 17% { opacity: 0; transform: translateY(18px) scale(0.92); }
      34%, 100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes popIn {
      0%, 33% { opacity: 0; transform: scale(0); }
      40% { opacity: 1; }
      46%, 100% { opacity: 1; transform: scale(1); }
    }
    @keyframes textIn {
      0%, 43% { opacity: 0; transform: translateX(14px); }
      55%, 100% { opacity: 1; transform: translateX(0); }
    }
    @keyframes btnIn {
      0%, 55% { opacity: 0; transform: scale(0.7); }
      67%, 100% { opacity: 1; transform: scale(1); }
    }
    @keyframes chipIn {
      0%, 65% { opacity: 0; transform: translateX(24px); }
      75%, 100% { opacity: 1; transform: translateX(0); }
    }
    @keyframes sweep {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }
    @keyframes playhead {
      from { transform: translateX(0); }
      to { transform: translateX(360px); }
    }
    @keyframes flow {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -10; }
    }
  </style>

  <defs>
    <radialGradient id="figBg" cx="50%" cy="30%" r="80%">
      <stop offset="0" stop-color="#1c2338"/>
      <stop offset="0.6" stop-color="#0c0f18"/>
      <stop offset="1" stop-color="#05060a"/>
    </radialGradient>
    <pattern id="figDots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2a3450"/>
    </pattern>
    <radialGradient id="figGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="figFrame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171d2c"/>
      <stop offset="1" stop-color="#0f131e"/>
    </linearGradient>
    <linearGradient id="figCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d5efc"/>
      <stop offset="0.6" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="figSun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0.7"/>
    </radialGradient>
    <linearGradient id="figAvatar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0abfc"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="figBtn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="figProg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="figFlow" x1="412" y1="0" x2="546" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <clipPath id="figCardClip">
      <rect x="16" y="64" width="200" height="150" rx="12"/>
    </clipPath>
  </defs>

  <rect width="960" height="540" fill="url(#figBg)"/>
  <rect width="960" height="540" fill="url(#figDots)" opacity="0.6"/>
  <ellipse cx="740" cy="265" rx="280" ry="210" fill="url(#figGlow)"/>

  <!-- Labels -->
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" letter-spacing="2" fill="#6b7689">
    <text x="40" y="88">FIGMA FRAME</text>
    <text x="560" y="88">MOTION</text>
  </g>

  <!-- Left: static Figma frame with selection handles -->
  <g transform="translate(40 100)">
    <rect width="360" height="330" rx="16" fill="url(#figFrame)" stroke="#2c3550" stroke-width="1.5"/>
    <rect x="16" y="16" width="328" height="32" rx="8" fill="#1f2638"/>
    <circle cx="30" cy="32" r="3.5" fill="#f87171"/>
    <circle cx="42" cy="32" r="3.5" fill="#facc15"/>
    <circle cx="54" cy="32" r="3.5" fill="#4ade80"/>
    <rect x="270" y="26" width="58" height="12" rx="6" fill="#3b4560"/>
    <g clip-path="url(#figCardClip)">
      <rect x="16" y="64" width="200" height="150" fill="url(#figCard)"/>
      <circle cx="170" cy="98" r="14" fill="url(#figSun)"/>
      <path d="M16 214 L86 140 L124 178 L152 150 L216 214 Z" fill="#0b1020" opacity="0.4"/>
    </g>
    <circle cx="280" cy="100" r="30" fill="url(#figAvatar)"/>
    <rect x="232" y="150" width="110" height="10" rx="5" fill="#475569"/>
    <rect x="232" y="170" width="80" height="8" rx="4" fill="#334155"/>
    <rect x="232" y="186" width="96" height="8" rx="4" fill="#334155"/>
    <rect x="16" y="240" width="150" height="42" rx="21" fill="url(#figBtn)"/>
    <rect x="52" y="256" width="78" height="10" rx="5" fill="#f5f3ff"/>
    <rect x="182" y="240" width="162" height="42" rx="14" fill="#1f2638" stroke="#334155" stroke-width="1.5"/>
    <circle cx="204" cy="261" r="8" fill="#34d399"/>
    <rect x="220" y="256" width="90" height="10" rx="5" fill="#475569"/>
    <!-- selection outline and handles -->
    <rect x="16" y="64" width="200" height="150" fill="none" stroke="#a78bfa" stroke-width="1.5"/>
    <g fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5">
      <rect x="12.5" y="60.5" width="7" height="7"/>
      <rect x="112.5" y="60.5" width="7" height="7"/>
      <rect x="212.5" y="60.5" width="7" height="7"/>
      <rect x="12.5" y="135.5" width="7" height="7"/>
      <rect x="212.5" y="135.5" width="7" height="7"/>
      <rect x="12.5" y="210.5" width="7" height="7"/>
      <rect x="112.5" y="210.5" width="7" height="7"/>
      <rect x="212.5" y="210.5" width="7" height="7"/>
    </g>
  </g>

  <!-- Dotted flow from left to right -->
  <path class="flow" d="M412 265 H546" fill="none" stroke="url(#figFlow)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M544 257 L556 265 L544 273 Z" fill="#c4b5fd"/>

  <!-- Right: the same layout, animated in sequence -->
  <g transform="translate(560 100)">
    <rect width="360" height="330" rx="16" fill="url(#figFrame)" stroke="#2c3550" stroke-width="1.5"/>
    <g class="rwrap">
      <g class="a-title">
        <rect x="16" y="16" width="328" height="32" rx="8" fill="#1f2638"/>
        <circle cx="30" cy="32" r="3.5" fill="#f87171"/>
        <circle cx="42" cy="32" r="3.5" fill="#facc15"/>
        <circle cx="54" cy="32" r="3.5" fill="#4ade80"/>
        <rect x="270" y="26" width="58" height="12" rx="6" fill="#3b4560"/>
      </g>
      <g class="a-card">
        <g clip-path="url(#figCardClip)">
          <rect x="16" y="64" width="200" height="150" fill="url(#figCard)"/>
          <circle cx="170" cy="98" r="14" fill="url(#figSun)"/>
          <path d="M16 214 L86 140 L124 178 L152 150 L216 214 Z" fill="#0b1020" opacity="0.4"/>
        </g>
      </g>
      <g class="a-avatar">
        <circle cx="280" cy="100" r="30" fill="url(#figAvatar)"/>
      </g>
      <g class="a-text">
        <rect x="232" y="150" width="110" height="10" rx="5" fill="#475569"/>
        <rect x="232" y="170" width="80" height="8" rx="4" fill="#334155"/>
        <rect x="232" y="186" width="96" height="8" rx="4" fill="#334155"/>
      </g>
      <g class="a-button">
        <rect x="16" y="240" width="150" height="42" rx="21" fill="url(#figBtn)"/>
        <rect x="52" y="256" width="78" height="10" rx="5" fill="#f5f3ff"/>
      </g>
      <g class="a-chip">
        <rect x="182" y="240" width="162" height="42" rx="14" fill="#1f2638" stroke="#334155" stroke-width="1.5"/>
        <circle cx="204" cy="261" r="8" fill="#34d399"/>
        <rect x="220" y="256" width="90" height="10" rx="5" fill="#475569"/>
      </g>
    </g>
  </g>

  <!-- Timeline beneath the live frame -->
  <rect x="560" y="468" width="360" height="6" rx="3" fill="#1f2638"/>
  <rect class="prog" x="560" y="468" width="360" height="6" rx="3" fill="url(#figProg)"/>
  <g fill="#475569">
    <path d="M574 466 L578 471 L574 476 L570 471 Z"/>
    <path d="M625 466 L629 471 L625 476 L621 471 Z"/>
    <path d="M682 466 L686 471 L682 476 L678 471 Z"/>
    <path d="M726 466 L730 471 L726 476 L722 471 Z"/>
    <path d="M762 466 L766 471 L762 476 L758 471 Z"/>
    <path d="M812 466 L816 471 L812 476 L808 471 Z"/>
  </g>
  <g class="playhead">
    <rect x="559" y="458" width="2" height="22" fill="#f0abfc"/>
    <circle cx="560" cy="458" r="4" fill="#f0abfc"/>
  </g>
</svg>
