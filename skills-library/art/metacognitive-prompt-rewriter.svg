 x="860" y="333.5" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#c2410c" text-anchor="end">added</text><text x="526" y="354" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2430">Check that plan against the goal. Is the tone</text><text x="526" y="372" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2430">right, is it short, is the call to action clear?</text></g></g><g opacity="0"><animate attributeName="opacity" dur="9.0s" repeatCount="indefinite" keyTimes="0;0.478;0.528;0.889;0.922;1" values="0;0;1;1;0;0" calcMode="spline" keySplines=".45 0 .2 1;.45 0 .2 1;.45 0 .2 1;.45 0 .2 1;.45 0 .2 1"/><g><animateTransform attributeName="transform" dur="9.0s" repeatCount="indefinite" keyTimes="0;0.478;0.533;0.922;0.923;1" values="0 8;0 8;0 0;0 0;0 8;0 8" calcMode="spline" keySplines=".45 0 .2 1;.45 0 .2 1;.45 0 .2 1;.45 0 .2 1;.45 0 .2 1" type="translate"/><rect x="512" y="390" width="368" height="68" rx="8" fill="#effcf4"/><rect x="512" y="390" width="3" height="68" fill="#15803d"/><circle cx="534" cy="407" r="8" fill="#15803d"/><text x="534" y="411" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="548" y="411.5" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#15803d">Update</text><text x="860" y="411.5" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#15803d" text-anchor="end">added</text><text x="526" y="432" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2430">If something doesn't fit, revise the plan first,</text><text x="526" y="450" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2430">then write the email and note what changed.</text></g></g><g><animateTransform attributeName="transform" dur="9.0s" repeatCount="indefinite" keyTimes="0;0.178;0.267;0.306;0.578;0.628;0.867;0.967;1" values="420 262;420 262;262 432;262 432;846 160;846 160;846 160;420 262;420 262" calcMode="spline" keySplines=".45 0 .2 1;.45 0 .2 1;.45 0 .2 1;.45 0 .2 1;.45 0 .2 1;.45 0 .2 1;.45 0 .2 1;.45 0 .2 1" type="translate"/><circle r="12" fill="#6d4cf0" opacity="0"><animate attributeName="opacity" dur="9.0s" repeatCount="indefinite" keyTimes="0;0.277;0.278;0.317;0.621;0.622;0.661;1" values="0;0;0.35;0;0;0.35;0;0" calcMode="spline" keySplines=".45 0 .2 1;.45 0 .2 1;.45 0 .2 1;.45 0 .2 1;.45 0 .2 1;.45 0 .2 1;.45 0 .2 1"/></circle><g><animateTransform attributeName="transform" dur="9.0s" repeatCount="indefinite" keyTimes="0;0.269;0.278;0.291;0.613;0.622;0.636;1" values="1;1;0.88;1;1;0.88;1;1" calcMode="spline" keySplines=".45 0 .2 1;.45 0 .2 1;.45 0 .2 1;.45 0 .2 1;.45 0 .2 1;.45 0 .2 1;.45 0 .2 1" type="scale"/><path d="M0 0 L0 19 L4.8 14.6 L8.2 22.2 L11.6 20.8 L8.3 13.4 L14.6 13.4 Z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></g></g><g opacity="0"><animate attributeName="opacity" dur="9.0s" repeatCount="indefinite" keyTimes="0;0.644;0.672;0.822;0.856;1" values="0;0;1;1;0;0" calcMode="spline" keySplines=".45 0 .2 1;.45 0 .2 1;.45 0 .2 1;.45 0 .2 1;.45 0 .2 1"/><g><animateTransform attributeName="transform" dur="9.0s" repeatCount="indefinite" keyTimes="0;0.644;0.678;0.856;0.857;1" values="0 -6;0 -6;0 0;0 0;0 -6;0 -6" calcMode="spline" keySplines=".45 0 .2 1;.45 0 .2 1;.45 0 .2 1;.45 0 .2 1;.45 0 .2 1" type="translate"/><rect x="383" y="86" width="194" height="28" rx="14" fill="#151726"/><circle cx="401" cy="100" r="7" fill="#22c55e"/><path d="M397.5 100 l2.4 2.4 l4.4 -4.6" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="414" y="104.5" font-family="Inter, Helvetica Neue, 