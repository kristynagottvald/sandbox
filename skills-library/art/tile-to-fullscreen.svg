<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14141a"/><stop offset="1" stop-color="#07070a"/></linearGradient>
<linearGradient id="blk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f6bff"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
</defs>
<rect width="960" height="540" fill="url(#bg)"/>
<g fill="#1d1d26" stroke="#2c2c38">
<rect x="60" y="60" width="400" height="210" rx="16"/>
<rect x="500" y="60" width="400" height="210" rx="16"/>
<rect x="60" y="300" width="400" height="180" rx="16"/>
<rect x="500" y="300" width="400" height="180" rx="16"/>
</g>
<g fill="#3a3a4a"><rect x="84" y="222" width="150" height="14" rx="7"/><rect x="524" y="222" width="130" height="14" rx="7"/><rect x="84" y="436" width="170" height="14" rx="7"/><rect x="524" y="436" width="120" height="14" rx="7"/></g>
<!-- only a plain colour block grows: tile rect -> full frame, then back -->
<rect fill="url(#blk)" x="60" y="60" width="400" height="210" rx="16">
<animate attributeName="x" dur="6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.13;.33;.70;.90;1" keySplines=".6 0 .2 1;0 0 1 1;0 0 1 1;.6 0 .2 1;0 0 1 1" values="60;60;0;0;60;60"/>
<animate attributeName="y" dur="6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.13;.33;.70;.90;1" keySplines=".6 0 .2 1;0 0 1 1;0 0 1 1;.6 0 .2 1;0 0 1 1" values="60;60;0;0;60;60"/>
<animate attributeName="width" dur="6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.13;.33;.70;.90;1" keySplines=".6 0 .2 1;0 0 1 1;0 0 1 1;.6 0 .2 1;0 0 1 1" values="400;400;960;960;400;400"/>
<animate attributeName="height" dur="6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.13;.33;.70;.90;1" keySplines=".6 0 .2 1;0 0 1 1;0 0 1 1;.6 0 .2 1;0 0 1 1" values="210;210;540;540;210;210"/>
<animate attributeName="rx" dur="6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.13;.33;.70;.90;1" keySplines=".6 0 .2 1;0 0 1 1;0 0 1 1;.6 0 .2 1;0 0 1 1" values="16;16;0;0;16;16"/>
</rect>
<!-- tile label, visible at rest -->
<g fill="#fff"><rect x="84" y="222" width="190" height="14" rx="7"><animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;.13;.17;.86;.92;1" values="1;1;0;0;1;1"/></rect></g>
<!-- the real panel's content fades up in a stagger -->
<g fill="#fff">
<g><animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;.35;.42;.62;.68;1" values="0;0;1;1;0;0"/><animateTransform attributeName="transform" type="translate" dur="6s" repeatCount="indefinite" keyTimes="0;.35;.42;.62;.68;1" values="0 24;0 24;0 0;0 0;0 0;0 24"/><rect x="100" y="120" width="320" height="34" rx="9"/></g>
<g><animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;.40;.47;.62;.68;1" values="0;0;.8;.8;0;0"/><animateTransform attributeName="transform" type="translate" dur="6s" repeatCount="indefinite" keyTimes="0;.40;.47;.62;.68;1" values="0 24;0 24;0 0;0 0;0 0;0 24"/><rect x="100" y="186" width="560" height="14" rx="7"/><rect x="100" y="214" width="480" height="14" rx="7"/></g>
<g><animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;.45;.52;.62;.68;1" values="0;0;.55;.55;0;0"/><animateTransform attributeName="transform" type="translate" dur="6s" repeatCount="indefinite" keyTimes="0;.45;.52;.62;.68;1" values="0 24;0 24;0 0;0 0;0 0;0 24"/><rect x="100" y="290" width="240" height="160" rx="14"/><rect x="360" y="290" width="240" height="160" rx="14"/><rect x="620" y="290" width="240" height="160" rx="14"/></g>
</g>
</svg>
