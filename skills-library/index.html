<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skills Library</title>
<style>
*{box-sizing:border-box;margin:0}
html{background:#fff}
body{background:#fff;color:#0d0d12;font:400 16px/1.4 "Inter","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
nav.back{box-sizing:border-box;display:flex;align-items:center;gap:8px;height:49px;padding:0 20px;background:#000;border-bottom:1px solid #1c1c1c;font:400 13px/1.35 "Inter","Helvetica Neue",Helvetica,Arial,sans-serif;white-space:nowrap;overflow:hidden}
nav.back a{color:#8d8d8d;text-decoration:none}
nav.back a:hover,nav.back a:focus-visible{color:#fff;text-decoration:underline;text-underline-offset:3px}
nav.back span{color:#6e6e6e}
nav.back b{font-weight:500;color:#fff;overflow:hidden;text-overflow:ellipsis}
@media (max-width:640px){nav.back{padding:0 16px}}

main{max-width:1440px;margin:0 auto;padding:28px 40px 72px}
h1{font-size:28px;font-weight:500;letter-spacing:-.01em}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:22px 0 28px}
.tab{appearance:none;border:0;background:transparent;color:#0d0d12;font:inherit;font-size:16px;padding:10px 16px;border-radius:10px;cursor:pointer}
.tab:hover{background:#eef2fb}
.tab[aria-pressed=true]{background:#2563eb;color:#fff}
.tab:focus-visible{outline:2px solid #2563eb;outline-offset:2px}

.grid{display:grid;grid-auto-rows:1fr;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:22px}
.card{display:flex;flex-direction:column;border-radius:14px;overflow:hidden;border:1px solid #e3e6ee;background:#fff}
.card[hidden]{display:none}
.thumb{aspect-ratio:16/9;overflow:hidden;background:#07070a}
.card img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .6s ease}
.card:hover img{transform:scale(1.03)}
.info{flex:1;display:flex;flex-direction:column;padding:18px 20px 20px}
.info h2{font-size:21px;font-weight:500;letter-spacing:-.01em;margin-bottom:6px}
.info p{font-size:14px;line-height:1.5;color:#4b4f5c;margin-bottom:16px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;line-clamp:4;overflow:hidden;min-height:6em}
.chips{margin-top:auto;display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:5px 12px 5px 9px;border-radius:999px;background:#eef1f7;color:#1c2030;font-size:14px}
.chip svg{width:15px;height:15px;flex:none;opacity:.9}
.empty{color:#8d8d8d;padding:40px 0}
@media (max-width:640px){main{padding:20px 16px 56px}.grid{grid-template-columns:1fr}.info p{font-size:13px}}
@media (prefers-reduced-motion:reduce){.card img{transition:none}.card:hover img{transform:none}}

a.card{color:inherit;text-decoration:none;cursor:pointer}
a.card:hover{border-color:#2563eb;box-shadow:0 8px 24px rgba(20,30,60,.08)}
a.card:focus-visible{outline:2px solid #2563eb;outline-offset:2px}
/* detail page (light) */
body.detail{background:#f7f9fd;color:#0d0d12}
body.detail html,html:has(body.detail){background:#f7f9fd}
#detail{position:relative;max-width:1440px;margin:0 auto;padding:40px 40px 96px 140px}
.back2{position:absolute;left:-120px;top:50%;transform:translateY(-50%);display:inline-flex;align-items:center;gap:8px;color:#0d0d12;text-decoration:none;font-size:15px;line-height:1;white-space:nowrap;letter-spacing:0;text-transform:none}
.back2:hover{text-decoration:underline;text-underline-offset:4px}
.back2 svg{width:16px;height:10px;flex:none}
.dgrid{display:grid;grid-template-columns:3fr 2fr;gap:56px;align-items:start}
.eyebrow{position:relative;display:flex;align-items:center;flex-wrap:wrap;gap:16px;margin:0 0 30px;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:#6b6a78}
.eyebrow .tag{margin:0}
.dgrid h1{font-size:clamp(34px,5vw,64px);font-weight:300;line-height:1.08;letter-spacing:-.02em;margin-bottom:40px;overflow-wrap:anywhere}
.saves{font-size:24px;font-weight:400;line-height:1.3;margin-bottom:22px;max-width:30ch}
.lead{font-size:18px;line-height:1.6;color:#2b2b36;max-width:62ch;margin-bottom:18px}
.time{margin-top:44px;padding-top:36px;border-top:1px solid #dcdae4}
.time .lbl,.ex .lbl{font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:#6b6a78;margin-bottom:10px}
.ex{margin-top:44px;padding-top:36px;border-top:1px solid #dcdae4}
.exg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px;margin-top:18px}
.exg a{color:inherit;text-decoration:none;display:block}
.exg .im{aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#07070a;border:1px solid #e3e6ee}
.exg img{display:block;width:100%;height:100%;object-fit:cover}
.exg span{display:block;margin-top:8px;font-size:15px;line-height:1.35}
.exg a:hover span{color:#2563eb;text-decoration:underline;text-underline-offset:3px}
.work{list-style:none;padding:0;display:grid;gap:14px}
.work li{position:relative;padding-left:26px;font-size:18px;line-height:1.5;color:#2b2b36;max-width:62ch}
.work li::before{content:'';position:absolute;left:0;top:.62em;width:10px;height:10px;background:#8ec5ff}
.side{position:sticky;top:24px;background:#fff;border:1px solid #e3e1ec;border-radius:14px;overflow:hidden}
.side .art{aspect-ratio:16/9;background:#07070a}
.side .art img{display:block;width:100%;height:100%;object-fit:cover}
.side .in{padding:26px 26px 28px}
.how{display:flex;align-items:center;gap:12px;font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:18px}
.how i{width:14px;height:14px;background:#8ec5ff;flex:none}
.pr{display:flex;align-items:stretch;gap:0;margin-bottom:10px;border:1.5px solid #d8d6d0;background:#fbfaf7}
.pr code{flex:1;padding:12px 14px;font:400 13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#111;overflow-wrap:anywhere}
.pr button{appearance:none;border:0;border-left:1.5px solid #d8d6d0;background:transparent;font:500 12px/1 Inter,Arial,sans-serif;padding:0 14px;cursor:pointer;color:#2563eb}
.pr button:hover{background:#eaf0fd}
.meta{display:flex;align-items:center;gap:12px;margin:22px 0 4px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#6b6a78}
.tag{display:inline-block;margin:10px 0 24px;padding:8px 14px;background:#e3effc;color:#2563eb;font-size:14px;font-weight:500;letter-spacing:.04em;text-transform:uppercase}
.btn{display:block;width:100%;text-align:center;padding:16px;border-radius:6px;font:500 16px/1 Inter,Arial,sans-serif;cursor:pointer;margin-bottom:12px;text-decoration:none}
.btn.p{background:#2563eb;color:#fff;border:1.5px solid #2563eb}
.btn.p:hover{background:#1d4fd0}
.btn.s{background:#fff;color:#0d0d12;border:1.5px solid #0d0d12}
.btn.s:hover{background:#f1f0f6}
@media (max-width:900px){#detail{padding:20px 16px 64px}.back2{position:static;transform:none;flex-basis:100%}.dgrid{grid-template-columns:1fr;gap:36px}.side{position:static}.saves{font-size:20px}}
</style>
</head>

var detail=document.getElementById('detail'),home=document.getElementById('home'),BASE=document.title;
function skillMd(s,d){return '---\nname: '+s.title+'\ndescription: '+s.desc+'\n---\n\n# '+s.title+'\n\n'+d.p.join('\n\n')+'\n\n## How to activate\n\n'+d.prompts.map(function(p){return '- "'+p+'"'}).join('\n')+'\n'}
function copy(t,btn,label){var done=function(){var o=btn.textContent;btn.textContent=label||'Copied';setTimeout(function(){btn.textContent=o},1400)};
  try{navigator.clipboard.writeText(t).then(done,function(){fallback()})}catch(e){fallback()}
  function fallback(){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove();done()}}
function showDetail(s){var d=D[s.title];
  detail.innerHTML=''+
  '<div class="dgrid"><div><div class="eyebrow"><a class="back2" href="#/"><svg viewBox="0 0 16 10" fill="none" stroke="currentColor" stroke-width="1.1"><path d="M16 5H1M5 1L1 5l4 4"/></svg>All skills</a><span>Skill type</span><span class="tag">'+esc(s.category)+'</span></div><h1>'+esc(s.title)+'</h1>'+
  d.p.map(function(t){return '<p class="lead">'+esc(t)+'</p>'}).join('')+
  '<div class="time"><div class="lbl">The manual work it saves</div><ul class="work">'+d.work.map(function(t){return '<li>'+esc(t)+'</li>'}).join('')+'</ul></div>'+(EX[s.title]?'<div class="ex"><div class="lbl">Built with this skill</div><div class="exg">'+EX[s.title].map(function(e){return '<a href="../'+e[0]+'/"><div class="im"><img src="../'+e[0]+'/thumb.'+(RM?'png':'webp')+'" alt="" loading="lazy"></div><span>'+esc(e[1])+'</span></a>'}).join('')+'</div></div>':'')+'</div>'+
  '<aside class="side"><div class="art"><img src="'+esc(s.art)+'" alt="'+esc(s.alt)+'"></div><div class="in">'+
  '<div class="how"><i></i>Say this to activate the skill</div>'+
  d.prompts.map(function(p,i){return '<div class="pr"><code>“'+esc(p)+'”</code><button data-i="'+i+'">Copy</button></div>'}).join('')+
  '<button class="btn p" id="cp">Copy prompt for Claude</button><button class="btn s" id="dl">Download skill (.md)</button></div></aside></div>';
  detail.querySelectorAll('.pr button').forEach(function(b){b.onclick=function(){copy(d.prompts[+b.dataset.i],b)}});
  document.getElementById('cp').onclick=function(){copy(d.prompts[0],this,'Copied')};
  document.getElementById('dl').onclick=function(){var u=URL.createObjectURL(new Blob([skillMd(s,d)],{type:'text/markdown'})),a=document.createElement('a');a.href=u;a.download=s.title+'.md';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},1000)};
  document.title=s.title+' · '+BASE}
function route(){var m=/^#\/(.+)$/.exec(location.hash),s=m&&SKILLS.filter(function(x){return x.title===decodeURIComponent(m[1])})[0];
  if(s){showDetail(s);home.hidden=true;detail.hidden=false;document.body.classList.add('detail')}
  else{home.hidden=false;detail.hidden=true;document.body.classList.remove('detail');document.title=BASE}
  window.scrollTo(0,0)}
window.addEventListener('hashchange',route);route();
</script>
