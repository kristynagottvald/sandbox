    /* ---------- Library: heading, search and filters on the left (sticky on desktop), the 2-column project grid on the right ---------- */
    .lib-side { display: grid; gap: 24px; align-content: start; }
    .search { position: relative; display: flex; align-items: center; max-width: 340px; background: var(--off-black); border: 1px solid transparent; border-radius: var(--r-md); transition: border-color .2s; }
    .search:focus-within { border-color: rgba(255,255,255,.28); }
    .search .mag { position: absolute; left: 14px; width: 16px; height: 16px; color: var(--grey); pointer-events: none; }
    .search input { width: 100%; height: 48px; padding: 0 40px 0 40px; border: 0; background: transparent; color: var(--ink); font: 300 var(--fs-body)/1 var(--sans); outline: none; -webkit-appearance: none; appearance: none; border-radius: 0; }
    .search input::-webkit-search-cancel-button { display: none; }
    .search input:focus-visible { outline: none; }
    .ph { position: absolute; left: 40px; right: 40px; top: 50%; transform: translateY(-50%); color: var(--mid-grey); font: 300 var(--fs-body)/1.2 var(--sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; transition: opacity .35s ease; }
    .ph.out { opacity: 0; }
    .ph.gone { display: none; }
    .clr { position: absolute; right: 8px; width: 28px; height: 28px; color: var(--grey); font-size: 22px; line-height: 1; transition: color .2s; }
    .clr:hover { color: var(--ink); }
    .hint { color: var(--grey); font-weight: 300; font-size: 16px; line-height: 1.4; max-width: 30ch; }
    .hint b { font-weight: 400; color: var(--ink); }
    /* category filters: one all-caps row each, stacked with a rule between, the width of the search */
    .tabs { display: grid; max-width: 340px; border-bottom: 1px solid var(--line); }
    .tab { display: block; width: 100%; text-align: left; padding: 13px 0 12px; border-top: 1px solid var(--line); color: var(--grey); transition: color .2s; }
    .tab:hover, .tab[aria-pressed="true"] { color: var(--ink); }
    .tab[aria-pressed="true"]::before { content: ""; display: inline-block; vertical-align: 1.5px; width: 5px; height: 5px; margin-right: 8px; border-radius: 50%; background: currentColor; }
    .empty { padding: 12px; color: var(--grey); font-weight: 300; }
    .card-media.svg img { transform: none; }
    @media (min-width: 700px) {
      .lib-side { position: sticky; top: calc(var(--nav-h) + 24px); align-self: start; }
    }

    /* ---------- Skill page: back link and type on the left, story and activation panel on the right ---------- */
    .d-side { display: grid; gap: 14px; align-content: start; }
    .back2 { color: var(--grey); transition: color .2s; }
    .back2:hover { color: var(--ink); }
    .d-type { color: var(--grey); }
    .d-type b { font-weight: 400; color: var(--ink); }
    .dgrid { display: grid; gap: 48px; padding: 0 12px; }
    .d-title { font: 300 var(--fs-title)/var(--lh-title) var(--cond); letter-spacing: var(--ls-head); overflow-wrap: anywhere; margin-bottom: 32px; }
    .saves { font: 300 var(--fs-h3)/1.2 var(--cond); letter-spacing: -0.01em; max-width: 30ch; margin-bottom: 24px; }
    .lead { font-weight: 300; line-height: var(--lh-body); max-width: 60ch; margin-bottom: 18px; color: #d9d9d9; }
    .time, .ex { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--line); }
    .lbl { color: var(--grey); margin-bottom: 20px; }
    .work-items { display: grid; gap: 12px; }
    .work-items li { position: relative; padding-left: 22px; font-weight: 300; line-height: var(--lh-body); max-width: 60ch; color: #d9d9d9; }
    .work-items li::before { content: ""; position: absolute; left: 0; top: .6em; width: 6px; height: 6px; border-radius: 50%; background: var(--grey); }
    .exg { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 24px 12px; }
    .exg a { display: grid; gap: 10px; }
    .exg .im { aspect-ratio: 16 / 9; overflow: hidden; border-radius: var(--r-md); background: var(--off-black); }
    .exg img { width: 100%; height: 100%; object-fit: cover; }
    .exg span { color: var(--grey); font-weight: 300; transition: color .2s; }
    .exg a:hover span { color: var(--ink); }
    .side { display: grid; gap: 20px; align-content: start; }
    .side .art { aspect-ratio: 16 / 9; overflow: hidden; border-radius: var(--r-md); background: var(--off-black); }
    .side .art img { width: 100%; height: 100%; object-fit: cover; }
    .how { color: var(--grey); padding-top: 4px; }
    .prs { display: grid; gap: 8px; }
    .pr { display: flex; align-items: stretch; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--off-black); }
    .pr code { flex: 1; padding: 14px 16px; font: 300 16px/1.45 var(--sans); color: #d9d9d9; overflow-wrap: anywhere; }
    .pr button { flex: none; padding: 0 16px; border-left: 1px solid var(--line); color: var(--grey); transition: color .2s; }
    .pr button:hover { color: var(--ink); }
    .btns { display: grid; gap: 8px; margin-top: 4px; }
    .btn { display: block; width: 100%; text-align: center; padding: 16px; border-radius: var(--r-md); transition: background .2s, color .2s, border-color .2s; }
    .btn.p { background: var(--ink); color: var(--bg); border: 1px solid var(--ink); }
    .btn.p:hover { background: #d9d9d9; border-color: #d9d9d9; }
    .btn.s { border: 1px solid rgba(255,255,255,.28); color: var(--ink); }
    .btn.s:hover { border-color: var(--ink); }

      .side { position: sticky; top: calc(var(--nav-h) + 24px); }
    }
    @media (prefers-reduced-motion: reduce) { .ph { transition: none; } }
  </style>

'brand-guidelines-mini-site':{saves:'Laying out a brand book page by page and keeping it in step with the real brand',work:["Placing every logo lockup, clear space rule and misuse example on its own page by hand","Copying fonts, sizes, colour values and spacing steps out of design files and checking each one matches","Describing motion in words because a PDF can’t play it, then reissuing the whole book whenever one rule changes"],
 p:["This skill builds a brand guidelines mini site: one page with a sticky side navigation and six sections, Logo, Type, Spacing, Colour, Motion and In use. It reads the brand from what you give it, such as a Figma link, an existing site, a generator app or a folder of assets, and turns that into a single set of CSS tokens that every section uses.","Logo shows each lockup on light and dark, with clear space and minimum size drawn on, and the ways not to use it. Type shows the typefaces and a live type scale with sizes and line heights. Spacing shows the spacing steps and grid as measured bars. Colour shows each swatch with its name and hex, RGB and CMYK values, approved pairings and contrast ratios, and copies a value when clicked.","Motion plays the brand’s easing curves and durations as small live demos instead of describing them. In use brings it all together in real examples like a social post, a banner and a slide, so people can see the rules applied. Because everything reads from the same tokens, changing a colour or a size once updates every section."],
 prompts:["Use brand-guidelines-mini-site to build a guidelines site for this brand with logo, type, spacing, colour, motion and in use sections.","Build a brand guidelines mini site from this Figma file, with live motion demos and colour swatches that copy their hex value.","Add an In use section with a social post, a banner and a slide that all follow these guidelines."]},
'stream-title-cards':{saves:'Designing every holding screen and lower third for a stream from scratch',work:["Designing a starting soon screen, a title card, an agenda, a Q&A slide and a chat overlay one at a time, and keeping them consistent","Retyping the session name, speakers, times and agenda into every card whenever the running order changes","Exporting each card at 16:9 for OBS, StreamYard or Zoom, and wiring up a countdown that actually counts down"],
 p:["This skill builds a full set of on-screen cards for a livestream, webinar or live event, in one consistent look. You choose which cards the package needs from five options: Starting soon, Session title, Table of contents, Q&A and Live chat.","Starting soon is a holding screen with a live countdown to the start time and a gently looping background, so the stream can go live early. Session title shows the session name, time and each speaker’s name and role. Table of contents lists the agenda as numbered sections and can highlight the one in progress. Q&A invites questions and shows the current one on a card. Live chat leaves room for a chat feed beside the speaker, with a LIVE badge.","Every card shares one set of brand colours, type and spacing, and reads its text from a single list of session details, so changing the title, time or agenda once updates the whole package. Each card renders at 1920×1080 and can be shown full screen as a browser source in OBS or StreamYard, or exported as a still or a short looping clip."],
 prompts:["Use stream-title-cards to make a livestream package with starting soon, session title, table of contents, Q&A and live chat cards.","Make a starting soon card with a countdown to 2pm and a session title card for two speakers, in our brand colours.","Add a table of contents card from this agenda that highlights the current section, plus a Q&A card for the end."]},
'soft-drifting-cursor':{saves:'Keyframing a cursor’s path by hand, over and over',work:["Plotting each point a cursor visits and moving it there frame by frame","Tuning the easing so the cursor glides instead of jerking from point to point","Offsetting several cursors so they never move in lockstep, and matching each name tag to its cursor"],
 p:["This skill is only about the cursor. It builds a small pointer that drifts around a scene in a soft, endless loop. The pointer is a simple white arrow with a thin coloured outline, tilted so its tip points down and to the left, with a small name tag trailing up and to the right in the same colour.","Its movement is a list of stops. For each stop you give the position and how long the cursor takes to get there. It eases out of one stop and into the next so it glides rather than snaps, and repeating a position makes it pause there. When it reaches the end, it returns to where it began, so the loop has no jump.","For a more natural drift, the cursor can pick its own targets from a repeatable pattern and curve slightly on the way instead of going in a straight line. Give each cursor its own colour, name and loop length, and several of them will wander at the same time without ever moving in step."],
 prompts:["Use soft-drifting-cursor to add three labelled cursors that drift around this screen and loop.","Give each cursor its own colour, name tag and path, with loop lengths that differ so they never move in step.","Make the cursor glide in a gentle arc between points and pause on each one."]},
'line-icon-animations':{saves:'Designing and animating each tiny icon by hand',work:["Drawing every icon in the same stroke weight and style","Deciding what small gesture suits each icon, then keyframing it","Tuning the easing and timing so it feels calm, and offsetting each icon so a set never moves in lockstep"],
 p:["This skill is only about small, minimal line icons that move a little. Every icon is drawn with a single dark line, in a round-capped stroke about two pixels wide, on a white disc with a lightly tinted disc offset behind it. No fills, no extra colour, nothing else on the page.","Each icon does one tiny gesture that fits what it is. A globe turns a quarter-eighth of the way, holds, then turns back, swapping direction each time. A pencil writes a line, and the lines stack up and fade as new ones arrive. An eye stays open and blinks quickly now and then.","The motion is built to feel calm. Icons spend most of the time at rest, move with gentle easing, and run on a looping counter so they repeat exactly. Each icon starts at a different point in its cycle, so a row of them never moves in step. To add a new icon, you pick a gesture that fits its meaning and give it the same stroke and timing rules."],
 prompts:["Use line-icon-animations to make a globe, a pencil and an eye icon that each animate in a small loop.","Add a new line icon to this set, a [bell, heart, key], with a tiny gesture that fits its meaning.","Make these icons loop out of step so they don’t all move together."]},
'brand-audit-engine':{saves:'Checking every asset against the brand guidelines by eye',work:["Opening each asset and comparing it with the guidelines, one check at a time","Copying rules out of a Figma file into a checklist, and keeping it up to date","Tracking which assets are reviewed, flagged or approved, and writing up the feedback"],
 p:["This skill builds a brand audit system for any library of assets you upload: campaign posts, ads, social tiles and other images. The library shows every asset with where it is in review, and you can search it.","The brand guidelines come from a Figma link. The skill reads the rules from that file, such as colours, type, logo use and spacing, and turns them into the checks it runs. Open an asset and it scans it against those checks, circling each problem with a numbered mark, for example a missing logo, text with too little contrast, uneven gaps at the edges, or an off-brand colour.","A results panel then shows how many checks were run and how many were flagged, along with the time taken per asset. The system flags issues but doesn’t decide: a person makes the final call, with buttons to approve the asset or request changes."],
 prompts:["Use brand-audit-engine to audit these uploaded assets against the brand guidelines in this Figma file: [link].","Read the brand guidelines from this Figma link and list the checks you will run, covering colour, type, logo and spacing.","Scan each asset, circle every issue with a number, and leave the approve or request changes decision to me."]},
'session-to-skill':{saves:'Remembering what went right in a session and re-explaining it next time',work:["Looking back through a long session to work out what actually mattered","Re-explaining the same corrections and preferences to Claude in every new session","Writing a skill file from scratch and deciding what belongs in it"],
 p:["Long sessions teach you a lot: which steps worked, what went wrong the first time, and what you kept asking Claude to fix. This skill makes that knowledge easy to keep. It starts by asking Claude a simple question: what did you learn in this session?","Claude answers by looking back over the work: the steps that worked, the mistakes that were corrected, the preferences you repeated, and the decisions you made along the way. Then it helps you decide whether those lessons are worth a skill, which is usually the case when the task will come up again and isn’t obvious.","From there it shows how to build the skill. It picks a short hyphenated name, writes when the skill should be used, lays out the steps in order, and turns your corrections into clear rules. The result is a skill file you can save with your project, so every future session starts with what this one learned."],
 prompts:["Use session-to-skill: what did you learn in this session, and how would we build a skill around it?","Look back over this session and list the corrections I made, then turn them into rules for a skill.","Draft a SKILL.md from what we just built, with a name, when to use it, the steps and the rules."]},
'generator-to-figma-plugin':{saves:'Rebuilding a generator’s output by hand in Figma, over and over',work:["Recreating what the generator makes as layers in Figma, shape by shape, every time","Working out how a Figma plugin is put together: the manifest, the panel and the code that edits the file","Rewriting the drawing code so it makes frames, shapes and text instead of pixels, and passing the controls’ values across"],
 p:["This skill takes a generator, engine or design tool that was built in Claude, usually as a single web page with controls and a preview, and rebuilds it as a Figma plugin. Designers can then use it without leaving Figma.","It splits the tool into two parts. The controls and live preview become the plugin’s panel. The code that makes the design is reworked so that, instead of painting pixels on a canvas, it builds real Figma layers: frames, shapes, text and images that can be edited afterwards. The two parts talk to each other by messages, so changing a control updates what is placed on the page.","It also sets up the plugin’s manifest, loads the fonts the design needs before any text is added, and explains how to test the plugin by importing it into Figma. The original tool keeps working as it did, so you end up with both."],
 prompts:["Use generator-to-figma-plugin to turn this generator into a Figma plugin: [path or paste the code].","Keep the controls as the plugin panel and add a button that places the result on the current page.","Convert this canvas engine’s output into real Figma layers (frames, shapes and text) instead of an image."]},
'product-feature-spot':{saves:'Designing and animating a feature ad from scratch each time',work:["Drawing an abstract version of the component, then a polished mockup of the real feature, by hand","Keyframing how the illustration builds, moves and resolves into the mockup","Timing the pause on the key moment and the loop point, then re-exporting every size"],
 p:["This skill turns any product component or feature into a short, looping ad spot. It starts with an abstract illustration of the UI card or component: flat outlined boxes, hatched picture areas and simple lines, in a few brand colours, so the idea reads at a glance.","The illustration is built from data rather than drawn piece by piece. Each one is a small description: a background colour, a line colour and a layout of boxes, hatched areas and lines placed as fractions of the card. One drawing routine turns that into a card at any size, position and tilt, so a new component is a few lines of data and everything stays on palette.","If you want, the spot then resolves into a high-fidelity mockup of the actual product feature. It runs on one looping timeline that pauses on the key moment so the message can be read, with smooth easing and short captions. It works for any size, and can hold its final frame so the spot fades cleanly into the next."],
 prompts:["Use product-feature-spot to turn this component into a short looping ad spot: [describe the component or feature].","Draw the component as an abstract illustration from data (background, line colour and a layout of boxes and hatched areas), then resolve it into a high-fidelity mockup.","Add a pause on the key moment so the message can be read, and hold the final frame."]},
'paid-ad-pipeline':{saves:'Mocking up an ad, its landing page and its results as separate designs',work:["Designing the ad in its real platform context, with the surrounding content","Building a matching landing page and keeping its headline and tracking links in step with the ad","Making a performance dashboard whose numbers all add up, then checking it on desktop and phone"],
 p:["This skill builds a paid ad walkthrough as one interactive page, in three screens with a toggle at the top. The ad can be on LinkedIn, Google search, Instagram feed or reel, TikTok, or a display ad sitting on a related article.","The first screen shows the ad in its natural setting, with the surrounding content dimmed. Clicking the ad takes you to the second screen: the landing page in browser chrome, with the tracking parameters shown and a headline that matches the ad. The third screen is a performance dashboard marked “Sample data”, with headline numbers, a daily trend, a funnel from click to conversion, a table per variant, breakdown bars and landing page health.","You tell it the platform, the brand, the offer and goal, the audience or variants, and whether to use a real landing page or build a mock. Every number on the dashboard is worked out from impressions, click rate, cost per click and conversion rate, so the figures always agree. It checks the result at desktop width and at 390px wide, then publishes it."],
 prompts:["Use the paid-ad-pipeline skill to build a paid ad pipeline walkthrough as one interactive Artifact. Platform: linkedin. Brand: [name]. Offer and goal: [what the ad promises, and the conversion].","Build a three-screen paid ad walkthrough for an Instagram reel ad with a mock landing page and a sample-data dashboard.","Make a display ad walkthrough on a related article page, with four audience variants in the dashboard."]},
'lowpoly-3d-scene':{saves:'Modelling a low poly landmark and its lighting by hand',work:["Building a landmark out of flat-coloured shapes one piece at a time","Hand-colouring every surface for day, sunset and night, and blending between them","Scattering props like cacti, trees and rocks, then wiring up the camera and window lights"],
 p:["This skill builds a low poly 3D scene in p5.js, in the style of the Integratron sketch. The scene has a landmark made of simple flat-coloured shapes, a gradient sky, a big block of ground, and props scattered at random, such as cacti, trees or rocks.","The whole scene moves through a day, sunset and night cycle. Every surface has three colours, one for each time of day, and they blend smoothly as the cycle runs. At night the windows switch to a warm glow. You can drag to orbit around the scene and scroll to zoom.","It keeps to a few rules so the look stays consistent: flat colours with no outlines, only a few parts per landmark, randomness only at setup, and a scene light enough to run smoothly. You tell it the landmark, the props, the setting and the colours, and whether you want the optional singing-bowl sound."],
 prompts:["Make a low poly scene of a lighthouse on a rocky coast, like the Integratron sketch, with a day to night cycle.","Build a low poly diorama of a cabin in a snowy forest with glowing windows at night.","Use lowpoly-3d-scene to turn this landmark into a desert scene with cacti and rocks."]},
'metacognitive-prompt-rewriter':{saves:'Rewriting prompts by hand to make the model check its own thinking',work:["Working out how to ask the model to question its own approach, every time","Rewriting each prompt from scratch to add steps for identifying, evaluating and updating its thinking","Comparing the old and new versions by eye to see what changed"],
 p:["This skill rewrites an ordinary prompt into a metacognitive one: a prompt that asks the model to think about its own thinking before it answers.","You paste a prompt into the input box, choose whether thinking is on, and press Transform. The rewritten prompt asks the model to identify how it is approaching the task, evaluate whether that approach is working, and update it if it isn’t.","The original and the rewrite sit side by side, so you can see exactly what was added. When you’re happy with it, one button copies the result, ready to paste into Claude."],
 prompts:["Use metacognitive-prompt-rewriter to rewrite this prompt: [your prompt].","Rewrite this prompt so the model identifies, evaluates and updates its thinking, with thinking turned on.","Show the original and rewritten prompts side by side, then give me the rewrite to copy."]},
'industry-swapper':{saves:'Remaking the same mockup by hand for every industry',work:["Duplicating one template and rewriting the headline, offer and details for each industry","Re-picking colours and imagery so each version looks right for its sector","Keeping the layout identical across every variant, then repeating it all for the next industry"],
 p:["Industry Swapper re-skins one template for any industry, live. It’s built from the direct mail mock-up generator: one postcard design that changes to suit whoever you’re showing it to.","On one side is a preview of the piece, with zoom controls to check the details. On the other is a library of variants grouped by industry, such as finance, tech, retail, automotive, insurance and health. Pick one and the copy, colours and imagery all swap together.","The layout never changes, only the content, so every version stays consistent. A reset button takes you back to the starting piece, and the same setup works for ads, landing pages and other mockups."],
 prompts:["Use industry-swapper to build a postcard mockup that re-skins for any industry.","Add a library of variants grouped by industry, with copy, colours and imagery for each.","Add zoom controls and a reset button to this industry swapper."]},
'avoid-widows-and-orphans':{saves:'Hand-checking every text block for stranded words and lines',work:["Reading every paragraph, heading and caption to spot a lone word on the last line", "Nudging line breaks and widths by hand, then re-checking after every edit", "Re-testing at narrow and wide widths, and again in print, slides or canvas renders"],
 p:["Single words left alone on a line make good layouts look unfinished. This skill spots four kinds of stranded text: a lone word on a paragraph’s last line, a last line left at the top of a page or column, a first line left at the bottom, and a heading separated from its text.", "It follows a few simple rules. A last line gets at least two words, a paragraph keeps at least two lines together at a break, a heading always stays with the text under it, and short words and numbers stay attached to their neighbours.", "It knows how to fix this in each place you work: web pages, p5.js and canvas, Figma, Word, PDFs and slides. When it’s done, it checks the last line of every block at narrow and wide widths, and looks at a render to be sure."],
 prompts:['Use avoid-widows-and-orphans to check the last line of every text block on this page.','Fix the runts and orphaned headings in this slide deck.','Apply text-wrap: balance and pretty to this stylesheet, then check narrow and wide widths.','Check the wrapped text in this p5.js sketch for widows and orphans.']},
'fields-scan-overlay-effect':{saves:'Hand-animating a “the agent read your screen” scene frame by frame',work:["Drawing a highlight box and numbered badge on every field by hand", "Timing each box to appear exactly as a scan line passes it", "Keeping the step counter and progress bar in sync with the scan"],
 p:["This is a ready-made effect for any scene where an AI agent reads a screen. A scan line sweeps across the interface, and as it passes each field, a box pops up around it with a numbered badge.", "Next to the screen, a step card counts up as each field is found, and a progress bar fills in time with the scan. The viewer sees what the agent found, not just the motion.", "It works on its own, so you can drop it into any page or explainer. Point it at a different screen, change how many fields there are and how fast it runs, and everything stays in sync."],
 prompts:['Add the fields scan overlay effect to this screen, with a badge on every form field.','Use the fields scan overlay for the “agent reads your screen” scene in this explainer.','Make the scan run left to right in three seconds and count up to eight fields.']},
'brand-neutral-ui-mockup-kit':{saves:'Redrawing fake dashboards, cards and chips for every new scene',work:["Redrawing a fake dashboard, calendar card, toggle card and chip grid for every scene", "Re-picking colours and corner radii each time, so scenes drift apart", "Rebuilding the glassy card and its shadow from scratch"],
 p:["A set of fake product interface pieces you can reuse in any scene: a dashboard window, a calendar day card, a DATASETS toggle card, a grid of chips, and a frosted glass card with a soft shadow.", "The skill remembers the exact sizes and colours (navy, cream, blue and amber), so every new scene looks like it belongs with the last one instead of drifting.", "The pieces aren’t tied to any brand, so they suit explainers and motion pages where the interface only needs to hint at a product."],
 prompts:['Use the brand-neutral UI mockup kit to build a dashboard scene for this explainer.','Add the calendar day card and the DATASETS toggle card to this frame.','Rebuild this mockup with the kit’s navy, cream, blue and amber tokens.']},
'motion-explainer':{saves:'Rebuilding the layered-screen explainer timeline from scratch each time',work:["Sequencing layered screens, cursor moves and presses frame by frame", "Masking illustrations by hand so no seams show where layers meet", "Tuning hold times and loop points until the timeline repeats cleanly"],
 p:["A recipe for animated explainers, like Sander Troubleshoot, NLP Diagram, Agentic Storefront, Video Synopsis and the Clearco guides, that walk through a product or an idea.", "It covers screens that stack and swap places, a cursor that moves and presses, illustrations masked so no seams show, and a pause on the key screen so people can read it.", "Everything runs on a fixed timeline, so a scene plays the same way every time and loops smoothly."],
 prompts:['Use motion-explainer to build a looping explainer for this product.','Add a cursor press that swaps these two screens, then hold on the key screen.','Make this explainer’s timeline deterministic so it loops cleanly.']},
'asset-generator-engine':{saves:'Resizing and exporting every banner and post by hand for each format',work:["Resizing every banner and post for 16:9, 9:16 and stacked formats", "Uploading, reordering and swapping photos, then re-exporting each version", "Fixing the same recurring problems: cut-off calligraphy, text drifting off the logo, badges covering the bar"],
 p:["Many of your tools share one shape: controls on one side and a live preview on the other. This skill builds that shape for tools like Blog Banner Studio, Conference Post Creator, Lifecycle Image Studio, Banner Template Studio and the Postmark and Grubclub engines.", "It handles several formats (wide, tall and stacked), photo upload with delete and reorder, a reset button, and export, including looping animations.", "It also remembers the usual slip-ups: handwriting must finish drawing instead of cutting off, text lines up with the logo, and badges sit correctly over the bar."],
 prompts:['Use asset-generator-engine to build a banner studio with live controls and a canvas preview.','Add a 9:16 format and animated export to this generator.','Add photo upload with delete and reorder to this studio.']},
'scripted-demo-animation-with-a-cursor':{saves:'Screen-recording and re-recording product demos by hand',work:["Screen-recording the product, then re-recording after every UI change", "Cutting a short, fast clip out of the full walkthrough", "Hand-timing every cursor move, click and scene change"],

 prompts:['Use the scripted cursor demo scaffold to build a four-scene demo of this flow.','Add a clip mode that skips scenes and runs faster.','Add a pause button to this scripted demo.']},
'palette-and-brand-constraint-handling':{saves:'Eyeballing colours from references and checking contrast by hand',work:["Eyedropping colours from reference images one at a time", "Checking by hand that every colour pairing is an approved combination", "Judging contrast by eye, which misses muddy colours like a mid-green on green"],

'tile-to-fullscreen-section-transition':{saves:'Re-inventing the tile-expands-to-section transition for each page',work:["Building a tile-expands-to-section animation from scratch for each page", "Debugging flicker caused by cloning the tile’s content", "Hand-writing the reverse animation back into the tile"],

'cut-products-out-of-mockup-photos':{saves:'Masking products by hand and fixing colour fringes',work:["Tracing a product edge by hand in an image editor", "Hunting and erasing coloured fringes, eaten tape and leftover neighbours", "Re-checking the cut-out on light and dark backgrounds"],

'figma-to-motion-page':{saves:'Rebuilding a Figma frame as an animated page by hand and guessing positions',work:["Measuring every element in a Figma frame to place it in code", "Exporting and shrinking each asset, then authoring the motion when the design has none", "Comparing the page with the Figma reference by eye, frame by frame"],

var detail=document.getElementById('detail'),home=document.getElementById('home'),BASE=document.title;
function skillMd(s,d){return '---\nname: '+s.title+'\ndescription: '+s.desc+'\n---\n\n# '+s.title+'\n\n'+d.p.join('\n\n')+'\n\n## How to activate\n\n'+d.prompts.map(function(p){return '- "'+p+'"'}).join('\n')+'\n'}
function copy(t,btn,label){var done=function(){var o=btn.textContent;btn.textContent=label||'Copied';setTimeout(function(){btn.textContent=o},1400)};
  try{navigator.clipboard.writeText(t).then(done,function(){fallback()})}catch(e){fallback()}
  function fallback(){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove();done()}}
function showDetail(s){var d=D[s.title];
  detail.innerHTML=''+
  '<div class="work-side d-side"><a class="back2 caps" href="#/">← All skills</a><p class="d-type caps">Skill type <b>'+esc(s.category)+'</b></p><p class="d-type caps">For <b>'+esc(s.use)+'</b></p></div>'+
  '<div class="dgrid"><div><h1 class="d-title">'+esc(s.title)+'</h1>'+(d.saves?'<p class="saves">'+esc(d.saves)+'</p>':'')+
  d.p.map(function(t){return '<p class="lead">'+esc(t)+'</p>'}).join('')+
  '<div class="time"><div class="lbl caps">The manual work it saves</div><ul class="work-items">'+d.work.map(function(t){return '<li>'+esc(t)+'</li>'}).join('')+'</ul></div>'+(EX[s.title]?'<div class="ex"><div class="lbl caps">Built with this skill</div><div class="exg">'+EX[s.title].map(function(e){var x=/^https?:/.test(e[0]);return '<a href="'+(x?e[0]:'../'+e[0]+'/')+'"'+(x?' target="_blank" rel="noopener"':'')+'><div class="im"><img src="'+(x?(RM?e[3]:e[2]):'../'+e[0]+'/thumb.'+(RM?'png':'webp'))+'" alt="" loading="lazy"></div><span>'+esc(e[1])+(x?' ↗':'')+'</span></a>'}).join('')+'</div></div>':'')+'</div>'+
  
  '<aside class="side"><div class="art"><img src="'+esc(s.art)+'" alt="'+esc(s.alt)+'"></div>'+
  '<div class="how caps">Say this to activate the skill</div><div class="prs">'+
  d.prompts.map(function(p,i){return '<div class="pr"><code>“'+esc(p)+'”</code><button class="caps" type="button" data-i="'+i+'">Copy</button></div>'}).join('')+
  '</div><div class="btns"><button class="btn p caps" id="cp" type="button">Copy prompt for Claude</button><button class="btn s caps" id="dl" type="button">Download skill (.md)</button></div></aside></div>';
  detail.querySelectorAll('.pr button').forEach(function(b){b.onclick=function(){copy(d.prompts[+b.dataset.i],b)}});
  document.getElementById('cp').onclick=function(){copy(d.prompts[0],this,'Copied')};
  document.getElementById('dl').onclick=function(){var u=URL.createObjectURL(new Blob([skillMd(s,d)],{type:'text/markdown'})),a=document.createElement('a');a.href=u;a.download=s.title+'.md';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},1000)};
  }
function route(){var h=location.hash,m=/^#\/(.+)$/.exec(h),s=m&&SKILLS.filter(function(x){return x.title===decodeURIComponent(m[1])})[0];
  if(s){showDetail(s);home.hidden=true;detail.hidden=false;document.title=s.title+' · '+BASE;window.scrollTo(0,0);return}
  var was=home.hidden;home.hidden=false;detail.hidden=true;detail.innerHTML='';document.title=BASE;
  if(!h||h==='#/')window.scrollTo(0,0);else if(was){var t=document.getElementById(h.slice(1));if(t)t.scrollIntoView()}}
window.addEventListener('hashchange',route);route();
var STOP='a an the i my me we our you your is am are was be been it its this that these those of to for in on at by with and or but so if as do does did can could would should will how what why when where which who have has had having get got make made want need needs help trouble problem issue issues really very too much long forever take takes taking just some any into from out up down about like using use used tool thing things stuff'.split(' ');

function stem(w){w=w.toLowerCase().replace(/[^a-z0-9+-]/g,'');if(w.length>5&&/ing$/.test(w))w=w.slice(0,-3);else if(w.length>4&&/ed$/.test(w))w=w.slice(0,-2);else if(w.length>4&&/es$/.test(w))w=w.slice(0,-2);else if(w.length>3&&/s$/.test(w)&&!/ss$/.test(w))w=w.slice(0,-1);return w}
function toks(t){return String(t).toLowerCase().split(/[^a-z0-9+]+/).filter(Boolean).map(stem).filter(function(w){return w.length>1})}
var GST=GROUPS.map(function(g){return g.map(stem)});
var IDX=SKILLS.map(function(s){var d=D[s.title]||{p:[],work:[],prompts:[]};return{s:s,title:toks(s.title.replace(/-/g,' ')),tag:toks(s.category+' '+s.use),work:toks((d.work||[]).join(' ')+' '+(d.saves||'')),desc:toks(s.desc),body:toks((d.p||[]).join(' ')+' '+(d.prompts||[]).join(' '))}});
function hit(arr,q){for(var i=0;i<arr.length;i++)if(arr[i]===q||(q.length>3&&arr[i].indexOf(q)===0))return true;return false}
function score(ix,qs,exp,raw){var sc=0;
  qs.forEach(function(q){
    if(hit(ix.title,q))sc+=10;if(hit(ix.tag,q))sc+=6;if(hit(ix.work,q))sc+=4;if(hit(ix.desc,q))sc+=3;if(hit(ix.body,q))sc+=1.5});
  exp.forEach(function(q){
    if(hit(ix.title,q))sc+=3;if(hit(ix.tag,q))sc+=2;if(hit(ix.work,q))sc+=1.4;if(hit(ix.desc,q))sc+=1.2;if(hit(ix.body,q))sc+=.4});
  if(raw.length>2&&ix.s.title.replace(/-/g,' ').indexOf(raw)>-1)sc+=12;
  return sc}
function search(q){
  var raw=q.toLowerCase().replace(/[^a-z0-9+ -]/g,' ').replace(/-/g,' ').replace(/\s+/g,' ').trim();
  var qs=toks(raw).filter(function(w){return STOP.indexOf(w)<0});
  if(!qs.length)qs=toks(raw);
  var exp=[];
  GST.forEach(function(g){if(qs.some(function(w){return g.indexOf(w)>-1}))g.forEach(function(w){if(qs.indexOf(w)<0&&exp.indexOf(w)<0)exp.push(w)})});
  var res=IDX.map(function(ix){return{t:ix.s.title,sc:score(ix,qs,exp,raw)}}).filter(function(r){return r.sc>=2});
  res.sort(function(a,b){return b.sc-a.sc});
  if(res.length){var top=res[0].sc;res=res.filter(function(r){return r.sc>=top*.3})}
  return res}
var qEl=document.getElementById('q'),phEl=document.getElementById('ph'),clrEl=document.getElementById('clr'),hintEl=document.getElementById('hint');
function runSearch(){
  var v=qEl.value.trim();clrEl.hidden=!qEl.value;phEl.classList.toggle('gone',!!qEl.value);
  if(!v){SR=null;hintEl.hidden=true;render();return}
  var res=search(v);SR={};res.forEach(function(r){SR[r.t]=r.sc});
  var byT={};ORDER.forEach(function(el){byT[el.dataset.t]=el});
  SORDER=res.map(function(r){return byT[r.t]});
  cur='All';render();
  hintEl.hidden=false;
  hintEl.innerHTML=res.length?'<b>'+res.length+'</b> '+(res.length===1?'skill matches':'skills match')+' “'+esc(v)+'”, best match first':'No skills match “'+esc(v)+'”. Try a skill name, or describe what you are trying to do, like “resize banners” or “cut a product out of a photo”.'}
qEl.addEventListener('input',runSearch);
qEl.addEventListener('keydown',function(e){if(e.key==='Escape'){qEl.value='';runSearch()}});
clrEl.addEventListener('click',function(){qEl.value='';runSearch();qEl.focus()});

var PH=['Search for skill name','Describe the skill','What problem are you having?'],pi=0;
phEl.textContent=PH[0];
setInterval(function(){if(qEl.value)return;phEl.classList.add('out');setTimeout(function(){pi=(pi+1)%PH.length;phEl.textContent=PH[pi];phEl.classList.remove('out')},RM?0:350)},3200);

/* Phones: the section name in the header opens the stacked nav, as on the home page */
(function(){var top=document.getElementById('top'),jump=document.getElementById('nav-jump');
  function setMenu(o){top.classList.toggle('open',o);jump.setAttribute('aria-expanded',String(o))}
  jump.addEventListener('click',function(e){e.stopPropagation();setMenu(!top.classList.contains('open'))});
  document.addEventListener('click',function(e){if(!top.contains(e.target))setMenu(false)});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')setMenu(false)});
  top.querySelectorAll('.top-nav a, .status').forEach(function(a){a.addEventListener('click',function(){setMenu(false)})});
  document.getElementById('to-top').addEventListener('click',function(e){e.preventDefault();window.scrollTo({top:0,behavior:RM?'auto':'smooth'})})})();
