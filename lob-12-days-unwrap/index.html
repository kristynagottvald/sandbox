<meta name="description" content="A 1:1 motion post for the 12 Days of Lob advent: a wrapped gift box unties its bow, the ribbon slides away, the lid doors swing open and the Day 1 mail fact appears on a dotted card with the 1962 Christmas stamp. Every day has its own colourway and box pattern.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--sans:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;--page:#0e0f1d}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{display:flex;flex-direction:column;min-height:100dvh;background:var(--page);color:#fff;font:400 14px/1.4 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
/* ---------- Back nav (shared across all sandbox projects) ---------- */
nav.back{box-sizing:border-box;flex:none;display:flex;align-items:center;gap:8px;height:49px;padding:0 20px;background:#000;border-bottom:1px solid #1c1c1c;font:400 13px/1.35 var(--sans);white-space:nowrap}
nav.back a{color:#8d8d8d;text-decoration:none}
nav.back a:hover,nav.back a:focus-visible{color:#fff;text-decoration:underline;text-underline-offset:3px}
nav.back span{color:#6e6e6e}
nav.back b{font-weight:500;color:#fff;overflow:hidden;text-overflow:ellipsis}
@media (max-width:640px){nav.back{padding:0 16px}nav.back>span:nth-of-type(n+2),nav.back>a:nth-of-type(2),nav.back>b{display:none}nav.back .ctl{gap:6px}nav.back button{padding:4px 9px}}
nav.back .ctl{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:0}
nav.back button{font:inherit;color:#fff;background:transparent;border:1px solid #4a4a4a;border-radius:8px;padding:4px 12px;cursor:pointer}
nav.back button:hover{border-color:#fff}
nav.back button:focus-visible{outline:2px solid #8263fd;outline-offset:2px}
nav.back #pp{min-width:64px}
nav.back input[type=range]{width:240px;min-width:60px;accent-color:#8263fd;cursor:pointer}
@media (max-width:640px){nav.back .ctl{flex:1}nav.back input[type=range]{flex:1;width:auto}}

.stage{flex:1;min-height:0;width:100%;display:flex;justify-content:center;align-items:center;padding:16px}
#box{position:relative;flex:none;cursor:pointer}
.frame{position:absolute;left:0;top:0;width:1200px;height:1200px;transform-origin:0 0;overflow:hidden;border-radius:13.926px;contain:strict}
.frame>*{position:absolute}
.bgc{inset:0}
.inside{left:177px;top:252px;width:845px;height:826px;background:#fff;overflow:hidden}
.dots{inset:0;position:absolute;opacity:.31;background-image:radial-gradient(circle at center,var(--dot) 0 2.68px,transparent 3.1px);background-size:34px 34px;background-position:-6px 9.8px;-webkit-mask-image:linear-gradient(#0000,#000);mask-image:linear-gradient(#0000,#000)}
.title,.label,.bodytx{color:#000310}
.title{left:272.04px;top:679.6px}
.label{left:274.02px;top:616.79px}
.bodytx{left:267.72px;top:862.19px}
.door{left:0;top:0;width:422.5px;height:826px;transform-origin:0 0;overflow:hidden;will-change:transform}
.door .face{position:absolute;inset:0;overflow:hidden}
.door .pat{position:absolute;top:0;left:0;overflow:visible}
.door.R .pat{left:-422.5px}
.door .num{position:absolute;left:0;top:0;line-height:0}
.stamp{left:634px;top:309px;width:323px;height:374px;transform-origin:50% 50%}
.rib{background:currentColor}
.bow{left:412.17px;top:460.09px;transform-origin:184.8px 165.9px}
.days{left:377.55px;top:122.85px}
.logo{left:675.35px;top:103px}
.hdr{inset:0}
.hdr svg{position:absolute}

.ctlrow{flex:none;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:center;padding:0 16px 16px}
.chips{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;padding-top:4px}
.chips button{position:relative;font:500 13px/1 var(--sans);color:#fff;width:36px;height:36px;padding:0;border-radius:50%;border:1px solid #3a3c55;background:none;cursor:pointer}
.chips .ring{position:absolute;left:-4px;top:-4px;width:42px;height:42px;pointer-events:none;transform:rotate(-90deg);overflow:visible}
.chips .ring circle{fill:none;stroke:#f0f5a8;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:1 1;stroke-dashoffset:1}
.chips button:hover{border-color:#fff}
.chips button[aria-pressed=true]{background:#8263fd;border-color:#8263fd}
button:focus-visible{outline:2px solid #f0f5a8;outline-offset:2px}
.expbtn{position:relative;display:inline-flex;align-items:center;gap:10px;height:38px;padding:0 16px 0 8px;border-radius:99px;border:1px solid #8263fd;background:#8263fd;color:#fff;font:500 13px/1 var(--sans);cursor:pointer}
.expbtn:hover{background:#6f4ff9;border-color:#6f4ff9}
.expbtn:disabled{cursor:progress;background:none}
.expbtn .ld{width:26px;height:26px;flex:none;transform:rotate(-90deg)}
.expbtn .ld circle{fill:none;stroke-width:3;stroke-linecap:round}
.expbtn .ld .tr{stroke:rgba(255,255,255,.25)}
.expbtn .ld .pg{stroke:#f0f5a8;stroke-dasharray:1 1;stroke-dashoffset:1}
.expbtn .ic{transform:none}
.clip .ctlrow{display:none}
.clip .stage{padding:0}

/* sandbox project bar: the home page nav's 72px height, SANDBOX / PROJECT NAME in its all-caps label style, any controls on the right */
html body nav.back{box-sizing:border-box;flex:none;align-self:stretch;width:auto;align-items:center;gap:10px;height:72px;min-height:72px;padding:0 30px;background:#181716;border-bottom:1px solid rgba(255,255,255,.1);color:#fff;font:400 13px/1.35 "Inter","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;white-space:nowrap;overflow:hidden}
html body nav.back>a,html body nav.back>span,html body nav.back>b{font:400 12px/1.3 "Inter","Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;text-decoration:none}
html body nav.back>a{color:#989898;transition:color .2s}
html body nav.back>a:hover,html body nav.back>a:focus-visible{color:#fff;text-decoration:none}
html body nav.back>span{color:#6b6b6b}
html body nav.back>b{font-weight:400;color:#fff;min-width:0;overflow:hidden;text-overflow:ellipsis}
html body nav.back:not(:has(>div))>b{display:block}
html body nav.back>div{margin-left:auto}
@media (min-width:641px){html body nav.back>b{display:block}}
@media (max-width:640px){html body nav.back{padding:0 20px}}
/* phones: the bar's controls move to a panel (also a nav.back, so the page's own control styles still apply) under the visual */
html body nav.back.sb-panel{position:static;height:auto;min-height:0;padding:12px 20px;justify-content:center;flex-wrap:wrap;border-bottom:0;border-top:1px solid rgba(255,255,255,.1);white-space:normal;overflow:visible;z-index:auto}
html body nav.back.sb-panel>div{margin:0;flex:0 1 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;max-width:100%;min-width:0}
html body nav.back:not(.sb-panel):not(:has(>div))>a,html body nav.back:not(.sb-panel):not(:has(>div))>span{display:block}
</style>
</head>

var DAYS={"1": {"n": 1, "bg": "#1e2247", "box": "#8263fd", "pat": ["snow", "#4131f1", 0.4], "rib": "#1e2247", "hdr": "#ffffff", "numcol": "#1e2247", "back": "#684ff8", "dot": "#8263fd", "note": "", "nx": 864.69, "ny": 844.93}, "2": {"n": 2, "bg": "#163e44", "box": "#c0ce00", "pat": ["t2", "#ffffff", 0.5], "rib": "#163e44", "hdr": "#ffffff", "numcol": "#163e44", "back": null, "dot": null, "note": "", "nx": 841.68, "ny": 844.93}, "3": {"n": 3, "bg": "#4033ee", "box": "#cf48df", "pat": ["t3", "#ffffff", 0.4], "rib": "#1e2247", "hdr": "#ffffff", "numcol": "#1e2247", "back": null, "dot": null, "note": "", "nx": 845.39, "ny": 844.93}, "4": {"n": 4, "bg": "#1e2247", "box": "#4033ee", "pat": ["t4", "#1e2247", 0.4], "rib": "#ffffff", "hdr": "#ffffff", "numcol": "#ffffff", "back": null, "dot": null, "note": "", "nx": 834, "ny": 847.49}, "5": {"n": 5, "bg": "#462261", "box": "#8263fd", "pat": ["t5", "#4033ee", 0.5], "rib": "#ffffff", "hdr": "#ffffff", "numcol": "#ffffff", "back": null, "dot": null, "note": "", "nx": 824.93, "ny": 844.93}, "6": {"n": 6, "bg": "#cf48df", "box": "#f0f5a8", "pat": ["snow", "#b5be3e", 0.5], "rib": "#1e2247", "hdr": "#ffffff", "numcol": "#1e2247", "back": null, "dot": null, "note": "", "nx": 834.93, "ny": 847.23}, "7": {"n": 7, "bg": "#4033ee", "box": "#ffc2dd", "pat": ["snow", "#cf48df", 0.3], "rib": "#1e2247", "hdr": "#ffffff", "numcol": "#1e2247", "back": null, "dot": null, "note": "", "nx": 840.63, "ny": 847.49}, "8": {"n": 8, "bg": "#462261", "box": "#f0f5a8", "pat": ["t3", "#c0ce00", 0.6], "rib": "#462261", "hdr": "#ffffff", "numcol": "#462261", "back": null, "dot": null, "note": "", "nx": 836.18, "ny": 844.93}, "9": {"n": 9, "bg": "#163e44", "box": "#8263fd", "pat": ["t4", "#4033ee", 0.5], "rib": "#ffffff", "hdr": "#ffffff", "numcol": "#ffffff", "back": null, "dot": null, "note": "", "nx": 834.93, "ny": 844.93}, "10": {"n": 10, "bg": "#4033ee", "box": "#f0f5a8", "pat": ["t5", "#b5be3e", 0.5], "rib": "#1e2247", "hdr": "#ffffff", "numcol": "#1e2247", "back": null, "dot": null, "note": "", "nx": 737.96, "ny": 844.93}, "11": {"n": 11, "bg": "#462261", "box": "#cf48df", "pat": ["t2", "#ffffff", 0.3], "rib": "#462261", "hdr": "#ffffff", "numcol": "#462261", "back": null, "dot": null, "note": "", "nx": 776.73, "ny": 844.93}, "12": {"n": 12, "bg": "#684ff8", "box": "#f0f5a8", "pat": ["snow", "#b5be3e", 0.5], "rib": "#4033ee", "hdr": "#ffffff", "numcol": "#4131f1", "back": null, "dot": null, "note": "", "nx": 734.53, "ny": 844.93}};

var D0=2.7, FADE=.6, T1=9.7, T2=6.6;   /* doors start at D0; Day 1 runs T1 s (reveal + hold), Days 2-12 run T2 s (untie, open, short hold); the last FADE s of each day cross-fade to the next day's closed gift */
var SEG=[],T=0;for(var di=1;di<=12;di++){var ln=di===1?T1:T2;SEG.push({day:''+di,s:T,len:ln});T+=ln}
var qs=location.hash+location.search, CLIP=/clip/.test(qs);
if(CLIP)document.documentElement.classList.add('clip');
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var W=1200;

/* ---------- door keyframes (Figma frames 20:206, 20:57, 20:110, 20:187), texture corners TL TR BR BL ---------- */
/* left door: texture x 0 = hinge (x 177); right door: texture x 0 = the middle seam, 422.5 = hinge (x 1022) */
var QL=[null,
  [[177,252],[514.0,220],[519.5,1104.5],[177,1078]],
  [[177,252],[333.4,178],[336,1136],[177,1077.5]],
  [[177,251],[-29.6,177],[-33,1135],[177,1076.5]]];
var QR=[null,
  [[685.0,220],[1022,252],[1022,1078],[679.5,1104.5]],
  [[862.6,178],[1022,252],[1022,1077.5],[860,1136]],
  [[1228.6,177],[1022,251],[1022,1076.5],[1232,1135]]];
function closedL(top){return [[177,top],[599.5,top],[599.5,top+826],[177,top+826]]}
function closedR(top){return [[599.5,top],[1022,top],[1022,top+826],[599.5,top+826]]}
/* Catmull-Rom through the keyframes, p in [0,3] */
function cr(K,p){
  var i=Math.min(2,Math.floor(p)),u=p-i,out=[],j;
  for(j=0;j<4;j++){
    var P0=K[Math.max(0,i-1)][j],P1=K[i][j],P2=K[i+1][j],P3=K[Math.min(3,i+2)][j],q=[];
    for(var c=0;c<2;c++){var a=P0[c],b=P1[c],d=P2[c],e=P3[c];
      q.push(.5*((2*b)+(-a+d)*u+(2*a-5*b+4*d-e)*u*u+(-a+3*b-3*d+e)*u*u*u));}
    out.push(q);}
  return out;
}
/* the projective transform that maps a w x h element onto a quad */
function m3d(w,h,q){
  var x0=q[0][0],y0=q[0][1],x1=q[1][0],y1=q[1][1],x2=q[2][0],y2=q[2][1],x3=q[3][0],y3=q[3][1];
  var dx1=x1-x2,dx2=x3-x2,dx3=x0-x1+x2-x3,dy1=y1-y2,dy2=y3-y2,dy3=y0-y1+y2-y3;
  var den=dx1*dy2-dx2*dy1,g=(dx3*dy2-dx2*dy3)/den,hh=(dx1*dy3-dx3*dy1)/den;
  var a=x1-x0+g*x1,b=x3-x0+hh*x3,d=y1-y0+g*y1,e=y3-y0+hh*y3;
  return 'matrix3d('+[a/w,d/w,0,g/w,b/h,e/h,0,hh/h,0,0,1,0,x0,y0,0,1].map(function(v){return +v.toFixed(7)}).join(',')+')';
}
function hex2(c){c=c.replace('#','');return [0,2,4].map(function(i){return parseInt(c.substr(i,2),16)})}
function mix(a,b,k){var A=hex2(a),B=hex2(b);return 'rgb('+A.map(function(v,i){return Math.round(v+(B[i]-v)*k)}).join(',')+')'}
function lum(c){var A=hex2(c);return (.2126*A[0]+.7152*A[1]+.0722*A[2])/255}

/* ---------- one scene (built twice: the live one and the closed gift that fades back in at the end of the loop) ---------- */
function Scene(host){
  var f=document.createElement('div');f.className='frame';f.appendChild($('scene').content.cloneNode(true));host.appendChild(f);
  var q=function(s){return f.querySelector(s)};
  this.f=f;this.bgc=q('.bgc');this.inside=q('.inside');this.dots=q('.dots');
  this.title=q('.title');this.label=q('.label');this.body=q('.bodytx');this.stamp=q('.stamp');
  this.L=q('.door.L');this.R=q('.door.R');this.num=q('.door.R .num');
  this.ribV=q('.rib.v');this.ribH=q('.rib.h');this.bow=q('.bow');this.hdr=q('.hdr');
}
Scene.prototype.setDay=function(key){
  var d=DAYS[key],s=this;s.d=d;s.key=key;
  s.bgc.style.background=d.bg;s.hdr.style.color=d.hdr;
  s.ribV.style.color=s.ribH.style.color=s.bow.style.color=d.rib;
  var pc=d.pat[1],po=d.pat[2],snow=d.pat[0]==='snow';
  [s.L,s.R].forEach(function(dr){
    dr.querySelector('.front').style.background=d.box;
    dr.querySelector('.back').style.background=d.back||mix(d.box,pc,po);
    var g=dr.querySelector('.snow');g.style.display=snow?'':'none';
    g.setAttribute('fill',pc);g.setAttribute('stroke',pc);g.setAttribute('opacity',po);
    var u=dr.querySelector('.themed');u.setAttribute('href',snow?'':'#pat-'+d.pat[0]);u.style.display=snow?'none':'';
    u.style.color=pc;u.style.opacity=po;u.style.setProperty('--box',d.box);
  });
  s.dots.style.setProperty('--dot','#8263fd');                 /* the Day 1 Figma dot grid on every day's card */
  s.num.innerHTML=$('num-'+key).innerHTML;s.num.style.color=d.numcol;
  var one=d.n===1&&key==='1';
  [s.title,s.label,s.body,s.stamp].forEach(function(el){el.style.display=one?'':'none'});
};
Scene.prototype.render=function(b){
  var s=this,d=s.d,day1=s.key==='1';
  /* bow unties: the bottom tails pull back through the knot first, then the loops */
  var ta=eio(clamp((b-.8)/.5)),lo=eio(clamp((b-1.2)/.6));
  var bp=s.bowP||(s.bowP=s.bow.querySelectorAll('path'));
  [ta,ta,lo,lo].forEach(function(u,i){bp[i].style.strokeDashoffset=-u;bp[i].style.visibility=u>.995?'hidden':''});
  /* ribbon is pulled off: K1 full cross, K2 (Figma) the band and strap have slid toward the bottom and right edges, then both strands are drawn off the box and out of frame */
  /* one continuous pull (no stop): each strand slides toward its box edge and off there (it wraps under the box, never past the
     box edge); the vertical strand passes its K2 position (top end at box top + 262) as the horizontal one passes its K2 x (347) */
  var e=eio(clamp((b-1.6)/1.0)),FV=262/826,eh=Math.pow(e,Math.log(175/850)/Math.log(FV));
  var k12=clamp(e/FV);                                      /* 0..1 up to the K2 moment: box settles 254->252 */
  var p=3*eio(clamp((b-D0)/2.3));
  var top=day1?254-2*k12:252,bot=top+826;
  var yTop=lerp(top,bot,e),xL=lerp(172,1022,eh),yBot=bot,xR=1022;
  var nv=16*clamp(e*12);                                    /* the cut ribbon end shows once it starts moving */
  var V=s.ribV.style,H=s.ribH.style;
  V.left='584.5px';V.width='25px';V.top=yTop+'px';V.height=Math.max(0,yBot-yTop)+'px';V.display=yBot-yTop>.5&&yTop<1200?'':'none';
  V.clipPath=nv?'polygon(0 0,50% '+nv+'px,100% 0,100% 100%,0 100%)':'';
  H.top=(top+372-12.5)+'px';H.height='25px';H.left=xL+'px';H.width=Math.max(0,xR-xL)+'px';H.display=xR-xL>.5&&xL<1200?'':'none';
  H.clipPath=nv?'polygon(0 0,100% 0,100% 100%,0 100%,'+nv+'px 50%)':'';
  var lift=.8*Math.sin(Math.PI*e);                          /* lifted while it is being pulled */
  V.filter=H.filter=lift>.01?'drop-shadow(0 '+(3*lift).toFixed(2)+'px '+(5*lift).toFixed(2)+'px rgba(0,0,0,'+(.45*lift).toFixed(3)+'))':'';
  s.bow.style.transform='translateY('+(top-254)+'px)';
  /* numeral on the right door (texture space) */
  var nx=d.nx-599.5,ny=d.ny-top;                           /* the numeral stays put while the ribbon comes off */
  s.num.style.transform='translate('+nx+'px,'+ny+'px)';
  /* doors */
  var KL=[closedL(top)].concat(QL.slice(1)),KR=[closedR(top)].concat(QR.slice(1));
  var ql=p<=0?KL[0]:cr(KL,p),qr=p<=0?KR[0]:cr(KR,p);
  s.door(s.L,ql,ql[1][0]<177-.01,Math.abs(ql[1][0]-177)<.75);
  s.door(s.R,qr,qr[0][0]>1022+.01,Math.abs(qr[0][0]-1022)<.75);
  s.inside.style.top=(p>2?252-(p-2):top)+'px';
  if(!day1)return;
  /* Day 1 reveal: the title shows through faintly (K4), the stamp drops on (K5), then the label and copy (K6) */
  var to=p<1?0:p<2?.2*(p-1):.2+.8*(p-2),k6=eio(clamp((b-5.7)/.7));
  s.title.style.opacity=to;s.title.style.transform='translateY('+(14*k6)+'px)';
  var la=eio(clamp((b-5.7)/.5)),ba=eio(clamp((b-5.9)/.6));
  s.label.style.opacity=la;s.label.style.transform='translateY('+(10*(1-la))+'px)';
  s.body.style.opacity=ba;s.body.style.transform='translateY('+(12*(1-ba))+'px)';
  var st=clamp((b-4.5)/.7),se=eio(st);
  s.stamp.style.opacity=clamp(st*2.5);
  s.stamp.style.transform='translateY('+(-40*(1-se))+'px) rotate('+(-5*(1-se))+'deg) scale('+(1.15-.15*se)+')';
};
Scene.prototype.door=function(el,q,back,edge){
  el.style.display=edge?'none':'';if(edge)return;
  el.style.transform=m3d(422.5,826,q);
  el.querySelector('.back').style.display=back?'':'none';

var box=$('box'),stage=document.querySelector('.stage');
var live=new Scene(box),fin=new Scene(box);
var cur=0,speed=1,loop=true,playing=false,last=0,raf=0,sl=$('tl'),pp=$('pp');
var dayKey='1';

function fit(){var r=stage.getBoundingClientRect(),cs=getComputedStyle(stage),
  w=r.width-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),h=r.height-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom),
  sc=Math.min(w,h)/W;if(!(sc>0))return;
  box.style.width=box.style.height=W*sc+'px';live.f.style.transform=fin.f.style.transform='scale('+sc+')'}
fit();window.addEventListener('resize',fit);if(window.ResizeObserver)new ResizeObserver(fit).observe(stage);

var s_rings=null;
function segAt(t){for(var i=0;i<SEG.length;i++)if(t<SEG[i].s+SEG[i].len)return i;return SEG.length-1}
/* the sequence: Day 1, then Days 2-12, then back to Day 1; the next day's closed gift fades in over the end of each day */
function render(t){
  var i=segAt(t),g=SEG[i],lt=t-g.s,nx=SEG[(i+1)%SEG.length];
  if(live.key!==g.day)showDay(g.day);
  if(fin.key!==nx.day){fin.setDay(nx.day);fin.render(0)}
  live.render(lt);
  /* progress ring on the current day's button */
  var rings=s_rings&&s_rings.length?s_rings:(s_rings=document.querySelectorAll('#chips .ring circle'));
  for(var r=0;r<rings.length;r++)rings[r].style.strokeDashoffset=r===i?(1-clamp(lt/g.len)).toFixed(4):1;
  var k=clamp((lt-(g.len-FADE))/FADE);
  fin.f.style.opacity=eio(k);fin.f.style.visibility=k>0?'':'hidden';
}
function showDay(k){
  dayKey=k;live.setDay(k);var n=DAYS[k].n;$('expl').textContent=expBusy?$('expl').textContent:'Export Day '+n+' MP4';
  [].forEach.call($('chips').children,function(b){b.setAttribute('aria-pressed',+b.dataset.n===n)});
  box.setAttribute('aria-label',n===1?'12 Days of Lob, Day 1: a wrapped gift box unties and opens to the mail fact: The first U.S. Christmas stamp. The first U.S. holiday stamp was issued on November 1, 1962, in Pittsburgh, Pennsylvania.':'12 Days of Lob, Day '+n+': the wrapped gift box unties and its doors swing open.');
}
var chips=$('chips');for(var i=1;i<=12;i++){var bt=document.createElement('button');bt.type='button';bt.textContent=i;bt.dataset.n=i;bt.setAttribute('aria-label','Day '+i);bt.insertAdjacentHTML('beforeend','<svg class="ring" viewBox="0 0 42 42" aria-hidden="true"><circle cx="21" cy="21" r="19.5" pathLength="1"/></svg>');chips.appendChild(bt)}
chips.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;play({from:SEG[+b.dataset.n-1].s})});

/* clock */
function btn(){pp.textContent=playing?'Pause':'Play';pp.setAttribute('aria-label',pp.textContent)}
function show(){render(cur);sl.value=cur/T*1000;btn()}
function tick(now){raf=0;if(!playing)return;cur+=(now-last)/1000*speed;last=now;
  if(cur>=T){if(loop)cur%=T;else{cur=T-.001;playing=false}}
  show();if(playing)raf=requestAnimationFrame(tick)}
function resume(){if(cur>=T-.01)cur=0;playing=true;last=performance.now();if(!raf)raf=requestAnimationFrame(tick);btn()}
function pause(){playing=false;btn()}
function play(o){o=o||{};cur=o.from||0;speed=o.speed||1;loop=o.loop!==false;resume()}
function seek(x){pause();cur=x;show()}

/* ---------- MP4 export of one day: an off-screen copy of the scene is stepped frame by frame, each frame is rasterised
   through an SVG foreignObject snapshot onto a 1080 x 1080 canvas and encoded to H.264 with WebCodecs, then muxed to MP4 ---------- */
var expBusy=false,EXF=30,EXS=1080;
function setProg(k,txt){$('exp').querySelector('.pg').style.strokeDashoffset=(1-k).toFixed(4);if(txt)$('expl').textContent=txt}
function snapSVG(scene,css,defs){
  var c=scene.f.cloneNode(true);c.style.transform='none';c.style.opacity='1';c.style.visibility='visible';
  var x=new XMLSerializer();
  return '<svg xmlns="http://www.w3.org/2000/svg" width="'+EXS+'" height="'+EXS+'" viewBox="0 0 1200 1200"><foreignObject x="0" y="0" width="1200" height="1200">'+
    '<div xmlns="http://www.w3.org/1999/xhtml" style="position:relative;width:1200px;height:1200px"><style><![CDATA['+css+']]></style>'+defs+x.serializeToString(c)+'</div></foreignObject></svg>';
}
/* a data: URL keeps the canvas untainted (a blob: URL taints it on file:// pages) */
function loadImg(svg){return new Promise(function(res,rej){var im=new Image();
  im.onload=function(){res(im)};im.onerror=function(){rej(new Error('frame render failed'))};im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)})}
async function exportDay(n){
  if(expBusy)return;
  if(!window.VideoEncoder||!window.VideoFrame){alert('MP4 export needs a browser with WebCodecs (recent Chrome, Edge or Safari).');return}
  expBusy=true;var btn=$('exp');btn.disabled=true;setProg(0,'Preparing…');
  try{
    var M=await import('https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/+esm');
    var codec=null,cands=['avc1.640028','avc1.4d0028','avc1.42003e'];
    for(var ci=0;ci<cands.length&&!codec;ci++){try{if((await VideoEncoder.isConfigSupported({codec:cands[ci],width:EXS,height:EXS,bitrate:10e6,framerate:EXF})).supported)codec=cands[ci]}catch(e){}}
    if(!codec)throw new Error('This browser cannot encode H.264 video.');
    var key=''+n,g=SEG[n-1],dur=g.len,N=Math.round(dur*EXF);   /* the full day incl. the closing fade, so the file loops */
    var sc=new Scene(document.createElement('div'));sc.setDay(key);
    var css=document.querySelector('style').textContent,defs=new XMLSerializer().serializeToString(document.querySelector('svg[width="0"]'));
    sc.render(0);var first=await loadImg(snapSVG(sc,css,defs));          /* the closed gift (t = 0): faded back in over the last FADE s */
    var cv=document.createElement('canvas');cv.width=cv.height=EXS;var cx=cv.getContext('2d');
    var muxer=new M.Muxer({target:new M.ArrayBufferTarget(),video:{codec:'avc',width:EXS,height:EXS,frameRate:EXF},fastStart:'in-memory'});
    var err=null,enc=new VideoEncoder({output:function(ch,meta){muxer.addVideoChunk(ch,meta)},error:function(e){err=e}});
    enc.configure({codec:codec,width:EXS,height:EXS,bitrate:10e6,framerate:EXF});
    for(var i=0;i<N;i++){
      if(err)throw err;
      var lt=i/EXF,lk=clamp((lt-(dur-FADE))/FADE);
      sc.render(lt);
      var im=await loadImg(snapSVG(sc,css,defs));
      cx.globalAlpha=1;cx.fillStyle=DAYS[key].bg;cx.fillRect(0,0,EXS,EXS);cx.drawImage(im,0,0,EXS,EXS);
      if(lk>0){cx.globalAlpha=eio(lk);cx.drawImage(first,0,0,EXS,EXS);cx.globalAlpha=1}
      var vf=new VideoFrame(cv,{timestamp:Math.round(i*1e6/EXF),duration:Math.round(1e6/EXF)});
      enc.encode(vf,{keyFrame:i%(EXF*2)===0});vf.close();
      while(enc.encodeQueueSize>8)await new Promise(function(r){setTimeout(r,4)});
      setProg((i+1)/N,'Exporting '+Math.round((i+1)/N*100)+'%');
    }
    await enc.flush();if(err)throw err;muxer.finalize();
    var blob=new Blob([muxer.target.buffer],{type:'video/mp4'}),a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download='lob-12-days-day-'+(n<10?'0':'')+n+'.mp4';document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(a.href)},4000);
    window.__lastExport={bytes:blob.size,frames:N,codec:codec};
  }catch(e){alert('Export failed: '+(e&&e.message||e));window.__lastExport={error:String(e&&e.message||e)}}
  expBusy=false;btn.disabled=false;setProg(0,'Export Day '+DAYS[dayKey].n+' MP4');
}
$('exp').addEventListener('click',function(){exportDay(DAYS[dayKey].n)});
window.__rb={play:play,seek:seek,pause:pause,T:T,day:function(k){seek(SEG[+k-1].s)},seg:SEG,build:function(b){pause();live.render(b);fin.f.style.visibility='hidden';sl.value=b/T*1000}};
pp.addEventListener('click',function(){playing?pause():resume()});
$('replay').addEventListener('click',function(){play({from:0})});
box.addEventListener('click',function(){playing?pause():resume()});
var was=false;
sl.addEventListener('pointerdown',function(){was=playing});
sl.addEventListener('input',function(){playing=false;cur=sl.value/1000*T;render(cur);btn()});
sl.addEventListener('change',function(){if(was)resume();was=false});

var m=/day=(\d+)/.exec(qs);if(m&&DAYS[m[1]])cur=SEG[+m[1]-1].s;
if(reduce&&!CLIP)cur=T1-FADE-.01;
show();
if(!CLIP&&!reduce)play({from:0});
})();
