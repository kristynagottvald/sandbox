<script>
(function(){
const CLIP=location.hash==='#clip';
const POST=location.hash==='#post'; /* embedded in the LinkedIn mockup: no chrome, no auto advance, the host picks the day */
if(CLIP)document.body.classList.add('clip');
if(POST){document.body.classList.add('post');document.documentElement.style.background='transparent'}
const LW=4,S=1080;
const C={bg:'#F8E0F9',shadow:'#F1B9F0',navy:'#1F2149',tab:'#2B2D6D',mag:'#B042C2',lime:'#C9DA6A',blue:'#5049BC',card:'#D244DE',panel:'#E084E9',pale:'#E88EEE',yellow:'#EAF265',btn:'#4534F2',btnDown:'#2A1BC4',plus:'#9382F4',chip:'#D489E4',chipInk:'#8F1A96',white:'#fff'};
const titles=['Tangible','Trusted','Opened','Personal','Memorable','Measurable','Targeted','Responsive','Seasonal','Lasting','Delivered','Cherished'];
const D=POST?1e9:4.4;
let day=0,lt=CLIP?1.9:POST?2.4:0,playing=true,speed=CLIP?2:1,T=0;
const cv=document.getElementById('c'),x=cv.getContext('2d');

/* ---------- helpers ---------- */
const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const eio=v=>v*v*(3-2*v);
const eob=v=>{v=cl(v);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(v-1,3)+c1*Math.pow(v-1,2)};
function rr(a,b,w,h,r,fill,stroke){x.beginPath();x.roundRect(a,b,w,h,r);if(fill){x.fillStyle=fill;x.fill()}if(stroke){x.strokeStyle=stroke;x.lineWidth=LW;x.stroke()}}
function pill(a,b,w,h,col){rr(a,b-h/2,w,h,h/2,col)}
function circ(a,b,r,fill,stroke){x.beginPath();x.arc(a,b,r,0,7);if(fill){x.fillStyle=fill;x.fill()}if(stroke){x.strokeStyle=stroke;x.lineWidth=LW;x.stroke()}}
function poly(pts,fill,stroke){x.beginPath();pts.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.closePath();if(fill){x.fillStyle=fill;x.fill()}if(stroke){x.strokeStyle=stroke;x.lineWidth=LW;x.lineJoin='round';x.stroke()}}
function heart(fill,s=1){x.save();x.scale(s,s);x.beginPath();x.moveTo(0,70);x.bezierCurveTo(-30,45,-110,0,-110,-45);x.bezierCurveTo(-110,-95,-45,-110,0,-60);x.bezierCurveTo(45,-110,110,-95,110,-45);x.bezierCurveTo(110,0,30,45,0,70);x.fillStyle=fill;x.fill();x.restore()}
function star(cx,cy,r1,r2,n,fill,rot=0){x.beginPath();for(let i=0;i<n*2;i++){const r=i%2?r2:r1,a=rot+i*Math.PI/n;x.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r)}x.closePath();x.fillStyle=fill;x.fill()}
function txt(s,a,b,size,col,{w='bold',f='Arial',al='left',ls=0,it=false,max=0}={}){
  x.save();x.fillStyle=col;x.textAlign=al;x.textBaseline='alphabetic';
  let sz=size;const set=()=>{x.font=`${it?'italic ':''}${w} ${sz}px ${f}`;x.letterSpacing=ls+'px'};set();
  if(max){while(x.measureText(s).width>max&&sz>20){sz-=2;set()}}
  x.fillText(s,a,b);x.restore()}

/* ---------- botanical bouquet, airbrushed gradients on cream ---------- */
const CREAM='#FCE8DF',DG='#27493A';
const PAL={pink:['#FF2D8B','#FF7FB5','#FFC2DD'],red:['#FF2A3D','#FF7A8A','#FFC7CF'],orange:['#FF5A1F','#FF9E6B','#FFD0B5'],snow:['#FF86B8','#FFD0E4','#FFF1F6'],blush:['#FF9DB8','#FFC0D0','#FFE3EA']};
const sn=(a,b)=>Math.sin(T*a+(b||0));
function lg(x0,y0,x1,y1,st){const g=x.createLinearGradient(x0,y0,x1,y1);st.forEach(([o,c])=>g.addColorStop(o,c));return g}
function rg(cx,cy,r0,r1,st){const g=x.createRadialGradient(cx,cy,r0,cx,cy,r1);st.forEach(([o,c])=>g.addColorStop(o,c));return g}
function leaf(len,wid,c0,c1,vein=true){x.beginPath();x.moveTo(0,0);x.bezierCurveTo(len*.25,-wid*1.1,len*.8,-wid*1.05,len,0);x.bezierCurveTo(len*.8,wid*.95,len*.25,wid*1.0,0,0);x.fillStyle=lg(0,0,len,0,[[0,c0],[1,c1]]);x.fill();
  if(vein){x.strokeStyle='rgba(255,255,255,.3)';x.lineWidth=2;x.lineCap='round';x.beginPath();x.moveTo(len*.04,0);x.lineTo(len*.92,0);[.3,.5,.7].forEach(k=>{x.moveTo(len*k,0);x.lineTo(len*(k+.14),-wid*.55);x.moveTo(len*k,0);x.lineTo(len*(k+.14),wid*.5)});x.stroke()}}
function orb(r,c0,c1,vein){x.beginPath();x.arc(0,0,r,0,7);x.fillStyle=lg(-r,-r,r,r,[[0,c0],[1,c1]]);x.fill();
  if(vein){x.save();x.clip();x.strokeStyle='rgba(120,255,120,.28)';x.lineWidth=2;x.beginPath();x.moveTo(-r,r*.9);x.lineTo(r*.9,-r);for(let k=-2;k<=2;k++){x.moveTo(k*r*.3-r*.2,r*.2-k*r*.3);x.lineTo(k*r*.3+r*.3,r*.2-k*r*.3-r*.5)}x.stroke();x.restore()}}
function puff(r,pal,sd){x.save();x.beginPath();for(let k=0;k<5;k++){const a=k*Math.PI*2/5+sd,lr=r*(.46+((k*7+sd*3)%3)*.03);x.moveTo(Math.cos(a)*r*.52+lr,Math.sin(a)*r*.52);x.arc(Math.cos(a)*r*.52,Math.sin(a)*r*.52,lr,0,7)}x.clip();
  x.fillStyle=rg(0,0,0,r*1.05,[[0,pal[0]],[.38,pal[1]],[.8,pal[2]],[1,pal[2]]]);x.fillRect(-r*1.2,-r*1.2,r*2.4,r*2.4);x.restore()}
function petals(r,pal,n,wid,tip){for(let k=0;k<n;k++){x.save();x.rotate(k*Math.PI*2/n+(k%2)*.06);const L=r*(.86+((k*5)%3)*.07);x.beginPath();x.moveTo(0,0);
    if(tip){x.bezierCurveTo(L*.3,-L*wid,L*.85,-L*wid*.7,L,0);x.bezierCurveTo(L*.85,L*wid*.7,L*.3,L*wid,0,0)}else{x.bezierCurveTo(L*.3,-L*wid*1.1,L*.98,-L*wid*1.05,L,0);x.bezierCurveTo(L*.98,L*wid*1.05,L*.3,L*wid*1.1,0,0)}
    x.fillStyle=lg(0,0,L,0,[[0,pal[0]],[.5,pal[1]],[1,pal[2]]]);x.fill();x.strokeStyle='rgba(255,255,255,.55)';x.lineWidth=2;x.lineCap='round';x.beginPath();x.moveTo(L*.12,0);x.lineTo(L*.88,0);x.moveTo(L*.15,0);x.lineTo(L*.7,-L*wid*.55);x.moveTo(L*.15,0);x.lineTo(L*.7,L*wid*.55);x.stroke();x.restore()}}
function lily(r,pal){petals(r,pal,6,.34,false);x.beginPath();x.arc(0,0,r*.1,0,7);x.fillStyle=pal[0];x.fill()}
function poin(r,pal){petals(r,['#C8102E','#FF2A3D','#FF8A80'],8,.3,true);x.save();x.rotate(.4);petals(r*.68,['#E31B3C','#FF4B5C','#FFB3B8'],7,.3,true);x.restore();
  [[0,0,.1],[.12,-.1,.07],[-.1,-.12,.07],[.1,.12,.07],[-.13,.08,.07],[0,-.2,.06],[.2,0,.06]].forEach(([a,b,q],i)=>{x.beginPath();x.arc(a*r,b*r,q*r,0,7);x.fillStyle=rg(a*r,b*r,0,q*r,[[0,'#F3FF3A'],[1,i%2?'#FF9E1F':'#A9C47A']]);x.fill()})}
function holly(r){[[-1.95,.95],[-.5,1],[1.25,.9]].forEach(([a,k])=>{x.save();x.rotate(a);const L=r*k,W=L*.24;x.beginPath();const top=[],bot=[];for(let i=0;i<=6;i++){const t=i/6,hw=Math.sin(Math.PI*Math.pow(t,.75))*W;top.push([L*t,-hw]);top.push([L*(t+1/12),-hw*.5]);bot.push([L*t,hw]);bot.push([L*(t+1/12),hw*.5])}
    x.moveTo(0,0);top.forEach(p=>x.lineTo(p[0],p[1]));x.lineTo(L,0);bot.reverse().forEach(p=>x.lineTo(p[0],p[1]));x.closePath();x.fillStyle=lg(0,0,L,0,[[0,'#2F5D45'],[1,'#7DB88A']]);x.fill();x.strokeStyle='rgba(255,255,255,.3)';x.lineWidth=2;x.beginPath();x.moveTo(L*.05,0);x.lineTo(L*.92,0);x.stroke();x.restore()});
  [[-12,0],[12,2],[0,-16]].forEach(([a,b])=>{x.beginPath();x.arc(a,b,r*.1,0,7);x.fillStyle=rg(a-4,b-4,0,r*.12,[[0,'#FFB07A'],[.5,'#FF2A3D'],[1,'#B0102A']]);x.fill()})}
function fir(r){for(let k=0;k<7;k++){x.save();x.rotate(-Math.PI*.95+k*Math.PI*.32);const L=r*(.8+((k*3)%3)*.12);leaf(L,L*.07,'#2F5D45','#7BB486',false);
    for(let t=.2;t<.85;t+=.17){[-1,1].forEach(sg=>{x.save();x.translate(L*t,0);x.rotate(sg*.75);leaf(L*.38*(1-t*.5),L*.055,t<.5?'#3F7D59':'#5E9B6F','#A9C99C',false);x.restore()})}x.restore()}
  x.beginPath();x.arc(0,0,r*.07,0,7);x.fillStyle='#FF2A3D';x.fill()}
function mistle(r){for(let k=0;k<4;k++){x.save();x.rotate(-Math.PI*.8+k*Math.PI*.45);leaf(r*.85,r*.2,'#9FB873','#DDE7A0');x.translate(r*.4,0);x.rotate(.7);leaf(r*.5,r*.14,'#A9C47A','#E6EEB8',false);x.restore()}
  [[-14,-8],[12,-12],[0,10],[16,10],[-18,12]].forEach(([a,b])=>{x.beginPath();x.arc(a,b,r*.11,0,7);x.fillStyle=rg(a-4,b-4,0,r*.13,[[0,'#FFFFFF'],[1,'#FFD6E6']]);x.fill()})}
function berry(r){x.strokeStyle='#3F7D59';x.lineWidth=5;x.lineCap='round';const P=[];for(let k=0;k<9;k++){const a=k*2.4,d=r*(.12+k*.085);P.push([Math.cos(a)*d,Math.sin(a)*d])}
  P.forEach(p=>{x.beginPath();x.moveTo(0,0);x.lineTo(p[0],p[1]);x.stroke()});P.forEach(([a,b],i)=>{x.beginPath();x.arc(a,b,r*.17,0,7);x.fillStyle=rg(a-r*.05,b-r*.05,0,r*.19,[[0,i%3?'#FF9A6B':'#FFC09A'],[.45,i%2?'#FF2A3D':'#FF4B2A'],[1,'#B0102A']]);x.fill()})}
function ivy(r){for(let k=0;k<5;k++){x.save();x.rotate(-Math.PI*.95+k*Math.PI*.4);const L=r*(.8+((k*5)%3)*.08);[-.75,0,.75].forEach((a,i)=>{x.save();x.translate(L*.3*(i?.7:0),0);x.rotate(a);leaf(L*(i===1?.75:.55),L*.2,'#2F5D45','#8FC39A');x.restore()});x.restore()}}
function amaryl(r){petals(r,['#C8102E','#FF4B5C','#FFE8EA'],6,.42,false);x.beginPath();for(let k=0;k<8;k++)x.lineTo(Math.cos(k*Math.PI/4)*(k%2?r*.05:r*.12),Math.sin(k*Math.PI/4)*(k%2?r*.05:r*.12));x.closePath();x.fillStyle='#F3FF3A';x.fill()}
function bud(len){x.beginPath();x.moveTo(0,0);x.bezierCurveTo(-len*.45,-len*.25,-len*.3,-len*.8,0,-len);x.bezierCurveTo(len*.3,-len*.8,len*.45,-len*.25,0,0);x.fillStyle=lg(0,0,0,-len,[[0,'#FFE81F'],[.5,'#FF9A1F'],[1,'#FF3B1F']]);x.fill();
  [-1,1].forEach(sg=>{x.save();x.rotate(Math.PI/2+sg*.9);leaf(len*.42,len*.13,'#2F5D45','#3F7D59',false);x.restore()})}
function stem(pts,w){x.beginPath();x.moveTo(pts[0][0],pts[0][1]);x.bezierCurveTo(pts[1][0],pts[1][1],pts[2][0],pts[2][1],pts[3][0],pts[3][1]);x.strokeStyle=DG;x.lineWidth=w;x.lineCap='round';x.stroke()}
function blob(){x.beginPath();x.moveTo(0,-330);x.bezierCurveTo(190,-330,280,-120,170,60);x.bezierCurveTo(120,160,140,260,60,330);x.bezierCurveTo(-60,380,-190,200,-190,40);x.bezierCurveTo(-190,-160,-120,-330,0,-330);x.fillStyle=lg(0,-330,0,330,[[0,'#A9C99C'],[1,'#BAD6AE']]);x.fill()}
function swoosh(){x.beginPath();x.moveTo(-170,70);x.bezierCurveTo(-120,-60,60,-90,150,-20);x.bezierCurveTo(200,20,210,90,250,70);x.bezierCurveTo(290,50,270,-10,250,-30);x.bezierCurveTo(330,-30,300,90,230,100);x.bezierCurveTo(130,110,60,30,-30,70);x.bezierCurveTo(-80,90,-130,100,-170,70);x.closePath();x.fillStyle=lg(-170,0,250,0,[[0,'#2F5D45'],[.6,'#5E9B6F'],[1,'#3F7D59']]);x.fill()}
const hero={0:poin,1:holly,2:fir,3:mistle,4:berry,5:amaryl,6:ivy,7:fir,8:lily,9:lily,10:berry,11:'mix'};
const pals=[PAL.pink,PAL.red,PAL.pink,PAL.snow,PAL.orange,PAL.pink,PAL.red,PAL.orange,PAL.snow,PAL.orange,PAL.red,PAL.pink];
/* scene items in the reference's coordinates (about 1500x1130): [draw, x, y, rot, delay, sway, front] */
function items(){const H=hero[day],pl=pals[day],mx=day===11,hf=(k)=>mx?[poin,holly,fir][k]:H;
  const LS=(f,r,pal)=>()=>{f===lily||f===poin||f===amaryl?f(r*1.1,pal||PAL.pink):f(r*1.1)};
  return[
  [()=>blob(),610,440,-.12,.0,.01,0],
  [()=>{x.scale(1.5,.6);orb(110,'#9CC48A','#BAD6AE')},750,745,0,.08,.01,0],
  [()=>orb(70,'#DCE8A8','#9CC48A'),740,272,0,.05,.02,0],
  [()=>orb(150,'#E0267F','#B0125F'),757,440,0,.1,.01,0],
  [()=>orb(60,'#2F5D45','#27493A'),300,592,0,.1,.01,0],
  [()=>orb(70,'#2F5D45','#3F7D59',true),532,372,0,.15,.01,0],
  [()=>orb(34,'#2F5D45','#3F7D59',true),927,456,.3,.2,.02,0],
  [()=>leaf(330,100,'#2F5D45','#80B58B'),240,470,-.5,.12,.02,0],
  [()=>{x.save();x.scale(1.2,1);orb(120,'#3F7D59','#7BB486',true);x.restore()},700,880,0,.2,.012,0],
  [()=>swoosh(),1010,880,.12,.25,.012,0],
  [()=>stem([[0,0],[20,60],[-40,130],[-60,200]],8),1215,265,0,.2,.03,0],
  [()=>stem([[0,0],[40,-80],[90,-120],[120,-250]],8),490,1000,0,.2,.02,0],
  [()=>stem([[0,0],[-70,-60],[-100,0],[-150,-40]],7),330,330,0,.2,.03,0],
  [()=>puff(135,PAL.red,.3),585,565,0,.3,.03,0],
  [LS(hf(1),210,pl),400,780,.1,.34,.04,0],
  [LS(hf(0),190,pl),1035,410,-.15,.4,.04,0],
  [()=>puff(112,PAL.pink,.5),465,280,.2,.45,.05,0],
  [()=>puff(56,PAL.pink,.2),820,230,.3,.5,.06,0],
  [()=>bud(120),1230,240,.1,.5,.05,0],
  [()=>bud(110),490,1050,.5,.55,.05,0],
  [()=>bud(62),160,360,-1.15,.55,.06,0],
  [()=>puff(120,pl===PAL.snow?PAL.snow:PAL.red,.1),1030,730,0,.6,.04,1],

function sceneDraw(front,gm){const its=items(),ex=gm;
  its.forEach((it,i)=>{if(!!it[6]!==front)return;const pp=Math.max(.0001,eob(cl((lt-.1-it[4]*1.6)/.6))*ex);
    x.save();x.translate(it[1],it[2]);x.rotate(it[3]+it[5]*Math.sin(T*1.3+i)*1.0+(1-cl((lt-.1-it[4]*1.6)/.6))*-.5);const br=1+.018*Math.sin(T*2+i*1.7);x.scale(pp*br,pp*br);
    if(front)x.globalAlpha=.8;it[0]();if(i===3)circM=x.getTransform();x.restore()})}
/* Lob logo sits in the purple centre circle and moves with it */
let circM=null;
function circleLogo(){if(!circM)return;x.save();x.setTransform(circM);logo(-78,-70,156,'#fff');x.restore()}
const LOGO_P=["M113.886 29.4011C113.886 41.5261 104.676 49.2099 94.954 49.2099C89.6912 49.2099 85.0859 46.9541 82.4545 43.1474L80.7204 48.4345H72.5136L72.5119 0.000103459L82.8962 0V15.0943C85.5586 11.7125 89.7868 9.59227 94.881 9.59227C104.822 9.59227 113.886 17.2761 113.886 29.4011ZM81.9429 29.3306C81.9429 35.2521 86.6942 40.0457 92.9074 40.0457C98.9743 40.0457 103.799 35.3226 103.799 29.3306C103.799 23.3386 98.9743 18.6155 92.9074 18.6155C86.6942 18.6155 81.9429 23.4091 81.9429 29.3306Z", "M0.0016883 48.4347L22.5808 48.4345L25.7235 38.7768L10.3813 38.777L10.3796 0.000103459H0L0.0016883 48.4347Z", "M47.5044 49.2099C59.419 49.2099 68.4098 40.3276 68.4098 29.4011C68.4098 18.404 59.2729 9.59227 47.5044 9.59227C35.6629 9.59227 26.6723 18.404 26.6723 29.4011C26.6723 40.3276 35.6629 49.2099 47.5044 49.2099ZM47.5777 39.9752C41.5106 39.9752 36.7595 35.2521 36.7595 29.3306C36.7595 23.4091 41.5106 18.686 47.5777 18.686C53.5713 18.686 58.3956 23.4091 58.3956 29.3306C58.3956 35.2521 53.5713 39.9752 47.5777 39.9752Z"].map(d=>new Path2D(d));
function logo(px,py,w,col){x.save();x.translate(px,py);const k=w/114;x.scale(k,k);x.fillStyle=col;LOGO_P.forEach(q=>x.fill(q));x.restore()}
function bauble(r,c0,c1){x.fillStyle='#E8B923';x.fillRect(-r*.2,-r*1.22,r*.4,r*.3);x.beginPath();x.arc(0,0,r,0,7);x.fillStyle=lg(0,-r,0,r,[[0,c0],[.55,c1],[1,'#FFE066']]);x.fill();x.beginPath();x.arc(0,-r*1.32,r*.12,0,7);x.strokeStyle='#E8B923';x.lineWidth=3;x.stroke()}
function ln0(){}
function cone(r){x.beginPath();x.ellipse(0,0,r*.55,r,0,0,7);x.fillStyle=lg(-r,0,r,0,[[0,'#C06A3A'],[1,'#6B3419']]);x.fill();x.save();x.clip();x.strokeStyle='rgba(255,220,170,.4)';x.lineWidth=2.5;for(let i=-4;i<=4;i++){x.beginPath();x.arc(i*r*.28,-r*.9,r*.55,.2,Math.PI-.2);x.stroke();x.beginPath();x.arc(i*r*.28,-r*.35,r*.55,.2,Math.PI-.2);x.stroke();x.beginPath();x.arc(i*r*.28,r*.2,r*.55,.2,Math.PI-.2);x.stroke()}x.restore()}
function spark4(r){x.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4-Math.PI/2,rr=i%2?r*.28:r;x.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}x.closePath();x.fillStyle='#FFE81F';x.fill()}
const NAVY='#1F2149',BGS=['#6BAE86','#7A5CFA','#FF8FC8','#FF7A2E'];
function mixc(a,b,k){const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)),A=p(a),B=p(b);return'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*k)).join(',')+')'}
function stampPath(w,h,n,m){const pw=w/n,ph=h/m;
  const edge=(x0,y0,x1,y1,nx,ny,cnt)=>{for(let i=0;i<cnt;i++){const ax=x0+(x1-x0)*i/cnt,ay=y0+(y1-y0)*i/cnt,bx=x0+(x1-x0)*(i+1)/cnt,by=y0+(y1-y0)*(i+1)/cnt,cx=(ax+bx)/2,cy=(ay+by)/2,rr=Math.hypot(bx-ax,by-ay)/2*.72;
    const ta=Math.atan2(ay-cy,ax-cx),tb=Math.atan2(by-cy,bx-cx),tn=Math.atan2(ny,nx);const cw=((tn-ta+Math.PI*2)%(Math.PI*2))<Math.PI;x.lineTo(ax,ay);x.lineTo(cx+Math.cos(ta)*rr,cy+Math.sin(ta)*rr);x.arc(cx,cy,rr,ta,tb,!cw);x.lineTo(bx,by)}};
  const L=-w/2,R=w/2,T0=-h/2,B=h/2;x.beginPath();x.moveTo(L,T0);x.lineTo(L+pw,T0);edge(L+pw,T0,R-pw,T0,0,1,n-2);x.lineTo(R,T0);x.lineTo(R,T0+ph);edge(R,T0+ph,R,B-ph,-1,0,m-2);x.lineTo(R,B);x.lineTo(R-pw,B);edge(R-pw,B,L+pw,B,0,-1,n-2);x.lineTo(L,B);x.lineTo(L,B-ph);edge(L,B-ph,L,T0+ph,1,0,m-2);x.closePath()}
function bigText(str,y,maxW,ex){const f='900 200px "Archivo Black","Arial Black",Arial,sans-serif';x.save();x.font=f;x.letterSpacing='-8px';x.textAlign='left';x.textBaseline='alphabetic';
  x.letterSpacing='-8px';let sz=170;titles.forEach(t=>{const w=x.measureText(t.toLowerCase()).width;sz=Math.min(sz,200*maxW/w*1.0)});x.font=f.replace('200px',sz+'px');x.letterSpacing=(-.04*sz)+'px';
  const cw=[...str].map(c=>x.measureText(c).width),tot=cw.reduce((a,b)=>a+b,0);let cx=540-tot/2;
  [...str].forEach((c,i)=>{const pp=eob(cl((lt-.5-i*.045)/.5))*ex;x.save();x.globalAlpha=cl(pp*1.4);x.translate(cx,y+(1-pp)*70);x.fillStyle=NAVY;x.fillText(c,0,0);x.restore();cx+=cw[i]});x.restore()}
function smallText(str,y,size,delay,ex,col){const p=eio(cl((lt-delay)/.4))*ex,ls=size*.3;x.save();x.globalAlpha=p;x.font='700 '+size+'px "Inter",Arial,sans-serif';x.letterSpacing=ls+'px';x.textAlign='center';x.fillStyle=col;x.fillText(str.toUpperCase(),540+ls/2,y+(1-p)*18);x.restore()}
let corner='12 Days of Holiday';
function cornerText(str,px,py,align,delay,ex,serif){const p=eio(cl((lt-delay)/.4))*ex,size=26,ls=size*.3;x.save();x.globalAlpha=p;x.font=serif?'400 '+size+'px Georgia,"Times New Roman",Times,serif':'400 '+size+'px "Inter",Arial,sans-serif';x.letterSpacing=ls+'px';x.textAlign=align;x.fillStyle=NAVY;x.fillText(str.toUpperCase(),px+(align==='right'?ls:0),py+(1-p)*14);x.restore()}
function draw(){
  x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,S,S);
  x.fillStyle=mixc(BGS[(day+3)%4],BGS[day%4],eio(cl(lt/.5)));x.fillRect(0,0,S,S);
  const ex=1-eio(cl((lt-(D-.7))/.5));
  x.translate(-7,-40); /* centre the stamp and its drop shadow on the canvas */
  /* square perforated stamp the bouquet sits on */
  const W=800,pop=Math.max(.0001,eob(cl(lt/.6))),sk2=1+.012*Math.sin(T*1.4);
  x.save();x.translate(540,572);x.scale(pop*sk2,pop*sk2);x.rotate((1-pop)*-.2+Math.sin(T*1.2)*.004);
  x.save();x.translate(14,16);stampPath(W,W,34,34);x.fillStyle='rgba(31,33,73,.2)';x.fill();x.restore();
  stampPath(W,W,34,34);x.fillStyle=CREAM;x.fill();
  x.beginPath();x.roundRect(-W/2+30,-W/2+30,W-60,W-60,4);x.strokeStyle='rgba(31,33,73,.35)';x.lineWidth=2.5;x.stroke();
  x.beginPath();x.roundRect(-W/2+36,-W/2+36,W-72,W-72,2);x.clip();
  x.translate(-540,-572);
  const scene=front=>{x.save();x.translate(540,572);x.scale(.6,.6);x.translate(-750,-590);sceneDraw(front,ex);x.restore()};
  scene(false);circleLogo();
  bigText(titles[day].toLowerCase(),596,640,ex);
  scene(true);cornerText('Day '+(day+1),204,908,'left',.5,ex,true);cornerText(corner,876,252,'right',.6,ex,true);
  x.restore();
}

/* ---------- loop ---------- */
let last=performance.now();
function tick(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;T+=dt;
  if(playing){lt+=dt*speed;while(lt>=D){lt-=D;day=(day+1)%12;sync()}}
  draw();requestAnimationFrame(tick)}
/* ---------- UI ---------- */
const dEl=document.getElementById('days'),ttl=document.getElementById('ttl');
for(let i=0;i<12;i++){const b=document.createElement('button');b.textContent=i+1;b.setAttribute('aria-label','Day '+(i+1));b.onclick=()=>go(i);dEl.appendChild(b)}
function sync(){[...dEl.children].forEach((b,i)=>b.classList.toggle('on',i===day));if(document.activeElement!==ttl)ttl.value=titles[day]}
function go(i){day=((i%12)+12)%12;lt=0;sync()}
ttl.oninput=()=>{titles[day]=ttl.value||' '};
const cor=document.getElementById('cor');cor.oninput=()=>{corner=cor.value};
const pp=document.getElementById('pp');pp.onclick=()=>{playing=!playing;pp.textContent=playing?'Pause':'Play'};
document.getElementById('png').onclick=()=>{draw();const a=document.createElement('a');a.download='lob-12-days-day-'+(day+1)+'.png';a.href=cv.toDataURL('image/png');a.click()};
document.getElementById('rec').onclick=function(){
  if(!window.MediaRecorder){alert('Recording is not supported in this browser.');return}
  const b=this;b.disabled=true;b.textContent='Recording…';go(day);playing=true;const keep=speed;speed=1;
  const st=cv.captureStream(30),mr=new MediaRecorder(st,{mimeType:MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm',videoBitsPerSecond:12e6}),ch=[];
  mr.ondataavailable=e=>e.data.size&&ch.push(e.data);
  mr.onstop=()=>{const a=document.createElement('a');a.download='lob-12-days-day-'+(day+1)+'.webm';a.href=URL.createObjectURL(new Blob(ch,{type:'video/webm'}));a.click();speed=keep;b.disabled=false;b.textContent='Record day (WebM)'};
  mr.start();setTimeout(()=>mr.stop(),D*1000-60)};
addEventListener('keydown',e=>{if(e.target===ttl)return;if(e.key==='ArrowRight')go(day+1);if(e.key==='ArrowLeft')go(day-1);if(e.key===' '){e.preventDefault();pp.click()}});
window.__ad={go,play(){playing=true},pause(){playing=false},seek(d,t){day=d;lt=t;playing=false;sync()},D};
addEventListener('message',e=>{if(POST&&e.data&&typeof e.data.day==='number')go(e.data.day)});
sync();requestAnimationFrame(tick);
})();
