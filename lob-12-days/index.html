<title>Lob 12 Days Advent</title>
<meta name="description" content="A 1:1 social motion post for the 12 Days of Lob advent calendar: a perforated holiday stamp drops in for each day with a flat line-art illustration and a title.">
<style>
:root{--sans:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;--navy:#1F2149;--pink:#F8E0F9;--mag:#B042C2;--btn:#4534F2}
*{box-sizing:border-box;margin:0}
html{background:#000}
body{min-height:100dvh;display:flex;flex-direction:column;background:var(--navy);color:#fff;font:400 14px/1.4 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit}
nav.back{flex:none;display:flex;align-items:center;gap:8px;height:49px;padding:0 20px;background:#000;border-bottom:1px solid #1c1c1c;font:400 13px/1.35 var(--sans);white-space:nowrap;overflow:hidden}

.wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:12px}
canvas{display:block;aspect-ratio:1/1;width:min(100%,calc(100dvh - 49px - 120px));max-width:100%;height:auto;background:#A9CCE0}
.ctl{flex:none;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;padding:10px 16px 16px}
.days{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.days button,.ctl .b{min-width:34px;height:34px;padding:0 12px;border-radius:99px;border:1px solid rgba(255,255,255,.25);background:none;cursor:pointer;font-weight:600}
.days button.on{background:var(--pink);color:var(--navy);border-color:var(--pink)}
.ctl .b.hot{background:var(--btn);border-color:var(--btn)}
.ctl input{height:34px;width:230px;max-width:100%;padding:0 14px;border-radius:99px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08)}
button:focus-visible,input:focus-visible{outline:2px solid #EAF265;outline-offset:2px}
.clip .ctl{display:none}
.clip .wrap{padding:0}
.clip canvas{width:min(100vw,calc(100dvh - 49px))}
</style>

  x.font='italic 56px Georgia,serif';x.letterSpacing='0px';const lobW=x.measureText('Lob').width;
  txt('Lob',S-70-lobW,112,56,C.btn,{f:'Georgia,serif',it:true,w:'normal'});
  txt('12 Days of',S-70-lobW-14,112,38,NV,{al:'right'});
  const ex=1-eio(cl((lt-(D-.7))/.5));
  const np=eob(cl((lt-.05)/.55)),nS=Math.max(.0001,np*ex),mp=eio(cl((lt-.4)/.4))*ex;
  x.save();x.translate(70,430);x.scale(nS,nS);txt(String(day+1),0,0,250,C.btn,{ls:-8});x.restore();
  x.save();x.globalAlpha=mp;txt('December',72,508+(1-mp)*18,64,NV,{f:'Georgia,serif',it:true,w:'normal'});x.restore();
  /* the stamp drops in, tilts and settles */
  const p=cl((lt-.2)/.7),sc=Math.max(.0001,eob(p)*ex),rot=(1-eob(p))*-.3+Math.sin(T*1.4)*.012,bob=Math.sin(T*1.6)*5;
  x.save();x.translate(HX,HY+bob);x.scale(1.25,1.25);
  stamp(day,sc,rot,14,true);stamp(day,sc,rot,0,false);
  const ap=Math.max(.0001,eob(cl((lt-.6)/.6))*ex);
  x.save();x.rotate(rot);x.scale(ap*sc,ap*sc);x.translate(0,spec[day].h>400?4:0);art[day]();x.restore();
  x.restore();
  /* label button flies out of the stamp (as in the reference code) */
  const label=titles[day].toUpperCase();x.font='bold 28px Arial';x.letterSpacing='3.5px';const tw=x.measureText(label).width;
  const bw=56+tw+30,bh=68,u=cl((lt-1.3)/.9),f=eio(u);
  if(lt>1.3&&ex>0){
    const rx=70+bw/2,ry=860,cx=HX+(rx-HX)*f,cy=HY+(ry-HY)*f-120*Math.sin(Math.PI*f);
    const cw=170+(bw-170)*eob(u),ch=63+(bh-63)*f,sx=Math.max(ex,.001);
    x.save();x.translate(cx,cy);x.scale(sx,sx);x.fillStyle=mixc(C.yellow,C.btn,f);x.beginPath();x.roundRect(-cw/2,-ch/2,cw,ch,10);x.fill();
    const ta=cl((f-.55)/.45);
    if(ta>0){x.globalAlpha=ta;x.strokeStyle=C.plus;x.lineWidth=LW;x.lineCap='square';x.beginPath();x.moveTo(-bw/2+17,0);x.lineTo(-bw/2+39,0);x.moveTo(-bw/2+28,-11);x.lineTo(-bw/2+28,11);x.stroke();
      txt(label,-bw/2+56,10,28,C.white,{ls:3.5});x.globalAlpha=1}
    x.restore();
    const dp=cl((u-.85)/.15)*ex;
    if(dp>0){x.save();x.globalAlpha=dp;x.strokeStyle=WH;x.lineWidth=LW;x.setLineDash([8,10]);x.lineDashOffset=-T*20;x.lineCap='round';x.beginPath();x.roundRect(70-16,ry-bh/2-16,bw+32,bh+32,14);x.stroke();x.restore()}
  }
  for(let i=0;i<12;i++){const cur=i===day;pill(70+i*70,985,cur?62:56,14,i<day?C.btn:cur?PK:'rgba(255,255,255,.6)')}
}

/* ---------- loop ---------- */
let last=performance.now();
function tick(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;T+=dt;
  if(playing){lt+=dt*speed;while(lt>=D){lt-=D;day=(day+1)%12;sync()}}
  draw();requestAnimationFrame(tick)}
/* ---------- UI ---------- */
const dEl=document.getElementById('days'),ttl=document.getElementById('ttl');
for(let i=0;i<12;i++){const b=document.createElement('button');b.textContent=i+1;b.setAttribute('aria-label','Day '+(i+1));b.onclick=()=>go(i);dEl.appendChild(b)}
function sync(){[...dEl.children].forEach((b,i)=>b.classList.toggle('on',i===day));if(document.activeElement!==ttl)ttl.value=titles[day]}
function go(i){day=((i%12)+12)%12;lt=0;sync()}
ttl.oninput=()=>{titles[day]=ttl.value||' '};
const pp=document.getElementById('pp');pp.onclick=()=>{playing=!playing;pp.textContent=playing?'Pause':'Play'};
document.getElementById('png').onclick=()=>{draw();const a=document.createElement('a');a.download='lob-12-days-day-'+(day+1)+'.png';a.href=cv.toDataURL('image/png');a.click()};
document.getElementById('rec').onclick=function(){
  if(!window.MediaRecorder){alert('Recording is not supported in this browser.');return}
  const b=this;b.disabled=true;b.textContent='Recording…';go(day);playing=true;const keep=speed;speed=1;
  const st=cv.captureStream(30),mr=new MediaRecorder(st,{mimeType:MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm',videoBitsPerSecond:12e6}),ch=[];
  mr.ondataavailable=e=>e.data.size&&ch.push(e.data);
  mr.onstop=()=>{const a=document.createElement('a');a.download='lob-12-days-day-'+(day+1)+'.webm';a.href=URL.createObjectURL(new Blob(ch,{type:'video/webm'}));a.click();speed=keep;b.disabled=false;b.textContent='Record day (WebM)'};
  mr.start();setTimeout(()=>mr.stop(),D*1000-60)};
addEventListener('keydown',e=>{if(e.target===ttl)return;if(e.key==='ArrowRight')go(day+1);if(e.key==='ArrowLeft')go(day-1);if(e.key===' '){e.preventDefault();pp.click()}});
window.__ad={go,play(){playing=true},pause(){playing=false},seek(d,t){day=d;lt=t;playing=false;sync()},D};
sync();requestAnimationFrame(tick);
})();
</script>
